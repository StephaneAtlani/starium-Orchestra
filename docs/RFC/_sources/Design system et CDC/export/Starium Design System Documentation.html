  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

face {\n  font-family: 'JetBrains Mono';\n  font-style: normal;\n  font-weight: 500;\n  font-display: swap;\n  src: url(\"316f4314-2d67-488e-8b66-2a099d593649\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'JetBrains Mono';\n  font-style: normal;\n  font-weight: 500;\n  font-display: swap;\n  src: url(\"632b197a-0508-46ff-8d91-43779d933e02\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n@font-face {\n  font-family: 'Manrope';\n  font-style: normal;\n  font-weight: 200 800;\n  font-display: swap;\n  src: url(\"c0f0b594-1b71-4c81-adb1-97f94f43965d\") format('truetype');\n}\n\n:root {\n  /* ---------- Brand ---------- */\n  --brand-gold:        #E8A317;   /* ambre brûlé — accent principal */\n  --brand-gold-600:    #CC8E0E;   /* hover */\n  --brand-gold-700:    #5F3F00;   /* press / texte sur tint */\n  --brand-gold-100:    #F4D58A;   /* tints, badges */\n  --brand-gold-050:    #FBEAB5;   /* surface très claire */\n  --brand-ink:         #0E0E10;   /* logo black, primary text */\n\n  /* ---------- Neutrals (warm, paper-tinted) ---------- */\n  --neutral-0:    #FFFFFF;\n  --neutral-50:   #FAF9F7;        /* page bg */\n  --neutral-100:  #F4F2EE;        /* subtle surface */\n  --neutral-200:  #E9E6E0;        /* borders, dividers */\n  --neutral-300:  #D6D2CA;\n  --neutral-400:  #B6B0A4;\n  --neutral-500:  #8C8579;        /* muted text */\n  --neutral-600:  #5F5A52;\n  --neutral-700:  #403D38;\n  --neutral-800:  #26241F;\n  --neutral-900:  #14130F;\n\n  /* ---------- Semantic state ---------- */\n  --state-success:     #1F8A5B;\n  --state-success-bg:  #E6F4ED;\n  --state-warning:     #C77A00;\n  --state-warning-bg:  #FFF1DC;\n  --state-danger:      #B42318;\n  --state-danger-bg:   #FBE8E6;\n  --state-info:        #2A6FDB;\n  --state-info-bg:     #E3EEFB;\n\n  /* ---------- Foreground / Background tokens ---------- */\n  --fg-1:        var(--brand-ink);     /* primary text */\n  --fg-2:        var(--neutral-700);   /* body */\n  --fg-3:        var(--neutral-500);   /* muted/meta */\n  --fg-4:        var(--neutral-400);   /* placeholder */\n  --fg-on-gold:  var(--brand-ink);     /* text over gold */\n  --fg-on-ink:   var(--neutral-0);\n\n  --bg-app:      var(--neutral-50);\n  --bg-surface:  var(--neutral-0);\n  --bg-sunken:   var(--neutral-100);\n  --bg-tint:     var(--brand-gold-050);\n  --bg-ink:      var(--brand-ink);\n\n  --border-subtle:  var(--neutral-200);\n  --border-strong:  var(--neutral-300);\n  --border-focus:   var(--brand-gold);\n\n  /* ---------- Type ---------- */\n  --font-sans:    'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;\n  --font-display: 'Manrope', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;\n  --font-mono:    'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;\n\n  /* Display sizes — tight, heavy, Apple-flavored */\n  --text-display-xl: 800 64px/1.05 var(--font-display);\n  --text-display-l:  800 48px/1.08 var(--font-display);\n  --text-display-m:  700 36px/1.12 var(--font-display);\n\n  --text-h1:   700 28px/1.2 var(--font-sans);\n  --text-h2:   700 22px/1.25 var(--font-sans);\n  --text-h3:   600 18px/1.3 var(--font-sans);\n  --text-h4:   600 15px/1.35 var(--font-sans);\n\n  --text-body-l:    400 17px/1.55 var(--font-sans);\n  --text-body:      400 15px/1.55 var(--font-sans);\n  --text-body-s:    400 13px/1.5 var(--font-sans);\n  --text-caption:   500 12px/1.4 var(--font-sans);\n  --text-overline:  600 11px/1.2 var(--font-sans); /* uppercase, tracked */\n\n  --text-mono:   500 13px/1.5 var(--font-mono);\n\n  --tracking-tight:    -0.02em;\n  --tracking-normal:    0;\n  --tracking-wide:      0.04em;\n  --tracking-overline:  0.08em;\n\n  /* ---------- Spacing (4px base) ---------- */\n  --space-0:   0;\n  --space-1:   4px;\n  --space-2:   8px;\n  --space-3:   12px;\n  --space-4:   16px;\n  --space-5:   20px;\n  --space-6:   24px;\n  --space-8:   32px;\n  --space-10:  40px;\n  --space-12:  48px;\n  --space-16:  64px;\n  --space-20:  80px;\n  --space-24:  96px;\n\n  /* ---------- Radius ---------- */\n  --radius-xs:  4px;\n  --radius-sm:  6px;\n  --radius-md:  10px;\n  --radius-lg:  14px;\n  --radius-xl:  20px;\n  --radius-2xl: 28px;\n  --radius-pill: 999px;\n\n  /* ---------- Shadow / elevation ---------- */\n  --shadow-1: 0 1px 2px rgba(14,14,16,0.04), 0 1px 1px rgba(14,14,16,0.03);\n  --shadow-2: 0 2px 6px rgba(14,14,16,0.06), 0 1px 2px rgba(14,14,16,0.04);\n  --shadow-3: 0 8px 24px rgba(14,14,16,0.08), 0 2px 6px rgba(14,14,16,0.04);\n  --shadow-4: 0 24px 60px rgba(14,14,16,0.12), 0 6px 16px rgba(14,14,16,0.06);\n  --shadow-focus: 0 0 0 3px rgba(232,163,23,0.32);\n\n  /* ---------- Motion ---------- */\n  --ease-standard:  cubic-bezier(0.2, 0, 0, 1);   /* @kind other */\n  --ease-emphasis:  cubic-bezier(0.2, 0, 0, 1.2); /* @kind other */\n  --ease-exit:      cubic-bezier(0.4, 0, 1, 1);   /* @kind other */\n  --duration-fast:    120ms; /* @kind other */\n  --duration-base:    200ms; /* @kind other */\n  --duration-slow:    320ms; /* @kind other */\n\n  /* ---------- Layout ---------- */\n  --container-max:    1280px;\n  --sidebar-width:    248px;\n  --topbar-height:    64px;\n}\n\n/* =========================================================\n   Semantic element styles — drop these on plain HTML.\n   ========================================================= */\n\nhtml, body {\n  background: var(--bg-app);\n  color: var(--fg-1);\n  font: var(--text-body);\n  -webkit-font-smoothing: antialiased;\n  text-rendering: optimizeLegibility;\n}\n\nh1, .h1 { font: var(--text-h1); letter-spacing: var(--tracking-tight); color: var(--fg-1); }\nh2, .h2 { font: var(--text-h2); letter-spacing: var(--tracking-tight); color: var(--fg-1); }\nh3, .h3 { font: var(--text-h3); color: var(--fg-1); }\nh4, .h4 { font: var(--text-h4); color: var(--fg-1); }\n\n.display-xl { font: var(--text-display-xl); letter-spacing: var(--tracking-tight); }\n.display-l  { font: var(--text-display-l);  letter-spacing: var(--tracking-tight); }\n.display-m  { font: var(--text-display-m);  letter-spacing: var(--tracking-tight); }\n\np { font: var(--text-body); color: var(--fg-2); margin: 0; }\n.body-l  { font: var(--text-body-l);  color: var(--fg-2); }\n.body    { font: var(--text-body);    color: var(--fg-2); }\n.body-s  { font: var(--text-body-s);  color: var(--fg-3); }\n.caption { font: var(--text-caption); color: var(--fg-3); }\n.overline {\n  font: var(--text-overline);\n  letter-spacing: var(--tracking-overline);\n  text-transform: uppercase;\n  color: var(--fg-3);\n}\ncode, .mono { font: var(--text-mono); }\n\na { color: var(--brand-gold-700); text-decoration: none; }\na:hover { color: var(--brand-gold-600); }\n\n::selection { background: var(--brand-gold-100); color: var(--brand-ink); }\n<\u002Fstyle>\n\n<style>\n*,*::before,*::after { box-sizing: border-box; margin: 0; padding: 0; }\nhtml { scroll-behavior: smooth; }\nbody { font-family: var(--font-sans); background: var(--bg-app); color: var(--fg-1); -webkit-font-smoothing: antialiased; }\n\n/* ── LAYOUT ─────────────────────────────────────────── */\n.shell { display: grid; grid-template-columns: 240px 1fr; min-height: 100vh; }\n\n/* ── SIDENAV ─────────────────────────────────────────── */\n.sidenav {\n  background: #1A1814;\n  position: sticky; top: 0; height: 100vh;\n  overflow-y: auto; scrollbar-width: none;\n  display: flex; flex-direction: column;\n  padding: 0 0 24px;\n}\n.sidenav::-webkit-scrollbar { display: none; }\n.sn-brand { padding: 20px 20px 18px; border-bottom: 1px solid rgba(255,255,255,.08); flex-shrink: 0; }\n.sn-brand img { height: 24px; display: block; }\n.sn-group { padding: 20px 16px 4px; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: rgba(255,255,255,.3); }\n.sn-link { display: block; padding: 7px 16px; font-size: 12.5px; font-weight: 500; color: rgba(255,255,255,.6); text-decoration: none; border-radius: 6px; margin: 0 8px; transition: background 100ms, color 100ms; }\n.sn-link:hover { background: rgba(255,255,255,.07); color: #FFFFFD; }\n.sn-link.active { background: var(--brand-gold); color: #1A1814; font-weight: 700; }\n\n/* ── CONTENT ─────────────────────────────────────────── */\n.content { max-width: 900px; padding: 56px 64px 120px; }\n\n/* ── SECTIONS ─────────────────────────────────────────── */\n.ds-section { margin-bottom: 80px; scroll-margin-top: 32px; }\n.ds-section + .ds-section { border-top: 1px solid var(--border-subtle); padding-top: 72px; }\n\n/* ── HEADINGS ─────────────────────────────────────────── */\n.eyebrow { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: var(--brand-gold-700); margin-bottom: 10px; }\nh1.doc { font: 800 52px/1.06 var(--font-display); letter-spacing: -0.03em; color: var(--fg-1); }\nh2.doc { font: 700 28px/1.15 var(--font-display); letter-spacing: -0.025em; color: var(--fg-1); margin-bottom: 20px; }\nh3.doc { font: 600 16px/1.3 var(--font-sans); color: var(--fg-1); margin: 32px 0 12px; }\n.lead { font: 400 18px/1.6 var(--font-sans); color: var(--fg-2); margin-top: 16px; max-width: 640px; }\np.body { font: var(--text-body); color: var(--fg-2); line-height: 1.65; margin-bottom: 14px; }\n\n/* ── RULE ─────────────────────────────────────────────── */\n.rule { height: 1px; background: var(--border-subtle); margin: 28px 0; }\n\n/* ── CHIP / BADGE ─────────────────────────────────────── */\n.chip { display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px; border-radius: 999px; font-size: 11.5px; font-weight: 600; }\n.chip-gold { background: var(--brand-gold-100); color: var(--brand-gold-700); }\n.chip-success { background: var(--state-success-bg); color: var(--state-success); }\n.chip-warning { background: var(--state-warning-bg); color: var(--state-warning); }\n.chip-danger { background: var(--state-danger-bg); color: var(--state-danger); }\n.chip-info { background: var(--state-info-bg); color: var(--state-info); }\n.chip-neutral { background: var(--neutral-100); color: var(--fg-3); }\n.chip-purple { background: #ece9f8; color: #5b4ec8; }\n\n/* ── COLOR SWATCHES ─────────────────────────────────────── */\n.color-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-top: 16px; }\n.color-grid-wide { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; margin-top: 16px; }\n.swatch { border-radius: 10px; overflow: hidden; border: 1px solid rgba(0,0,0,.06); }\n.swatch-color { height: 64px; }\n.swatch-info { padding: 8px 10px; background: var(--bg-surface); }\n.swatch-name { font-size: 11.5px; font-weight: 700; color: var(--fg-1); margin-bottom: 1px; }\n.swatch-hex { font-family: var(--font-mono); font-size: 11px; color: var(--fg-3); }\n.swatch-token { font-family: var(--font-mono); font-size: 10px; color: var(--fg-4); margin-top: 1px; }\n\n/* ── TYPE SPECIMENS ─────────────────────────────────────── */\n.type-row { display: flex; align-items: baseline; gap: 28px; padding: 18px 0; border-bottom: 1px solid var(--border-subtle); }\n.type-row:last-child { border-bottom: none; }\n.type-meta { width: 160px; flex-shrink: 0; }\n.type-meta-label { font-size: 12px; font-weight: 600; color: var(--fg-2); }\n.type-meta-token { font-family: var(--font-mono); font-size: 10.5px; color: var(--fg-4); margin-top: 2px; }\n.type-specimen { flex: 1; }\n.type-spec-sub { font-size: 12px; color: var(--fg-3); margin-top: 4px; }\n\n/* ── SPACING TABLE ─────────────────────────────────────── */\n.sp-row { display: flex; align-items: center; gap: 20px; padding: 10px 0; border-bottom: 1px solid var(--border-subtle); }\n.sp-row:last-child { border-bottom: none; }\n.sp-token { font-family: var(--font-mono); font-size: 12px; color: var(--fg-2); width: 110px; flex-shrink: 0; }\n.sp-val { font-size: 12px; color: var(--fg-3); width: 50px; flex-shrink: 0; }\n.sp-bar-wrap { flex: 1; }\n.sp-bar { height: 8px; background: var(--brand-gold); border-radius: 2px; }\n\n/* ── RADIUS GRID ─────────────────────────────────────────── */\n.radius-grid { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 16px; }\n.radius-demo { display: flex; flex-direction: column; align-items: center; gap: 8px; }\n.radius-box { width: 56px; height: 56px; background: var(--brand-gold-100); border: 1.5px solid var(--brand-gold); }\n.radius-label { font-family: var(--font-mono); font-size: 10.5px; color: var(--fg-3); text-align: center; }\n\n/* ── SHADOW GRID ─────────────────────────────────────────── */\n.shadow-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-top: 16px; }\n.shadow-demo { background: var(--bg-surface); border-radius: 12px; height: 72px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; }\n.shadow-token { font-family: var(--font-mono); font-size: 10.5px; color: var(--fg-3); }\n.shadow-use { font-size: 11px; color: var(--fg-4); }\n\n/* ── MOTION TABLE ─────────────────────────────────────────── */\n.motion-row { display: flex; align-items: center; gap: 16px; padding: 12px 0; border-bottom: 1px solid var(--border-subtle); }\n.motion-row:last-child { border-bottom: none; }\n.motion-token { font-family: var(--font-mono); font-size: 12px; color: var(--fg-2); width: 180px; flex-shrink: 0; }\n.motion-val { font-size: 12px; color: var(--fg-3); width: 280px; flex-shrink: 0; }\n.motion-demo-btn { height: 30px; padding: 0 14px; border-radius: 7px; border: 1px solid var(--border-strong); background: var(--bg-surface); font: inherit; font-size: 12px; font-weight: 600; cursor: pointer; color: var(--fg-1); white-space: nowrap; transition: background 200ms var(--ease-standard); }\n.motion-demo-btn:hover { background: var(--neutral-100); }\n\n/* ── COMPONENT PREVIEWS ─────────────────────────────────── */\n.preview-box { background: var(--bg-sunken); border: 1px solid var(--border-subtle); border-radius: 12px; padding: 28px; margin-top: 16px; }\n.preview-box-dark { background: #1A1814; border-radius: 12px; padding: 28px; margin-top: 16px; }\n.preview-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }\n.preview-col { display: flex; flex-direction: column; gap: 12px; }\n\n/* ── BUTTONS ─────────────────────────────────────────────── */\n.btn { display: inline-flex; align-items: center; gap: 7px; height: 38px; padding: 0 18px; border-radius: var(--radius-md); border: 1px solid transparent; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; transition: background 120ms var(--ease-standard), border-color 120ms; white-space: nowrap; }\n.btn svg { width: 15px; height: 15px; }\n.btn-primary { background: var(--brand-gold); color: var(--brand-ink); border-color: var(--brand-gold); }\n.btn-primary:hover { background: var(--brand-gold-600); border-color: var(--brand-gold-600); }\n.btn-secondary { background: var(--bg-surface); color: var(--fg-1); border-color: var(--border-strong); }\n.btn-secondary:hover { background: var(--neutral-100); }\n.btn-ghost { background: transparent; color: var(--fg-2); }\n.btn-ghost:hover { background: var(--neutral-100); }\n.btn-danger { background: var(--state-danger-bg); color: var(--state-danger); border-color: var(--state-danger-bg); }\n.btn-danger:hover { background: var(--state-danger); color: #fff; }\n.btn-sm { height: 30px; padding: 0 12px; font-size: 12px; border-radius: var(--radius-sm); }\n.btn-lg { height: 46px; padding: 0 24px; font-size: 15px; border-radius: var(--radius-md); }\n.btn:disabled { opacity: .4; cursor: not-allowed; pointer-events: none; }\n\n/* ── INPUTS ──────────────────────────────────────────────── */\n.input-group { display: flex; flex-direction: column; gap: 6px; }\n.input-label { font-size: 12.5px; font-weight: 600; color: var(--fg-1); }\n.input-hint { font-size: 11.5px; color: var(--fg-3); }\n.input-error { font-size: 11.5px; color: var(--state-danger); }\n.input {\n  height: 38px; padding: 0 14px;\n  border: 1.5px solid var(--border-subtle);\n  border-radius: var(--radius-md);\n  background: var(--bg-surface);\n  font: inherit; font-size: 13px; color: var(--fg-1);\n  transition: border-color 120ms, box-shadow 120ms;\n  outline: none;\n}\n.input::placeholder { color: var(--fg-4); }\n.input:hover { border-color: var(--border-strong); }\n.input:focus { border-color: var(--brand-gold); box-shadow: var(--shadow-focus); }\n.input.error { border-color: var(--state-danger); }\n.input.error:focus { box-shadow: 0 0 0 3px rgba(180,35,24,.22); }\n.input-addon { display: flex; align-items: center; gap: 0; }\n.input-addon .addon { height: 38px; padding: 0 12px; background: var(--neutral-100); border: 1.5px solid var(--border-subtle); display: flex; align-items: center; font-size: 12.5px; font-weight: 500; color: var(--fg-3); }\n.input-addon .addon-left { border-right: none; border-radius: var(--radius-md) 0 0 var(--radius-md); }\n.input-addon .addon-right { border-left: none; border-radius: 0 var(--radius-md) var(--radius-md) 0; }\n.input-addon .input { border-radius: 0; flex: 1; }\ntextarea.input { height: auto; padding: 10px 14px; resize: vertical; line-height: 1.55; }\n\n/* ── CARDS ────────────────────────────────────────────────── */\n.card { background: var(--bg-surface); border: 1px solid var(--border-subtle); border-radius: var(--radius-lg); padding: 20px; box-shadow: var(--shadow-1); }\n.card-title { font: var(--text-h4); color: var(--fg-1); margin-bottom: 6px; font-weight: 700; }\n.card-body { font: var(--text-body-s); color: var(--fg-3); }\n\n/* ── KPI CARD ─────────────────────────────────────────────── */\n.kpi-card { display: flex; align-items: center; gap: 14px; background: var(--bg-surface); border: 1px solid var(--border-subtle); border-radius: var(--radius-lg); padding: 16px 20px; box-shadow: var(--shadow-1); }\n.kpi-icon { color: var(--brand-gold); flex-shrink: 0; }\n.kpi-icon svg { width: 34px; height: 34px; stroke-width: 1.5; }\n.kpi-label { font-size: 11.5px; color: var(--fg-3); }\n.kpi-value { font: 700 26px/1.1 var(--font-display); letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }\n.kpi-foot { font-size: 11px; margin-top: 2px; color: var(--fg-3); }\n.kpi-foot.ok { color: var(--state-success); }\n.kpi-foot.warn { color: var(--brand-gold-700); }\n.kpi-foot.bad { color: var(--state-danger); }\n\n/* ── PROGRESS ─────────────────────────────────────────────── */\n.prog { height: 6px; background: var(--neutral-200); border-radius: 999px; overflow: hidden; }\n.prog-fill { height: 100%; border-radius: 999px; }\n.prog-fill.ok { background: var(--state-success); }\n.prog-fill.warn { background: var(--brand-gold); }\n.prog-fill.bad { background: var(--state-danger); }\n\n/* ── TABLE ────────────────────────────────────────────────── */\n.dt-wrap { overflow-x: auto; }\ntable.dt { width: 100%; border-collapse: collapse; font-size: 13px; }\n.dt th { text-align: left; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--fg-3); padding: 9px 12px; border-bottom: 1px solid var(--border-subtle); white-space: nowrap; }\n.dt td { padding: 11px 12px; border-bottom: 1px solid var(--border-subtle); color: var(--fg-2); vertical-align: middle; }\n.dt tr:last-child td { border-bottom: none; }\n.dt tr:hover td { background: var(--neutral-50); cursor: pointer; }\n.dt td.strong { font-weight: 600; color: var(--fg-1); }\n\n/* ── ALERTS ────────────────────────────────────────────────── */\n.alert { display: flex; align-items: flex-start; gap: 12px; padding: 14px 16px; border-radius: var(--radius-md); font-size: 13px; line-height: 1.5; }\n.alert-success { background: var(--state-success-bg); color: var(--state-success); }\n.alert-warning { background: var(--state-warning-bg); color: var(--state-warning); }\n.alert-danger { background: var(--state-danger-bg); color: var(--state-danger); }\n.alert-info { background: var(--state-info-bg); color: var(--state-info); }\n.alert svg { width: 16px; height: 16px; flex-shrink: 0; margin-top: 1px; }\n.alert-body {}\n.alert-title { font-weight: 700; margin-bottom: 2px; }\n.alert-msg { opacity: .85; }\n\n/* ── SIDEBAR NAV SPECIMEN ─────────────────────────────────── */\n.sidebar-specimen { background: #1A1814; border-radius: 12px; padding: 8px; width: 200px; }\n.sn-item { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 7px; font-size: 12.5px; font-weight: 500; color: rgba(255,255,255,.6); cursor: default; }\n.sn-item.active { background: var(--brand-gold); color: #1A1814; font-weight: 700; }\n.sn-item svg { width: 15px; height: 15px; flex-shrink: 0; }\n.sn-sec { font-size: 9.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: rgba(255,255,255,.28); padding: 10px 10px 3px; }\n\n/* ── TABS ─────────────────────────────────────────────────── */\n.tabs { display: flex; border-bottom: 1px solid var(--border-subtle); }\n.tab { padding: 9px 16px; font-size: 13px; font-weight: 500; color: var(--fg-3); border-bottom: 2px solid transparent; cursor: pointer; }\n.tab:hover { color: var(--fg-1); }\n.tab.active { color: var(--brand-gold-700); border-bottom-color: var(--brand-gold); font-weight: 600; }\n\n/* ── AVATAR ───────────────────────────────────────────────── */\n.av { width: 36px; height: 36px; border-radius: 999px; background: var(--neutral-200); color: var(--neutral-700); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; flex-shrink: 0; }\n.av-gold { background: var(--brand-gold-100); color: var(--brand-gold-700); }\n.av-lg { width: 48px; height: 48px; font-size: 16px; }\n.av-sm { width: 28px; height: 28px; font-size: 10px; }\n\n/* ── FRAMEWORK CARD ───────────────────────────────────────── */\n.fw-card { background: var(--bg-surface); border: 1px solid var(--border-subtle); border-radius: 12px; padding: 18px; }\n.fw-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }\n.fw-name { font-size: 13.5px; font-weight: 700; color: var(--fg-1); }\n.fw-pct { font: 700 28px/1 var(--font-display); letter-spacing: -.02em; color: var(--brand-gold-700); }\n.fw-bar { height: 8px; background: var(--neutral-200); border-radius: 999px; overflow: hidden; margin-bottom: 7px; }\n.fw-fill { height: 100%; border-radius: 999px; background: var(--brand-gold); }\n.fw-meta { font-size: 11.5px; color: var(--fg-3); }\n\n/* ── DO / DON'T ───────────────────────────────────────────── */\n.dd-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 16px; }\n.dd-box { border-radius: 12px; overflow: hidden; border: 1.5px solid; }\n.dd-do { border-color: var(--state-success); }\n.dd-dont { border-color: var(--state-danger); }\n.dd-label { padding: 8px 14px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; display: flex; align-items: center; gap: 7px; }\n.dd-do .dd-label { background: var(--state-success-bg); color: var(--state-success); }\n.dd-dont .dd-label { background: var(--state-danger-bg); color: var(--state-danger); }\n.dd-content { padding: 16px; background: var(--bg-surface); }\n\n/* ── TOPBAR SPECIMEN ──────────────────────────────────────── */\n.topbar-spec { height: 48px; background: var(--bg-surface); border: 1px solid var(--border-subtle); border-radius: 10px; display: flex; align-items: center; padding: 0 16px; gap: 12px; }\n.t-search-spec { display: flex; align-items: center; gap: 8px; flex: 1; max-width: 320px; height: 30px; background: var(--neutral-100); border: 1px solid transparent; border-radius: 7px; padding: 0 10px; color: var(--fg-3); font-size: 12px; }\n.t-search-spec svg { width: 12px; height: 12px; flex-shrink: 0; }\n.t-right-spec { display: flex; align-items: center; gap: 8px; margin-left: auto; }\n.tb-btn-spec { width: 30px; height: 30px; border-radius: 7px; background: transparent; border: none; display: flex; align-items: center; justify-content: center; color: var(--fg-3); cursor: default; }\n.tb-btn-spec svg { width: 14px; height: 14px; }\n.org-chip-spec { display: flex; align-items: center; gap: 5px; padding: 3px 9px; border: 1px solid var(--border-strong); border-radius: 7px; font-size: 12px; font-weight: 600; color: var(--fg-1); }\n.org-chip-spec svg { width: 12px; height: 12px; color: var(--brand-gold); }\n\n/* ── CODE BLOCK ───────────────────────────────────────────── */\n.code { background: #1A1814; color: #FFFFFD; border-radius: 10px; padding: 18px 22px; font: 13px/1.7 var(--font-mono); overflow-x: auto; margin-top: 10px; }\n.code .tok-prop { color: var(--brand-gold); }\n.code .tok-val { color: #7dd3ba; }\n.code .tok-comment { color: rgba(255,255,255,.3); font-style: italic; }\n\n/* ── HERO ─────────────────────────────────────────────────── */\n.hero { padding: 0 0 64px; }\n.hero-tag { display: inline-flex; align-items: center; gap: 8px; margin-bottom: 20px; }\n.hero-tag-dot { width: 8px; height: 8px; border-radius: 999px; background: var(--brand-gold); }\n.hero-tag-txt { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: var(--brand-gold-700); }\n.hero-badges { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 20px; }\n\n/* ── UTILS ────────────────────────────────────────────────── */\n.mt4 { margin-top: 4px; }\n.mt8 { margin-top: 8px; }\n.mt12 { margin-top: 12px; }\n.mt16 { margin-top: 16px; }\n.mt24 { margin-top: 24px; }\n.mt32 { margin-top: 32px; }\n.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }\n.grid3 { display: grid; grid-template-columns: repeat(3,1fr); gap: 14px; }\n.grid4 { display: grid; grid-template-columns: repeat(4,1fr); gap: 12px; }\n.vstack { display: flex; flex-direction: column; gap: 12px; }\n.hstack { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }\n\n/* ── ICON SPECIMEN ─────────────────────────────────────────── */\n.icon-grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 8px; margin-top: 16px; }\n.icon-tile { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 12px 8px; background: var(--bg-surface); border: 1px solid var(--border-subtle); border-radius: 8px; cursor: default; }\n.icon-tile:hover { background: var(--neutral-100); }\n.icon-tile svg { width: 20px; height: 20px; color: var(--fg-2); }\n.icon-tile span { font-size: 9.5px; color: var(--fg-4); text-align: center; font-family: var(--font-mono); }\n\n/* ── LOGO SPECIMENS ─────────────────────────────────────────── */\n.logo-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-top: 16px; }\n.logo-tile { border-radius: 12px; border: 1px solid var(--border-subtle); overflow: hidden; }\n.logo-tile-bg { padding: 28px 20px; display: flex; align-items: center; justify-content: center; min-height: 80px; }\n.logo-tile-meta { padding: 10px 14px; background: var(--bg-surface); border-top: 1px solid var(--border-subtle); }\n.logo-tile-name { font-size: 12px; font-weight: 600; color: var(--fg-1); }\n.logo-tile-use { font-size: 11px; color: var(--fg-3); margin-top: 1px; }\n.logo-tile img { max-height: 28px; max-width: 100%; object-fit: contain; }\n\n/* ── STAR ORNAMENT ──────────────────────────────────────────── */\n.star { color: var(--brand-gold); font-size: 18px; line-height: 1; }\n\n/* scroll highlight */\n.ds-section:target h2.doc { color: var(--brand-gold-700); }\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n<div class=\"shell\">\n\n  <!-- ── SIDENAV ───────────────────────────────── -->\n  <nav class=\"sidenav\">\n    <div class=\"sn-brand\">\n      <img src=\"1e9872f5-943b-4792-9bd8-65edf1e8b1b0\" alt=\"Starium\">\n    <\u002Fdiv>\n    <div class=\"sn-group\">Introduction<\u002Fdiv>\n    <a class=\"sn-link active\" href=\"#identite\">Identité de marque<\u002Fa>\n    <a class=\"sn-link\" href=\"#voix\">Voix &amp; contenu<\u002Fa>\n\n    <div class=\"sn-group\">Fondations visuelles<\u002Fdiv>\n    <a class=\"sn-link\" href=\"#couleurs\">Couleurs<\u002Fa>\n    <a class=\"sn-link\" href=\"#typographie\">Typographie<\u002Fa>\n    <a class=\"sn-link\" href=\"#espacement\">Espacement<\u002Fa>\n    <a class=\"sn-link\" href=\"#rayons\">Rayons<\u002Fa>\n    <a class=\"sn-link\" href=\"#ombres\">Ombres &amp; élévation<\u002Fa>\n    <a class=\"sn-link\" href=\"#motion\">Motion<\u002Fa>\n\n    <div class=\"sn-group\">Éléments visuels<\u002Fdiv>\n    <a class=\"sn-link\" href=\"#iconographie\">Iconographie<\u002Fa>\n    <a class=\"sn-link\" href=\"#logos\">Logos &amp; monogramme<\u002Fa>\n\n    <div class=\"sn-group\">Composants<\u002Fdiv>\n    <a class=\"sn-link\" href=\"#boutons\">Boutons<\u002Fa>\n    <a class=\"sn-link\" href=\"#formulaires\">Formulaires<\u002Fa>\n    <a class=\"sn-link\" href=\"#badges\">Badges &amp; statuts<\u002Fa>\n    <a class=\"sn-link\" href=\"#cards\">Cards<\u002Fa>\n    <a class=\"sn-link\" href=\"#tableaux\">Tableaux<\u002Fa>\n    <a class=\"sn-link\" href=\"#alertes\">Alertes<\u002Fa>\n    <a class=\"sn-link\" href=\"#navigation\">Navigation<\u002Fa>\n    <a class=\"sn-link\" href=\"#progression\">Progression<\u002Fa>\n    <a class=\"sn-link\" href=\"#avatars\">Avatars<\u002Fa>\n\n    <div class=\"sn-group\">Usage<\u002Fdiv>\n    <a class=\"sn-link\" href=\"#a-faire\">À faire / À éviter<\u002Fa>\n    <a class=\"sn-link\" href=\"#tokens\">Tokens CSS<\u002Fa>\n  <\u002Fnav>\n\n  <!-- ── CONTENT ───────────────────────────────── -->\n  <main class=\"content\">\n\n    <!-- HERO -->\n    <div class=\"hero ds-section\" id=\"identite\">\n      <div class=\"hero-tag\">\n        <div class=\"hero-tag-dot\"><\u002Fdiv>\n        <div class=\"hero-tag-txt\">Design System · v1.0<\u002Fdiv>\n      <\u002Fdiv>\n      <h1 class=\"doc\">Starium<br>Design System<\u002Fh1>\n      <p class=\"lead\">La documentation de référence pour concevoir, développer et maintenir des interfaces cohérentes avec la marque Starium — sobre, performante, premium.<\u002Fp>\n      <div class=\"hero-badges\">\n        <span class=\"chip chip-gold\">93 tokens CSS<\u002Fspan>\n        <span class=\"chip chip-neutral\">Manrope · JetBrains Mono<\u002Fspan>\n        <span class=\"chip chip-neutral\">Lucide Icons<\u002Fspan>\n        <span class=\"chip chip-success\">Validé WCAG AA<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- 1 — IDENTITÉ ──────────────────────────── -->\n    <div class=\"ds-section\">\n      <div class=\"eyebrow\">01 — Identité<\u002Fdiv>\n      <h2 class=\"doc\">Identité de marque<\u002Fh2>\n      <p class=\"body\">Starium est une plateforme SaaS de pilotage des directions, projets, budgets et ressources, à destination des dirigeants et de leurs équipes. La marque vise la sobriété et la performance d'Apple, réchauffée par une signature dorée distinctive.<\u002Fp>\n      <p class=\"body\"><strong>Baseline :<\u002Fstrong> <em>Révélez vos talents.<\u002Fem><\u002Fp>\n\n      <h3 class=\"doc\">Les trois piliers de l'identité<\u002Fh3>\n      <div class=\"grid3 mt12\">\n        <div class=\"card\">\n          <div style=\"font-size:28px;font-weight:800;letter-spacing:-.03em;margin-bottom:8px;color:var(--fg-1)\">Starium<\u002Fdiv>\n          <div class=\"card-title\">Le wordmark<\u002Fdiv>\n          <div class=\"card-body\">Lettres rondes, géométriques, tracking serré, poids 800. Jamais allongé, jamais penché.<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"card\">\n          <div style=\"margin-bottom:8px\"><img src=\"816e95a9-ecb9-4600-a42a-fdd3a3f361a9\" alt=\"Monogramme\" style=\"height:36px\"><\u002Fdiv>\n          <div class=\"card-title\">Le monogramme<\u002Fdiv>\n          <div class=\"card-body\">Quatre lobes noirs autour d'un point doré central en scintillement à 4 branches.<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"card\">\n          <div style=\"font-size:36px;color:var(--brand-gold);margin-bottom:6px;line-height:1\">✦<\u002Fdiv>\n          <div class=\"card-title\">L'étoile ✦<\u002Fdiv>\n          <div class=\"card-body\">U+2726 — seul ornement autorisé. Puce visuelle, titre de section. Toujours en or.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <h3 class=\"doc\">Positionnement<\u002Fh3>\n      <p class=\"body\">On ne crie pas — on aligne. Starium s'adresse aux CODIR, COMEX et directions de projet. Le ton est calme, posé et orienté résultat. La sobriété est le motif.<\u002Fp>\n\n      <div class=\"dd-grid mt24\">\n        <div class=\"dd-box dd-do\">\n          <div class=\"dd-label\">✓ Faire<\u002Fdiv>\n          <div class=\"dd-content\">\n            <p style=\"font-size:13px;color:var(--fg-2);line-height:1.6\">Calme · Premium · Performant<br>Verbes d'action : <em>aligner, piloter, décider, arbitrer, révéler, sécuriser<\u002Fem><br>Sentence case partout<br>Apostrophes typographiques : <code style=\"font-family:var(--font-mono);font-size:12px\">'<\u002Fcode><br>Guillemets français : <code style=\"font-family:var(--font-mono);font-size:12px\">« … »<\u002Fcode><\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"dd-box dd-dont\">\n          <div class=\"dd-label\">✗ Ne pas faire<\u002Fdiv>\n          <div class=\"dd-content\">\n            <p style=\"font-size:13px;color:var(--fg-2);line-height:1.6\">Emoji dans l'UI (sauf ✦)<br>Title Case anglo-saxon<br>Gradients vifs, motifs, textures<br>Guillemets droits <code style=\"font-family:var(--font-mono);font-size:12px\">\"…\"<\u002Fcode><br>Images \"corporate happy team\"<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- 2 — VOIX ──────────────────────────────── -->\n    <div class=\"ds-section\" id=\"voix\">\n      <div class=\"eyebrow\">02 — Contenu<\u002Fdiv>\n      <h2 class=\"doc\">Voix &amp; contenu<\u002Fh2>\n      <p class=\"body\">La voix Starium est calme, posée et experte. On ne survend pas — on constate, on aligne, on décide.<\u002Fp>\n\n      <h3 class=\"doc\">Principes rédactionnels<\u002Fh3>\n      <div class=\"grid2 mt12\">\n        <div class=\"card\">\n          <div class=\"card-title\">Décisionnaire, pas technique<\u002Fdiv>\n          <div class=\"card-body mt4\">L'audience est CODIR/COMEX. On parle valeur, pilotage, alignement, risque, capacité. Jamais API, endpoint, payload.<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"card\">\n          <div class=\"card-title\">Orientée résultat<\u002Fdiv>\n          <div class=\"card-body mt4\">Verbes d'action courts : <em>aligner, piloter, décider, arbitrer, révéler, sécuriser.<\u002Fem> Pas de langue de bois.<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"card\">\n          <div class=\"card-title\">Personne &amp; langue<\u002Fdiv>\n          <div class=\"card-body mt4\"><strong>Vous<\u002Fstrong> par défaut. <strong>Nous<\u002Fstrong> pour Starium l'éditeur. Jamais de <em>tu<\u002Fem>. Français maîtresse — anglicismes (KPI, dashboard, roadmap) tolérés si usage métier établi.<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"card\">\n          <div class=\"card-title\">Format des données<\u002Fdiv>\n          <div class=\"card-body mt4\">Milliers : espace fine <code style=\"font-family:var(--font-mono);font-size:12px\">1 240<\u002Fcode>. Pourcentage collé : <code style=\"font-family:var(--font-mono);font-size:12px\">82 %<\u002Fcode>. Euro après : <code style=\"font-family:var(--font-mono);font-size:12px\">1 240 €<\u002Fcode>. Dates : <code style=\"font-family:var(--font-mono);font-size:12px\">15 mai 2024<\u002Fcode>, <code style=\"font-family:var(--font-mono);font-size:12px\">T1 2025<\u002Fcode>.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <h3 class=\"doc\">Casse<\u002Fh3>\n      <div class=\"dt-wrap mt8\">\n        <table class=\"dt\">\n          <thead><tr><th>Contexte<\u002Fth><th>Règle<\u002Fth><th>Exemple<\u002Fth><\u002Ftr><\u002Fthead>\n          <tbody>\n            <tr><td>Titres &amp; sous-titres<\u002Ftd><td>Sentence case<\u002Ftd><td class=\"strong\">« Vision stratégique 2026 »<\u002Ftd><\u002Ftr>\n            <tr><td>Boutons &amp; CTA<\u002Ftd><td>Sentence case<\u002Ftd><td class=\"strong\">« Modifier la vision »<\u002Ftd><\u002Ftr>\n            <tr><td>Overlines / sections menu<\u002Ftd><td>UPPERCASE tracké<\u002Ftd><td class=\"strong\">GOUVERNANCE · PILOTAGE<\u002Ftd><\u002Ftr>\n            <tr><td>Étiquettes de statut<\u002Ftd><td>Sentence case, présent court<\u002Ftd><td class=\"strong\">En cours · En retard · Terminé<\u002Ftd><\u002Ftr>\n            <tr><td>En-têtes de tableau<\u002Ftd><td>Sentence case ou ALL CAPS petit<\u002Ftd><td class=\"strong\">Projet · Statut · Avancement<\u002Ftd><\u002Ftr>\n          <\u002Ftbody>\n        <\u002Ftable>\n      <\u002Fdiv>\n\n      <h3 class=\"doc\">Exemples validés<\u002Fh3>\n      <div class=\"vstack mt12\">\n        <div class=\"alert alert-success\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><polyline points=\"20 6 9 17 4 12\"><\u002Fpolyline><\u002Fsvg><div><div class=\"alert-title\">✅ Correct<\u002Fdiv><div class=\"alert-msg\">« Définir notre cap, aligner l'organisation et créer de la valeur durable. »<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n        <div class=\"alert alert-success\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><polyline points=\"20 6 9 17 4 12\"><\u002Fpolyline><\u002Fsvg><div><div class=\"alert-title\">✅ Correct<\u002Fdiv><div class=\"alert-msg\">« Score d'alignement global » · « Axes stratégiques actifs » · « En bonne trajectoire »<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n        <div class=\"alert alert-danger\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><line x1=\"18\" y1=\"6\" x2=\"6\" y2=\"18\"><\u002Fline><line x1=\"6\" y1=\"6\" x2=\"18\" y2=\"18\"><\u002Fline><\u002Fsvg><div><div class=\"alert-title\">❌ Incorrect<\u002Fdiv><div class=\"alert-msg\">« 🚀 Boostez votre performance ! » — emoji, ton trop fort, point d'exclamation<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n        <div class=\"alert alert-danger\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><line x1=\"18\" y1=\"6\" x2=\"6\" y2=\"18\"><\u002Fline><line x1=\"6\" y1=\"6\" x2=\"18\" y2=\"18\"><\u002Fline><\u002Fsvg><div><div class=\"alert-title\">❌ Incorrect<\u002Fdiv><div class=\"alert-msg\">« Click here to modify » — anglais, impératif sec<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- 3 — COULEURS ──────────────────────────── -->\n    <div class=\"ds-section\" id=\"couleurs\">\n      <div class=\"eyebrow\">03 — Couleurs<\u002Fdiv>\n      <h2 class=\"doc\">Couleurs<\u002Fh2>\n      <p class=\"body\">La palette Starium est construite autour d'un seul accent — l'or ambre brûlé — sur une base de neutres papier chauds. Pas de gris bleutés froids.<\u002Fp>\n\n      <h3 class=\"doc\">Or Starium — accent principal<\u002Fh3>\n      <div class=\"color-grid mt8\" style=\"grid-template-columns:repeat(5,1fr)\">\n        <div class=\"swatch\"><div class=\"swatch-color\" style=\"background:#FBEAB5\"><\u002Fdiv><div class=\"swatch-info\"><div class=\"swatch-name\">Gold 050<\u002Fdiv><div class=\"swatch-hex\">#FBEAB5<\u002Fdiv><div class=\"swatch-token\">--brand-gold-050<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n        <div class=\"swatch\"><div class=\"swatch-color\" style=\"background:#F4D58A\"><\u002Fdiv><div class=\"swatch-info\"><div class=\"swatch-name\">Gold 100<\u002Fdiv><div class=\"swatch-hex\">#F4D58A<\u002Fdiv><div class=\"swatch-token\">--brand-gold-100<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n        <div class=\"swatch\"><div class=\"swatch-color\" style=\"background:#E8A317\"><\u002Fdiv><div class=\"swatch-info\"><div class=\"swatch-name\">Gold ★ Principal<\u002Fdiv><div class=\"swatch-hex\">#E8A317<\u002Fdiv><div class=\"swatch-token\">--brand-gold<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n        <div class=\"swatch\"><div class=\"swatch-color\" style=\"background:#CC8E0E\"><\u002Fdiv><div class=\"swatch-info\"><div class=\"swatch-name\">Gold 600<\u002Fdiv><div class=\"swatch-hex\">#CC8E0E<\u002Fdiv><div class=\"swatch-token\">--brand-gold-600<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n        <div class=\"swatch\"><div class=\"swatch-color\" style=\"background:#5F3F00\"><\u002Fdiv><div class=\"swatch-info\"><div class=\"swatch-name\">Gold 700<\u002Fdiv><div class=\"swatch-hex\">#5F3F00<\u002Fdiv><div class=\"swatch-token\">--brand-gold-700<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n\n      <h3 class=\"doc\">Encre &amp; neutres papier<\u002Fh3>\n      <div class=\"color-grid-wide mt8\">\n        <div class=\"swatch\"><div class=\"swatch-color\" style=\"background:#0E0E10;border:1px solid #333\"><\u002Fdiv><div class=\"swatch-info\"><div class=\"swatch-name\">Encre<\u002Fdiv><div class=\"swatch-hex\">#0E0E10<\u002Fdiv><div class=\"swatch-token\">--brand-ink<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n        <div class=\"swatch\"><div class=\"swatch-color\" style=\"background:#FAF9F7;border:1px solid #e9e6e0\"><\u002Fdiv><div class=\"swatch-info\"><div class=\"swatch-name\">Neutral 50<\u002Fdiv><div class=\"swatch-hex\">#FAF9F7<\u002Fdiv><div class=\"swatch-token\">--neutral-50<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n        <div class=\"swatch\"><div class=\"swatch-color\" style=\"background:#F4F2EE\"><\u002Fdiv><div class=\"swatch-info\"><div class=\"swatch-name\">Neutral 100<\u002Fdiv><div class=\"swatch-hex\">#F4F2EE<\u002Fdiv><div class=\"swatch-token\">--neutral-100<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n        <div class=\"swatch\"><div class=\"swatch-color\" style=\"background:#E9E6E0\"><\u002Fdiv><div class=\"swatch-info\"><div class=\"swatch-name\">Neutral 200<\u002Fdiv><div class=\"swatch-hex\">#E9E6E0<\u002Fdiv><div class=\"swatch-token\">--neutral-200<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n        <div class=\"swatch\"><div class=\"swatch-color\" style=\"background:#D6D2CA\"><\u002Fdiv><div class=\"swatch-info\"><div class=\"swatch-name\">Neutral 300<\u002Fdiv><div class=\"swatch-hex\">#D6D2CA<\u002Fdiv><div class=\"swatch-token\">--neutral-300<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n        <div class=\"swatch\"><div class=\"swatch-color\" style=\"background:#8C8579\"><\u002Fdiv><div class=\"swatch-info\"><div class=\"swatch-name\">Neutral 500<\u002Fdiv><div class=\"swatch-hex\">#8C8579<\u002Fdiv><div class=\"swatch-token\">--neutral-500<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n\n      <h3 class=\"doc\">États sémantiques<\u002Fh3>\n      <div class=\"color-grid mt8\" style=\"grid-template-columns:repeat(4,1fr)\">\n        <div class=\"swatch\"><div class=\"swatch-color\" style=\"background:var(--state-success)\"><\u002Fdiv><div class=\"swatch-info\"><div class=\"swatch-name\">Succès<\u002Fdiv><div class=\"swatch-hex\">#1F8A5B<\u002Fdiv><div class=\"swatch-token\">--state-success<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n        <div class=\"swatch\"><div class=\"swatch-color\" style=\"background:var(--state-warning)\"><\u002Fdiv><div class=\"swatch-info\"><div class=\"swatch-name\">Attention<\u002Fdiv><div class=\"swatch-hex\">#C77A00<\u002Fdiv><div class=\"swatch-token\">--state-warning<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n        <div class=\"swatch\"><div class=\"swatch-color\" style=\"background:var(--state-danger)\"><\u002Fdiv><div class=\"swatch-info\"><div class=\"swatch-name\">Danger<\u002Fdiv><div class=\"swatch-hex\">#B42318<\u002Fdiv><div class=\"swatch-token\">--state-danger<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n        <div class=\"swatch\"><div class=\"swatch-color\" style=\"background:var(--state-info)\"><\u002Fdiv><div class=\"swatch-info\"><div class=\"swatch-name\">Info<\u002Fdiv><div class=\"swatch-hex\">#2A6FDB<\u002Fdiv><div class=\"swatch-token\">--state-info<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n\n      <h3 class=\"doc\">Règles d'usage des couleurs<\u002Fh3>\n      <div class=\"dt-wrap mt8\">\n        <table class=\"dt\">\n          <thead><tr><th>Couleur<\u002Fth><th>Usages autorisés<\u002Fth><th>Usages interdits<\u002Fth><\u002Ftr><\u002Fthead>\n          <tbody>\n            <tr><td class=\"strong\" style=\"color:var(--brand-gold-700)\">Or #E8A317<\u002Ftd><td>CTA primaire, item actif sidebar, icône KPI, valeur clé, focus ring<\u002Ftd><td>Arrière-plan plein grande surface, texte de corps, fond de page<\u002Ftd><\u002Ftr>\n            <tr><td class=\"strong\">Encre #0E0E10<\u002Ftd><td>Texte primaire, logo, sidebar dark, footer<\u002Ftd><td>Fond de toute page autre que sidebar/footer<\u002Ftd><\u002Ftr>\n            <tr><td class=\"strong\" style=\"color:var(--neutral-500)\">#FAF9F7<\u002Ftd><td>Fond d'application, fond de page<\u002Ftd><td>Surfaces de composants (utiliser #FFFFFF)<\u002Ftd><\u002Ftr>\n            <tr><td class=\"strong\" style=\"color:var(--state-success)\">Vert succès<\u002Ftd><td>Statut terminé, OK, objectif atteint<\u002Ftd><td>Accent de marque, CTA<\u002Ftd><\u002Ftr>\n            <tr><td class=\"strong\" style=\"color:var(--state-danger)\">Rouge danger<\u002Ftd><td>Erreur, risque critique, retard<\u002Ftd><td>Highlight, mise en avant positive<\u002Ftd><\u002Ftr>\n          <\u002Ftbody>\n        <\u002Ftable>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- 4 — TYPOGRAPHIE ───────────────────────── -->\n    <div class=\"ds-section\" id=\"typographie\">\n      <div class=\"eyebrow\">04 — Typographie<\u002Fdiv>\n      <h2 class=\"doc\">Typographie<\u002Fh2>\n      <p class=\"body\">Famille unique <strong>Manrope<\u002Fstrong> (variable, auto-hébergée) pour tout l'UI — display, corps, légendes. <strong>JetBrains Mono<\u002Fstrong> pour les tokens, identifiants, données techniques.<\u002Fp>\n\n      <div class=\"mt16\">\n        <div class=\"type-row\">\n          <div class=\"type-meta\"><div class=\"type-meta-label\">Display XL<\u002Fdiv><div class=\"type-meta-token\">--text-display-xl<\u002Fdiv><\u002Fdiv>\n          <div class=\"type-specimen\"><div style=\"font:800 56px/1.05 var(--font-display);letter-spacing:-.03em;color:var(--fg-1)\">Starium<\u002Fdiv><div class=\"type-spec-sub\">800 · 64px/1.05 · tracking −0.03em<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"type-row\">\n          <div class=\"type-meta\"><div class=\"type-meta-label\">Display L<\u002Fdiv><div class=\"type-meta-token\">--text-display-l<\u002Fdiv><\u002Fdiv>\n          <div class=\"type-specimen\"><div style=\"font:800 40px/1.08 var(--font-display);letter-spacing:-.025em;color:var(--fg-1)\">Vision 2026<\u002Fdiv><div class=\"type-spec-sub\">800 · 48px/1.08 · tracking −0.025em<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"type-row\">\n          <div class=\"type-meta\"><div class=\"type-meta-label\">Display M<\u002Fdiv><div class=\"type-meta-token\">--text-display-m<\u002Fdiv><\u002Fdiv>\n          <div class=\"type-specimen\"><div style=\"font:700 32px/1.12 var(--font-display);letter-spacing:-.02em;color:var(--fg-1)\">Portefeuille projets<\u002Fdiv><div class=\"type-spec-sub\">700 · 36px/1.12 · tracking −0.02em<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"type-row\">\n          <div class=\"type-meta\"><div class=\"type-meta-label\">H1<\u002Fdiv><div class=\"type-meta-token\">--text-h1<\u002Fdiv><\u002Fdiv>\n          <div class=\"type-specimen\"><div style=\"font:700 28px/1.2 var(--font-sans);color:var(--fg-1)\">Budgets &amp; finances<\u002Fdiv><div class=\"type-spec-sub\">700 · 28px/1.2<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"type-row\">\n          <div class=\"type-meta\"><div class=\"type-meta-label\">H2<\u002Fdiv><div class=\"type-meta-token\">--text-h2<\u002Fdiv><\u002Fdiv>\n          <div class=\"type-specimen\"><div style=\"font:700 22px/1.25 var(--font-sans);color:var(--fg-1)\">Axes stratégiques<\u002Fdiv><div class=\"type-spec-sub\">700 · 22px/1.25<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"type-row\">\n          <div class=\"type-meta\"><div class=\"type-meta-label\">H3<\u002Fdiv><div class=\"type-meta-token\">--text-h3<\u002Fdiv><\u002Fdiv>\n          <div class=\"type-specimen\"><div style=\"font:600 18px/1.3 var(--font-sans);color:var(--fg-1)\">Conformité DORA<\u002Fdiv><div class=\"type-spec-sub\">600 · 18px/1.3<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"type-row\">\n          <div class=\"type-meta\"><div class=\"type-meta-label\">H4<\u002Fdiv><div class=\"type-meta-token\">--text-h4<\u002Fdiv><\u002Fdiv>\n          <div class=\"type-specimen\"><div style=\"font:600 15px/1.35 var(--font-sans);color:var(--fg-1)\">Objectifs en trajectoire<\u002Fdiv><div class=\"type-spec-sub\">600 · 15px/1.35<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"type-row\">\n          <div class=\"type-meta\"><div class=\"type-meta-label\">Body<\u002Fdiv><div class=\"type-meta-token\">--text-body<\u002Fdiv><\u002Fdiv>\n          <div class=\"type-specimen\"><div style=\"font:400 15px/1.55 var(--font-sans);color:var(--fg-2)\">Définir notre cap, aligner l'organisation et créer de la valeur durable pour l'ensemble de nos parties prenantes.<\u002Fdiv><div class=\"type-spec-sub\">400 · 15px/1.55<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"type-row\">\n          <div class=\"type-meta\"><div class=\"type-meta-label\">Body S<\u002Fdiv><div class=\"type-meta-token\">--text-body-s<\u002Fdiv><\u002Fdiv>\n          <div class=\"type-specimen\"><div style=\"font:400 13px/1.5 var(--font-sans);color:var(--fg-2)\">Texte de menu, labels de champ, contenu de cellule, note de bas de card.<\u002Fdiv><div class=\"type-spec-sub\">400 · 13px/1.5<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"type-row\">\n          <div class=\"type-meta\"><div class=\"type-meta-label\">Caption<\u002Fdiv><div class=\"type-meta-token\">--text-captio \" id=\"rayons\">\n      <div class=\"eyebrow\">06 — Rayons<\u002Fdiv>\n      <h2 class=\"doc\">Rayons de bordure<\u002Fh2>\n      <p class=\"body\">Les cards utilisent 14px comme valeur signature. Boutons et inputs : 10px. Badges et avatars : pill.<\u002Fp>\n      <div class=\"radius-grid\">\n        <div class=\"radius-demo\"><div class=\"radius-box\" style=\"border-radius:4px\"><\u002Fdiv><div class=\"radius-label\">xs · 4px<br>--radius-xs<\u002Fdiv><\u002Fdiv>\n        <div class=\"radius-demo\"><div class=\"radius-box\" style=\"border-radius:6px\"><\u002Fdiv><div class=\"radius-label\">sm · 6px<br>--radius-sm<\u002Fdiv><\u002Fdiv>\n        <div class=\"radius-demo\"><div class=\"radius-box\" style=\"border-radius:10px\"><\u002Fdiv><div class=\"radius-label\">md · 10px<br>--radius-md<\u002Fdiv><\u002Fdiv>\n        <div class=\"radius-demo\"><div class=\"radius-box\" style=\"border-radius:14px\"><\u002Fdiv><div class=\"radius-label\">lg · 14px ★<br>--radius-lg<\u002Fdiv><\u002Fdiv>\n        <div class=\"radius-demo\"><div class=\"radius-box\" style=\"border-radius:20px\"><\u002Fdiv><div class=\"radius-label\">xl · 20px<br>--radius-xl<\u002Fdiv><\u002Fdiv>\n        <div class=\"radius-demo\"><div class=\"radius-box\" style=\"border-radius:28px\"><\u002Fdiv><div class=\"radius-label\">2xl · 28px<br>--radius-2xl<\u002Fdiv><\u002Fdiv>\n        <div class=\"radius-demo\"><div class=\"radius-box\" style=\"border-radius:999px\"><\u002Fdiv><div class=\"radius-label\">pill · 999px<br>--radius-pill<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- 7 — OMBRES ────────────────────────────── -->\n    <div class=\"ds-section\" id=\"ombres\">\n      <div class=\"eyebrow\">07 — Ombres<\u002Fdiv>\n      <h2 class=\"doc\">Ombres &amp; élévation<\u002Fh2>\n      <p class=\"body\">Système à 4 paliers, tous en encre noire à très faible opacité. Jamais d'ombres bleutées ou colorées (sauf le focus ring or).<\u002Fp>\n      <div class=\"shadow-grid\">\n        <div class=\"shadow-demo\" style=\"box-shadow:var(--shadow-1)\"><div class=\"shadow-token\">shadow-1<\u002Fdiv><div class=\"shadow-use\">Cards KPI<\u002Fdiv><\u002Fdiv>\n        <div class=\"shadow-demo\" style=\"box-shadow:var(--shadow-2)\"><div class=\"shadow-token\">shadow-2<\u002Fdiv><div class=\"shadow-use\">Cards posées<\u002Fdiv><\u002Fdiv>\n        <div class=\"shadow-demo\" style=\"box-shadow:var(--shadow-3)\"><div class=\"shadow-token\">shadow-3<\u002Fdiv><div class=\"shadow-use\">Dropdowns<\u002Fdiv><\u002Fdiv>\n        <div class=\"shadow-demo\" style=\"box-shadow:var(--shadow-4)\"><div class=\"shadow-token\">shadow-4<\u002Fdiv><div class=\"shadow-use\">Modals<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"preview-box mt16\">\n        <div class=\"hstack\" style=\"gap:16px\">\n          <div style=\"width:64px;height:64px;border-radius:10px;background:var(--bg-surface);box-shadow:var(--shadow-focus);display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--brand-gold-700);font-weight:700;text-align:center;font-family:var(--font-mono)\">Focus ring<\u002Fdiv>\n          <div>\n            <div style=\"font-size:12.5px;font-weight:600;color:var(--fg-1)\">Focus ring — or<\u002Fdiv>\n            <div style=\"font-size:12px;color:var(--fg-3);margin-top:3px\"><code style=\"font-family:var(--font-mono);font-size:11.5px\">--shadow-focus<\u002Fcode> · 0 0 0 3px rgba(232,163,23,.32)<\u002Fdiv>\n            <div style=\"font-size:12px;color:var(--fg-3);margin-top:2px\">Seule \"ombre colorée\" autorisée dans le système.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- 8 — MOTION ────────────────────────────── -->\n    <div class=\"ds-section\" id=\"motion\">\n      <div class=\"eyebrow\">08 — Motion<\u002Fdiv>\n      <h2 class=\"doc\">Motion &amp; animation<\u002Fh2>\n      <p class=\"body\">Discret. Entrée rapide, sortie qui s'étire — Apple-like. Pas de bounce, pas de spring, pas d lass=\"av av-sm\">AR<\u002Fdiv>\n          <div style=\"margin-left:8px;font-size:12.5px;color:var(--fg-3)\">Initiales · Fond neutre ou or · Jamais de couleur random<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- 20 — À FAIRE / ÉVITER ─────────────────── -->\n    <div class=\"ds-section\" id=\"a-faire\">\n      <div class=\"eyebrow\">12 — Usage<\u002Fdiv>\n      <h2 class=\"doc\">À faire / À éviter<\u002Fh2>\n      <div class=\"vstack mt16\">\n        <div class=\"dd-grid\" style=\"display:grid;grid-template-columns:1fr 1fr;gap:14px\">\n          <div class=\"dd-box dd-do\"><div class=\"dd-label\">✓ Or parcimonieux<\u002Fdiv><div class=\"dd-content\"><p style=\"font-size:12.5px;color:var(--fg-2)\">CTA primaire, icône KPI, item actif, valeur clé. L'or est un signal — s'il est partout, il ne signifie plus rien.<\u002Fp><\u002Fdiv><\u002Fdiv>\n          <div class=\"dd-box dd-dont\"><div class=\"dd-label\">✗ Or omniprésent<\u002Fdiv><div class=\"dd-content\"><p style=\"font-size:12.5px;color:var(--fg-2)\">Pas de fond plein or sur grande surface, pas de texte de corps en or, pas de bordures gauches colorées.<\u002Fp><\u002Fdiv><\u002Fdiv>\n          <div class=\"dd-box dd-do\"><div class=\"dd-label\">✓ Ombres neutres<\u002Fdiv><div class=\"dd-content\"><p style=\"font-size:12.5px;color:var(--fg-2)\">Toujours en encre noire à faible opacité. Le système shadow-1 à shadow-4 est l'unique référence.<\u002Fp><\u002Fdiv><\u002Fdiv>\n          <div class=\"dd-box dd-dont\"><div class=\"dd-label\">✗ Ombres colorées<\u002Fdiv><div class=\"dd-content\"><p style=\"font-size:12.5px;color:var(--fg-2)\">Pas de <code style=\"font-family:var(--font-mono);font-size:11.5px\">box-shadow: 0 4px 20px rgba(232,163,23,.4)<\u002Fcode> — sauf le focus ring défini.<\u002Fp><\u002Fdiv><\u002Fdiv>\n          <div class=\"dd-box dd-do\"><div class=\"dd-label\">✓ Fond app #FAF9F7<\u002Fdiv><div class=\"dd-content\"><p style=\"font-size:12.5px;color:var(--fg-2)\">Fond papier chaud pour l'app, blanc pur (#FFFFFF) pour les surfaces de composants (cards, sidebar, topbar).<\u002Fp><\u002Fdiv><\u002Fdiv>\n          <div class=\"dd-box dd-dont\"><div class=\"dd-label\">✗ Gradients vifs<\u002Fdiv><div class=\"dd-content\"><p style=\"font-size:12.5px;color:var(--fg-2)\">Pas de gradient coloré en arrière-plan d'interface. Réservé aux hero marketing en dégradé encre subtil uniquement.<\u002Fp><\u002Fdiv><\u002Fdiv>\n          <div class=\"dd-box dd-do\"><div class=\"dd-label\">✓ Icônes Lucide outlined<\u002Fdiv><div class=\"dd-content\"><p style=\"font-size:12.5px;color:var(--fg-2)\">Stroke 1.75px, currentColor, taille 20px standard. Toujours outlined — jamais filled sauf usage marketing exceptionnel.<\u002Fp><\u002Fdiv><\u002Fdiv>\n          <div class=\"dd-box dd-dont\"><div class=\"dd-label\">✗ Emoji dans l'UI<\u002Fdiv><div class=\"dd-content\"><p style=\"font-size:12.5px;color:var(--fg-2)\">🚀 ✨ ★ → interdits. Utiliser l'icône Lucide correspondante. Seule exception : l'étoile ✦ du logo.<\u002Fp><\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- 21 — TOKENS CSS ──────────────────────── -->\n    <div class=\"ds-section\" id=\"tokens\">\n      <div class=\"eyebrow\">13 — Référence<\u002Fdiv>\n      <h2 class=\"doc\">Tokens CSS — référence complète<\u002Fh2>\n      <p class=\"body\">Tous les tokens sont définis dans <code style=\"font-family:var(--font-mono);font-size:12px\">colors_and_type.css<\u002Fcode> et consommables via <code style=\"font-family:var(--font-mono);font-size:12px\">@import url('colors_and_type.css')<\u002Fcode>.<\u002Fp>\n\n      <div class=\"code mt16\">\n<span class=\"tok-comment\">/* ── Brand ─────────────────────────────────── */<\u002Fspan>\n<span class=\"tok-prop\">--brand-gold<\u002Fspan>:        <span class=\"tok-val\">#E8A317<\u002Fspan>;   <span class=\"tok-comment\">/* accent principal */<\u002Fspan>\n<span class=\"tok-prop\">--brand-gold-600<\u002Fspan>:    <span class=\"tok-val\">#CC8E0E<\u002Fspan>;   <span class=\"tok-comment\">/* hover */<\u002Fspan>\n<span class=\"tok-prop\">--brand-gold-700<\u002Fspan>:    <span class=\"tok-val\">#5F3F00<\u002Fspan>;   <span class=\"tok-comment\">/* texte sur tint */<\u002Fspan>\n<span class=\"tok-prop\">--brand-gold-100<\u002Fspan>:    <span class=\"tok-val\">#F4D58A<\u002Fspan>;   <span class=\"tok-comment\">/* badges, tints */<\u002Fspan>\n<span class=\"tok-prop\">--brand-gold-050<\u002Fspan>:    <span class=\"tok-val\">#FBEAB5<\u002Fspan>;   <span class=\"tok-comment\">/* surface très claire */<\u002Fspan>\n<span class=\"tok-prop\">--brand-ink<\u002Fspan>:         <span class=\"tok-val\">#0E0E10<\u002Fspan>;   <span class=\"tok-comment\">/* texte primaire, logo */<\u002Fspan>\n\n<span class=\"tok-comment\">/* ── Neutres papier ──────────────────────── */<\u002Fspan>\n<span class=\"tok-prop\">--neutral-50<\u002Fspan>:   <span class=\"tok-val\">#FAF9F7<\u002Fspan>;  <span class=\"tok-comment\">/* fond d'app */<\u002Fspan>\n<span class=\"tok-prop\">--neutral-100<\u002Fspan>:  <span class=\"tok-val\">#F4F2EE<\u002Fspan>;  <span class=\"tok-comment\">/* surface subtile */<\u002Fspan>\n<span class=\"tok-prop\">--neutral-200<\u002Fspan>:  <span class=\"tok-val\">#E9E6E0<\u002Fspan>;  <span class=\"tok-comment\">/* bordures, dividers */<\u002Fspan>\n<span class=\"tok-prop\">--neutral-300<\u002Fspan>:  <span class=\"tok-val\">#D6D2CA<\u002Fspan>;\n<span class=\"tok-prop\">--neutral-500<\u002Fspan>:  <span class=\"tok-val\">#8C8579<\u002Fspan>;  <span class=\"tok-comment\">/* texte muted */<\u002Fspan>\n<span class=\"tok-prop\">--neutral-700<\u002Fspan>:  <span class=\"tok-val\">#403D38<\u002Fspan>;\n<span class=\"tok-prop\">--neutral-900<\u002Fspan>:  <span class=\"tok-val\">#14130F<\u002Fspan>;\n\n<span class=\"tok-comment\">/* ── États sémantiques ───────────────────── */<\u002Fspan>\n<span class=\"tok-prop\">--state-success<\u002Fspan>:      <span class=\"tok-val\">#1F8A5B<\u002Fspan>;\n<span class=\"tok-prop\">--state-success-bg<\u002Fspan>:   <span class=\"tok-val\">#E6F4ED<\u002Fspan>;\n<span class=\"tok-prop\">--state-warning<\u002Fspan>:      <span class=\"tok-val\">#C77A00<\u002Fspan>;\n<span class=\"tok-prop\">--state-warning-bg<\u002Fspan>:   <span class=\"tok-val\">#FFF1DC<\u002Fspan>;\n<span class=\"tok-prop\">--state-danger<\u002Fspan>:       <span class=\"tok-val\">#B42318<\u002Fspan>;\n<span class=\"tok-prop\">--state-danger-bg<\u002Fspan>:    <span class=\"tok-val\">#FBE8E6<\u002Fspan>;\n<span class=\"tok-prop\">--state-info<\u002Fspan>:         <span class=\"tok-val\">#2A6FDB<\u002Fspan>;\n<span class=\"tok-prop\">--state-info-bg<\u002Fspan>:      <span class=\"tok-val\">#E3EEFB<\u002Fspan>;\n\n<span class=\"tok-comment\">/* ── Typographie ─────────────────────────── */<\u002Fspan>\n<span class=\"tok-prop\">--font-sans<\u002Fspan>:    <span class=\"tok-val\">'Manrope', -apple-system, system-ui, sans-serif<\u002Fspan>;\n<span class=\"tok-prop\">--font-mono<\u002Fspan>:    <span class=\"tok-val\">'JetBrains Mono', ui-monospace, monospace<\u002Fspan>;\n<span class=\"tok-prop\">--text-display-xl<\u002Fspan>: <span class=\"tok-val\">800 64px/1.05 var(--font-display)<\u002Fspan>;\n<span class=\"tok-prop\">--text-h1<\u002Fspan>:      <span class=\"tok-val\">700 28px/1.2 var(--font-sans)<\u002Fspan>;\n<span class=\"tok-prop\">--text-body<\u002Fspan>:    <span class=\"tok-val\">400 15px/1.55 var(--font-sans)<\u002Fspan>;\n<span class=\"tok-prop\">--text-body-s<\u002Fspan>:  <span class=\"tok-val\">400 13px/1.5 var(--font-sans)<\u002Fspan>;\n<span class=\"tok-prop\">--text-caption<\u002Fspan>: <span class=\"tok-val\">500 12px/1.4 var(--font-sans)<\u002Fspan>;\n<span class=\"tok-prop\">--text-overline<\u002Fspan>:<span class=\"tok-val\">600 11px/1.2 var(--font-sans)<\u002Fspan>; <span class=\"tok-comment\">/* + uppercase */<\u002Fspan>\n\n<span class=\"tok-comment\">/* ── Espacement (base 4px) ───────────────── */<\u002Fspan>\n<span class=\"tok-prop\">--space-1<\u002Fspan>: <span class=\"tok-val\">4px<\u002Fspan>;  <span class=\"tok-prop\">--space-2<\u002Fspan>: <span class=\"tok-val\">8px<\u002Fspan>;  <span class=\"tok-prop\">--space-4<\u002Fspan>: <span class=\"tok-val\">16px<\u002Fspan>;\n<span class=\"tok-prop\">--space-6<\u002Fspan>: <span class=\"tok-val\">24px<\u002Fspan>; <span class=\"tok-prop\">--space-8<\u002Fspan>: <span class=\"tok-val\">32px<\u002Fspan>; <span class=\"tok-prop\">--space-12<\u002Fspan>: <span class=\"tok-val\">48px<\u002Fspan>;\n<span class=\"tok-prop\">--space-16<\u002Fspan>: <span class=\"tok-val\">64px<\u002Fspan>;\n\n<span class=\"tok-comment\">/* ── Rayons ─────────────────────────────── */<\u002Fspan>\n<span class=\"tok-prop\">--radius-sm<\u002Fspan>:   <span class=\"tok-val\">6px<\u002Fspan>;\n<span class=\"tok-prop\">--radius-md<\u002Fspan>:   <span class=\"tok-val\">10px<\u002Fspan>;   <span class=\"tok-comment\">/* boutons, inputs */<\u002Fspan>\n<span class=\"tok-prop\">--radius-lg<\u002Fspan>:   <span class=\"tok-val\">14px<\u002Fspan>;   <span class=\"tok-comment\">/* cards — valeur signature */<\u002Fspan>\n<span class=\"tok-prop\">--radius-xl<\u002Fspan>:   <span class=\"tok-val\">20px<\u002Fspan>;   <span class=\"tok-comment\">/* modals */<\u002Fspan>\n<span class=\"tok-prop\">--radius-pill<\u002Fspan>: <span class=\"tok-val\">999px<\u002Fspan>;  <span class=\"tok-comment\">/* badges, avatars */<\u002Fspan>\n\n<span class=\"tok-comment\">/* ── Ombres ─────────────────────────────── */<\u002Fspan>\n<span class=\"tok-prop\">--shadow-1<\u002Fspan>: <span class=\"tok-val\">0 1px 2px rgba(14,14,16,.04)…<\u002Fspan>;  <span class=\"tok-comment\">/* cards */<\u002Fspan>\n<span class=\"tok-prop\">--shadow-3<\u002Fspan>: <span class=\"tok-val\">0 8px 24px rgba(14,14,16,.08)…<\u002Fspan>; <span class=\"tok-comment\">/* dropdowns */<\u002Fspan>\n<span class=\"tok-prop\">--shadow-4<\u002Fspan>: <span class=\"tok-val\">0 24px 60px rgba(14,14,16,.12)…<\u002Fspan>;<span class=\"tok-comment\">/* modals */<\u002Fspan>\n<span class=\"tok-prop\">--shadow-focus<\u002Fspan>: <span class=\"tok-val\">0 0 0 3px rgba(232,163,23,.32)<\u002Fspan>;\n\n<span class=\"tok-comment\">/* ── Motion ─────────────────────────────── */<\u002Fspan>\n<span class=\"tok-prop\">--ease-standard<\u002Fspan>:  <span class=\"tok-val\">cubic-bezier(0.2, 0, 0, 1)<\u002Fspan>;\n<span class=\"tok-prop\">--duration-fast<\u002Fspan>:  <span class=\"tok-val\">120ms<\u002Fspan>;\n<span class=\"tok-prop\">--duration-base<\u002Fspan>:  <span class=\"tok-val\">200ms<\u002Fspan>;\n<span class=\"tok-prop\">--duration-slow<\u002Fspan>:  <span class=\"tok-val\">320ms<\u002Fspan>;\n\n<span class=\"tok-comment\">/* ── Layout ─────────────────────────────── */<\u002Fspan>\n<span class=\"tok-prop\">--sidebar-width<\u002Fspan>:   <span class=\"tok-val\">248px<\u002Fspan>;\n<span class=\"tok-prop\">--topbar-height<\u002Fspan>:   <span class=\"tok-val\">64px<\u002Fspan>;\n<span class=\"tok-prop\">--container-max<\u002Fspan>:   <span class=\"tok-val\">1280px<\u002Fspan>;\n      <\u002Fdiv>\n\n      <div style=\"margin-top:32px;padding:20px;background:var(--bg-surface);border:1px solid var(--border-subtle);border-radius:12px\">\n        <div style=\"font-size:12.5px;font-weight:600;color:var(--fg-1);margin-bottom:6px\">Liens vers les fichiers<\u002Fdiv>\n        <div style=\"font-size:12.5px;color:var(--fg-3);line-height:2\">\n          <a href=\"colors_and_type.css\" style=\"color:var(--brand-gold-700);font-family:var(--font-mono);font-size:12px\">colors_and_type.css<\u002Fa> — 93 tokens, @font-face, styles de base<br>\n          <a href=\"styles.css\" style=\"color:var(--brand-gold-700);font-family:var(--font-mono);font-size:12px\">styles.css<\u002Fa> — entry point unique (importe colors_and_type.css)<br>\n          <a href=\"ui_kits/app/orchestra.html\" style=\"color:var(--brand-gold-700);font-family:var(--font-mono);font-size:12px\">ui_kits/app/orchestra.html<\u002Fa> — SPA 13 pages<br>\n          <a href=\"ui_kits/app/index.html\" style=\"color:var(--brand-gold-700);font-family:var(--font-mono);font-size:12px\">ui_kits/app/index.html<\u002Fa> — Vue Vision stratégique<br>\n          <a href=\"ui_kits/app/scenario.html\" style=\"color:var(--brand-gold-700);font-family:var(--font-mono);font-size:12px\">ui_kits/app/scenario.html<\u002Fa> — Scénario de capacité / Gantt\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"padding:48px 0 0;border-top:1px solid var(--border-subtle);display:flex;align-items:center;gap:16px\">\n      <img src=\"816e95a9-ecb9-4600-a42a-fdd3a3f361a9\" alt=\"Starium\" style=\"height:28px;opacity:.4\">\n      <div style=\"font-size:12px;color:var(--fg-4)\">Starium Design System · v1.0 · Confidentiel<\u002Fdiv>\n      <div style=\"margin-left:auto;font-size:12px;color:var(--fg-4)\">✦<\u002Fdiv>\n    <\u002Fdiv>\n\n  <\u002Fmain>\n<\u002Fdiv>\n\n<script>\n// Active nav on scroll\nconst sections = document.querySelectorAll('.ds-section[id]');\nconst links = document.querySelectorAll('.sn-link');\nconst obs = new IntersectionObserver(entries => {\n  entries.forEach(e => {\n    if (e.isIntersecting) {\n      links.forEach(l => l.classList.toggle('active', l.getAttribute('href') === '#' + e.target.id));\n    }\n  });\n}, { threshold: 0.15, rootMargin: '-60px 0px -60% 0px' });\nsections.forEach(s => obs.observe(s));\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
