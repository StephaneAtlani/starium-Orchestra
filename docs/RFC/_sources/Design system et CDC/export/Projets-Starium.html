  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  <script type="__bundler/template">
"<!DOCTYPE html>\n<html lang=\"fr\"><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Projets — Starium<\u002Ftitle>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n\n<style>\n@font-face {\n  font-family: 'Manrope';\n  src: url(\"e1d5abf2-510e-4fb6-bef8-8a71b66f9e63\") format('truetype');\n  font-weight: 100 900;\n  font-style: normal;\n  font-display: swap;\n}\n\n*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }\n\n:root {\n  --brand-gold:       #E8A317;\n  --brand-gold-600:   #CC8E0E;\n  --brand-gold-700:   #5F3F00;\n  --brand-gold-100:   #F4D58A;\n  --brand-gold-050:   #FBEAB5;\n  --brand-ink:        #0E0E10;\n  --neutral-0:        #FFFFFF;\n  --neutral-50:       #FAF9F7;\n  --neutral-100:      #F4F2EE;\n  --neutral-200:      #E9E6E0;\n  --neutral-300:      #D6D2CA;\n  --neutral-400:      #B6B0A4;\n  --neutral-500:      #8C8579;\n  --neutral-600:      #5F5A52;\n  --neutral-700:      #403D38;\n  --state-success:    #1F8A5B;\n  --state-success-bg: #E6F4ED;\n  --state-warning:    #C77A00;\n  --state-warning-bg: #FFF1DC;\n  --state-danger:     #B42318;\n  --state-danger-bg:  #FBE8E6;\n  --state-info:       #2A6FDB;\n  --state-info-bg:    #E3EEFB;\n  --font-sans: 'Manrope', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;\n  --radius-sm:   6px;\n  --radius-md:   10px;\n  --radius-lg:   14px;\n  --radius-pill: 999px;\n  --shadow-1: 0 1px 2px rgba(14,14,16,.04), 0 1px 1px rgba(14,14,16,.03);\n  --shadow-2: 0 2px 6px rgba(14,14,16,.06), 0 1px 2px rgba(14,14,16,.04);\n  --shadow-focus: 0 0 0 3px rgba(232,163,23,.32);\n  --sidebar-w: 248px;\n  --topbar-h:  64px;\n}\n\nhtml, body { height: 100%; font-family: var(--font-sans); background: var(--neutral-50); color: var(--brand-ink); -webkit-font-smoothing: antialiased; }\n\n/* ─── LAYOUT ─────────────────────────────── */\n.shell { display: flex; height: 100vh; overflow: hidden; }\n\n/* ─── SIDEBAR ─────────────────────────────── */\n.sidebar {\n  width: var(--sidebar-w);\n  flex-shrink: 0;\n  background: var(--brand-ink);\n  display: flex;\n  flex-direction: column;\n  height: 100vh;\n  overflow-y: auto;\n  overflow-x: hidden;\n  scrollbar-width: none;\n}\n.sidebar::-webkit-scrollbar { display: none; }\n\n.sb-logo {\n  padding: 20px 18px 18px;\n  display: flex;\n  align-items: center;\n  gap: 10px;\n  border-bottom: 1px solid rgba(255,255,255,.08);\n  flex-shrink: 0;\n}\n.sb-logo-mark {\n  width: 28px; height: 28px;\n  background: var(--brand-gold);\n  border-radius: 7px;\n  display: flex; align-items: center; justify-content: center;\n  flex-shrink: 0;\n}\n.sb-logo-mark svg { width: 16px; height: 16px; }\n.sb-logo-name { font-size: 13.5px; font-weight: 800; color: #fff; letter-spacing: -.01em; line-height: 1.15; }\n.sb-logo-sub  { font-size: 10px; font-weight: 500; color: rgba(255,255,255,.4); margin-top: 1px; }\n\n.sb-nav { flex: 1; padding: 10px 10px 16px; }\n.sb-section-label {\n  font-size: 9.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em;\n  color: rgba(255,255,255,.3);\n  padding: 18px 10px 6px;\n}\n.sb-item {\n  display: flex; align-items: center; gap: 9px;\n  padding: 8px 10px;\n  border-radius: var(--radius-md);\n  font-size: 13px; font-weight: 500;\n  color: rgba(255,255,255,.65);\n  cursor: pointer;\n  transition: background 120ms, color 120ms;\n  text-decoration: none;\n  margin-bottom: 1px;\n  user-select: none;\n}\n.sb-item:hover { background: rgba(255,255,255,.07); color: rgba(255,255,255,.9); }\n.sb-item.active {\n  background: var(--brand-gold);\n  color: var(--brand-ink);\n  font-weight: 700;\n}\n.sb-item.active svg { color: var(--brand-ink); }\n.sb-item svg { width: 16px; height: 16px; flex-shrink: 0; opacity: .8; }\n.sb-item.active svg { opacity: 1; }\n.sb-item-end { margin-left: auto; font-size: 10px; color: rgba(255,255,255,.25); }\n.sb-item.active .sb-item-end { color: rgba(14,14,16,.4); }\n\n/* ─── MAIN ─────────────────────────────── */\n.main { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-width: 0; }\n\n/* ─── TOPBAR ─────────────────────────────── */\n.topbar {\n  height: var(--topbar-h);\n  background: var(--neutral-0);\n  border-bottom: 1px solid var(--neutral-200);\n  display: flex; align-items: center; gap: 12px;\n  padding: 0 24px;\n  flex-shrink: 0;\n  position: sticky; top: 0; z-index: 10;\n}\n.breadcrumb { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--neutral-500); flex: 1; }\n.breadcrumb a { color: var(--neutral-500); text-decoration: none; }\n.breadcrumb a:hover { color: var(--brand-ink); }\n.breadcrumb .bc-sep { color: var(--neutral-300); font-size: 11px; }\n.breadcrumb .bc-current { color: var(--brand-ink); font-weight: 600; }\n.bc-muted { color: var(--neutral-400); font-style: italic; }\n\n.topbar-search {\n  display: flex; align-items: center; gap: 7px;\n  height: 34px; padding: 0 12px;\n  background: var(--neutral-100);\n  border-radius: var(--radius-md);\n  font-size: 12.5px; color: var(--neutral-400);\n  cursor: text;\n}\n.topbar-search svg { width: 14px; height: 14px; color: var(--neutral-400); flex-shrink: 0; }\n.topbar-search kbd { font-family: var(--font-sans); font-size: 10px; background: var(--neutral-0); border: 1px solid var(--neutral-200); padding: 1px 5px; border-radius: 4px; color: var(--neutral-500); }\n\n.topbar-icon {\n  width: 34px; height: 34px;\n  border-radius: var(--radius-md);\n  display: flex; align-items: center; justify-content: center;\n  color: var(--neutral-500);\n  cursor: pointer;\n  position: relative;\n}\n.topbar-icon:hover { background: var(--neutral-100); }\n.topbar-icon svg { width: 17px; height: 17px; }\n.notif-dot {\n  position: absolute; top: 5px; right: 6px;\n  width: 7px; height: 7px;\n  border-radius: 999px; background: var(--brand-gold);\n  border: 1.5px solid var(--neutral-0);\n}\n\n.org-chip {\n  display: flex; align-items: center; gap: 6px;\n  height: 34px; padding: 0 11px;\n  border: 1px solid var(--neutral-200);\n  border-radius: var(--radius-md);\n  font-size: 12.5px; font-weight: 600; color: var(--brand-ink);\n  cursor: pointer;\n}\n.org-chip:hover { background: var(--neutral-50); }\n.org-chip svg { width: 12px; height: 12px; color: var(--neutral-400); }\n\n.avatar {\n  width: 34px; height: 34px;\n  border-radius: var(--radius-pill);\n  background: var(--brand-gold-100);\n  color: var(--brand-gold-700);\n  display: flex; align-items: center; justify-content: center;\n  font-size: 11.5px; font-weight: 800;\n  cursor: pointer;\n  flex-shrink: 0;\n}\n\n/* ─── PAGE CONTENT ─────────────────────────────── */\n.page-content { flex: 1; overflow-y: auto; padding: 28px 32px 48px; }\n\n/* ─── PAGE HEADER ─────────────────────────────── */\n.page-header {\n  display: flex;\n  align-items: center;\n  justify-content: space-between;\n  gap: 24px;\n  margin-bottom: 24px;\n}\n.page-title-block { flex: 1; min-width: 0; }\n.page-title {\n  font-size: 26px; font-weight: 800;\n  color: var(--brand-ink);\n  letter-spacing: -.02em;\n  line-height: 1.1;\n  white-space: nowrap;\n}\n.page-subtitle {\n  font-size: 12.5px;\n  color: var(--neutral-400);\n  margin-top: 5px;\n  white-space: nowrap;\n  overflow: hidden;\n  text-overflow: ellipsis;\n}\n.page-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }\n\n/* ─── BUTTONS ─────────────────────────────── */\n.btn {\n  display: inline-flex; align-items: center; gap: 7px;\n  padding: 9px 16px;\n  border-radius: var(--radius-md);\n  font-family: var(--font-sans); font-size: 13px; font-weight: 700;\n  cursor: pointer; border: none; transition: background 120ms, box-shadow 120ms;\n  white-space: nowrap;\n}\n.btn svg { width: 15px; height: 15px; flex-shrink: 0; }\n\n.btn-primary { background: var(--brand-gold); color: var(--brand-ink); }\n.btn-primary:hover { background: var(--brand-gold-600); }\n\n.btn-secondary {\n  background: var(--neutral-0);\n  color: var(--brand-ink);\n  border: 1.5px solid var(--neutral-200);\n}\n.btn-secondary:hover { background: var(--neutral-50); }\n\n.btn-ghost {\n  background: transparent;\n  color: var(--neutral-600);\n  border: 1.5px solid var(--neutral-200);\n}\n.btn-ghost:hover { background: var(--neutral-100); }\n\n/* ─── CARD ─────────────────────────────── */\n.card {\n  background: var(--neutral-0);\n  border: 1px solid var(--neutral-200);\n  border-radius: var(--radius-lg);\n  box-shadow: var(--shadow-1);\n}\n\n/* ─── KPI SECTION ─────────────────────────────── */\n.kpi-section { padding: 0; margin-bottom: 20px; overflow: hidden; }\n\n.kpi-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0; }\n.kpi-group {\n  padding: 20px 24px;\n  border-right: 1px solid var(--neutral-100);\n}\n.kpi-group:last-child { border-right: none; }\n\n.kpi-group-label {\n  font-size: 9.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em;\n  color: var(--neutral-400); margin-bottom: 16px;\n}\n.kpi-items { display: flex; gap: 32px; align-items: flex-end; }\n.kpi-item {}\n.kpi-item-label { font-size: 11.5px; color: var(--neutral-500); margin-bottom: 3px; white-space: nowrap; }\n.kpi-item-value {\n  font-size: 28px; font-weight: 800;\n  letter-spacing: -.03em;\n  color: var(--brand-ink);\n  font-variant-numeric: tabular-nums;\n  line-height: 1;\n}\n.kpi-item-value.v-ok     { color: var(--state-success); }\n.kpi-item-value.v-warn   { color: var(--state-warning); }\n.kpi-item-value.v-danger { color: var(--state-danger); }\n.kpi-item-value.v-muted  { color: var(--neutral-400); }\n\n/* ─── FILTER BAR ─────────────────────────────── */\n.filter-bar {\n  display: flex; align-items: center; justify-content: space-between;\n  padding: 14px 20px;\n  border-bottom: 1px solid var(--neutral-100);\n  gap: 12px;\n}\n.filter-bar-title { font-size: 13.5px; font-weight: 700; color: var(--brand-ink); white-space: nowrap; flex-shrink: 0; }\n.filter-bar-actions { display: flex; align-items: center; gap: 6px; }\n\n.tab-group { display: flex; align-items: center; gap: 3px; background: var(--neutral-100); border-radius: var(--radius-md); padding: 3px; }\n.tab-btn {\n  padding: 6px 13px;\n  border-radius: 7px;\n  font-family: var(--font-sans); font-size: 12.5px; font-weight: 600;\n  color: var(--neutral-500); background: transparent; border: none; cursor: pointer;\n  transition: all 120ms;\n}\n.tab-btn.active { background: var(--brand-gold); color: var(--brand-ink); box-shadow: var(--shadow-1); }\n.tab-btn:not(.active):hover { background: rgba(255,255,255,.6); color: var(--brand-ink); }\n\n.filter-chip {\n  display: inline-flex; align-items: center; gap: 6px;\n  padding: 6px 12px;\n  border: 1.5px solid var(--neutral-200);\n  border-radius: var(--radius-md);\n  font-family: var(--font-sans); font-size: 12.5px; font-weight: 600;\n  color: var(--neutral-600); background: var(--neutral-0); cursor: pointer;\n  transition: all 120ms;\n  white-space: nowrap;\n}\n.filter-chip:hover { background: var(--neutral-50); border-color: var(--neutral-300); }\n.filter-chip svg { width: 13px; height: 13px; color: var(--neutral-400); }\n\n/* ─── TABLE ─────────────────────────────── */\n.table-wrap { overflow-x: auto; }\ntable { width: 100%; border-collapse: collapse; font-size: 12.5px; }\nthead tr { background: var(--neutral-50); }\nth {\n  font-size: 9.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em;\n  color: var(--neutral-500); padding: 10px 12px;\n  border-bottom: 1.5px solid var(--neutral-200);\n  white-space: nowrap; text-align: left;\n  cursor: pointer; user-select: none;\n}\nth:hover { color: var(--brand-ink); }\nth .sort-icon { opacity: .4; margin-left: 3px; font-size: 9px; }\n\n/* Filter row */\n.filter-row td {\n  padding: 8px 12px;\n  border-bottom: 1px solid var(--neutral-200);\n  background: var(--neutral-50);\n}\n.col-filter {\n  display: flex; align-items: center; gap: 5px;\n  padding: 5px 9px;\n  border: 1px solid var(--neutral-200); border-radius: var(--radius-sm);\n  font-family: var(--font-sans); font-size: 11.5px; color: var(--neutral-600);\n  background: var(--neutral-0); cursor: pointer; white-space: nowrap;\n}\n.col-filter svg { width: 10px; height: 10px; color: var(--neutral-400); }\n.col-search {\n  width: 100%; padding: 5px 9px;\n  border: 1px solid var(--neutral-200); border-radius: var(--radius-sm);\n  font-family: var(--font-sans); font-size: 11.5px; color: var(--neutral-700);\n  background: var(--neutral-0); outline: none;\n}\n.col-search::placeholder { color: var(--neutral-400); }\n.col-search:focus { border-color: var(--brand-gold); box-shadow: var(--shadow-focus); }\n\n/* Data rows */\ntbody tr {\n  border-bottom: 1px solid var(--neutral-100);\n  transition: background 80ms;\n}\ntbody tr:hover { background: var(--neutral-50); }\ntd { padding: 11px 12px; vertical-align: top; color: var(--neutral-700); }\n\n.cell-category { font-size: 11.5px; color: var(--neutral-500); line-height: 1.4; }\n.cell-category .cat-group { font-weight: 600; color: var(--neutral-600); font-size: 11px; }\n.cell-category .cat-sub { font-size: 10.5px; color: var(--neutral-400); }\n\n.proj-name { font-weight: 700; color: var(--brand-gold-700); font-size: 13px; cursor: pointer; }\n.proj-name:hover { color: var(--brand-gold-600); text-decoration: underline; }\n.proj-code { font-family: 'Courier New', monospace; font-size: 10px; color: var(--neutral-700); margin-top: 2px; }\n.proj-priority { font-size: 10.5px; font-weight: 700; color: var(--neutral-700); margin-top: 1px; }\n\n.progress-wrap { display: flex; flex-direction: column; gap: 3px; }\n.progress-row { display: flex; align-items: center; gap: 6px; }\n.progress-track {\n  width: 64px; height: 5px;\n  background: var(--neutral-200); border-radius: 999px; overflow: hidden;\n  flex-shrink: 0;\n}\n.progress-fill { height: 100%; border-radius: 999px; }\n.progress-fill.ok     { background: var(--state-success); }\n.progress-fill.warn   { background: var(--brand-gold); }\n.progress-fill.danger { background: var(--state-danger); }\n.progress-fill.muted  { background: var(--neutral-300); }\n.progress-val { font-size: 11.5px; font-variant-numeric: tabular-nums; color: var(--neutral-600); font-weight: 600; }\n\n.trj { display: flex; gap: 4px; font-size: 11.5px; font-variant-numeric: tabular-nums; }\n.trj-t { color: var(--neutral-600); }\n.trj-r { color: var(--state-danger); font-weight: 600; }\n.trj-j { color: var(--neutral-400); }\n.trj-label { font-size: 9px; color: var(--neutral-400); letter-spacing: .05em; }\n\n.cell-dash { color: var(--neutral-300); font-size: 14px; }\n.echéance-val { font-size: 12px; font-variant-numeric: tabular-nums; color: var(--neutral-600); white-space: nowrap; }\n.echéance-val.late { color: var(--state-danger); font-weight: 600; }\n\n/* ─── CHIPS ─────────────────────────────── */\n.chip {\n  display: inline-flex; align-items: center; gap: 5px;\n  padding: 3px 9px;\n  border-radius: var(--radius-pill);\n  font-size: 11px; font-weight: 700;\n  white-space: nowrap;\n}\n.chip-ok     { background: var(--state-success-bg);   color: var(--state-success); }\n.chip-warn   { background: var(--state-warning-bg);   color: var(--state-warning); }\n.chip-danger { background: var(--state-danger-bg);    color: var(--state-danger); }\n.chip-info   { background: var(--state-info-bg);      color: var(--state-info); }\n.chip-gold   { background: var(--brand-gold-050);     color: var(--brand-gold-700); }\n.chip-muted  { background: var(--neutral-100);        color: var(--neutral-500); }\n.chip-dark   { background: var(--neutral-200);        color: var(--neutral-700); }\n.chip-purple { background: #EFE4FD;                   color: #6B2FB2; }\n.chip-teal   { background: #E2F5F1;                   color: #0E7462; }\n\n/* Signal badges */\n.signals { display: flex; flex-direction: column; gap: 4px; align-items: flex-end; }\n.signal-badge {\n  padding: 3px 9px;\n  border-radius: var(--radius-pill);\n  font-size: 10.5px; font-weight: 700;\n  white-space: n
