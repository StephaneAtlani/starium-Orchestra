<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Modal — Starium</title>
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin: 0; padding: 40px; background: var(--bg-app); }
  .wrap { display: flex; flex-direction: column; gap: 16px; max-width: 680px; }
  .row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .lbl { font: var(--text-overline); letter-spacing: var(--tracking-overline); text-transform: uppercase; color: var(--fg-3); width: 100%; }

  /* ---- form kit (matches app patterns) ---- */
  .field { margin-bottom: 18px; }
  .field-label { font-size: 12.5px; font-weight: 700; color: var(--fg-2); margin-bottom: 7px; display: block; }
  .field-label .req { color: var(--state-danger, #C0392B); }
  .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .input, .textarea, .nselect { width: 100%; border: 1.5px solid var(--border-subtle); border-radius: var(--radius-md); padding: 11px 13px; font-family: var(--font-sans); font-size: 13.5px; color: var(--fg-1); background: var(--bg-surface); box-sizing: border-box; }
  .nselect { padding-right: 36px; appearance: none; -webkit-appearance: none; background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23767066' stroke-width='2'><polyline points='6 9 12 15 18 9'/></svg>"); background-repeat: no-repeat; background-position: right 12px center; background-size: 16px; }
  .input:focus, .textarea:focus, .nselect:focus { outline: none; border-color: var(--brand-gold); box-shadow: var(--shadow-focus, 0 0 0 3px rgba(232,163,23,.16)); }
  .textarea { resize: vertical; min-height: 80px; line-height: 1.5; }

  .type-pills { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .type-pill { padding: 11px; border: 1.5px solid var(--border-subtle); border-radius: var(--radius-md); background: var(--bg-surface); cursor: pointer; text-align: center; font-family: var(--font-sans); font-size: 12.5px; font-weight: 600; color: var(--fg-2); transition: all 120ms; }
  .type-pill:hover { background: var(--neutral-50, #F7F5F1); }
  .type-pill.sel { border-color: var(--brand-gold); background: var(--brand-gold-050); color: var(--brand-gold-700); box-shadow: 0 0 0 3px rgba(232,163,23,.14); }

  .chk-row { display: flex; align-items: center; gap: 9px; padding: 9px 0; cursor: pointer; font-size: 13px; color: var(--fg-2); }
  .chk-box { width: 18px; height: 18px; border-radius: 5px; border: 1.5px solid var(--border-subtle); flex-shrink: 0; display: flex; align-items: center; justify-content: center; background: var(--bg-surface); }
  .chk-box.on { background: var(--brand-gold); border-color: var(--brand-gold); color: var(--brand-ink); }

  .toggle-sw { width: 40px; height: 24px; border-radius: 999px; background: var(--border-subtle); position: relative; cursor: pointer; flex-shrink: 0; transition: background 150ms; }
  .toggle-sw.on { background: var(--brand-gold); }
  .toggle-sw-dot { position: absolute; top: 2px; left: 2px; width: 20px; height: 20px; border-radius: 999px; background: #fff; box-shadow: var(--shadow-1, 0 1px 2px rgba(0,0,0,.2)); transition: transform 150ms; }
  .toggle-sw.on .toggle-sw-dot { transform: translateX(16px); }
  .toggle-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0; border-top: 1px solid var(--border-subtle); }
  .toggle-row:first-of-type { border-top: none; }
  .toggle-row-lbl { font-size: 13px; font-weight: 600; color: var(--fg-1); }
  .toggle-row-sub { font-size: 11.5px; color: var(--fg-3); margin-top: 1px; }

  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px 5px 5px; border-radius: 999px; background: var(--neutral-50, #F7F5F1); border: 1px solid var(--border-subtle); font-size: 12px; font-weight: 600; color: var(--fg-2); }
  .chip .av { width: 20px; height: 20px; border-radius: 999px; display: flex; align-items: center; justify-content: center; font-size: 8.5px; font-weight: 700; color: #fff; }
  .chip-x { width: 14px; height: 14px; cursor: pointer; opacity: .5; }
  .chip-x:hover { opacity: 1; }
  .add-chip { display: inline-flex; align-items: center; gap: 5px; padding: 6px 12px; border-radius: 999px; border: 1.5px dashed var(--border-subtle); background: transparent; font-size: 12px; font-weight: 600; color: var(--fg-3); cursor: pointer; }
  .add-chip:hover { border-color: var(--brand-gold); color: var(--brand-gold-700); }

  .range-wrap input[type=range] { width: 100%; accent-color: var(--brand-gold); }
  .range-val { font-size: 12.5px; font-weight: 700; color: var(--fg-1); }

  .file-drop { display: flex; align-items: center; gap: 10px; justify-content: center; border: 1.5px dashed var(--border-subtle); border-radius: var(--radius-md); padding: 18px; font-size: 12.5px; font-weight: 600; color: var(--fg-3); cursor: pointer; }
  .file-drop:hover { border-color: var(--brand-gold); color: var(--brand-gold-700); }
  .file-drop svg { width: 18px; height: 18px; flex-shrink: 0; }

  .seg-title { font-size: 12.5px; font-weight: 700; color: var(--fg-1); margin: 22px 0 10px; padding-top: 4px; border-top: 1px solid var(--border-subtle); }
  .seg-title:first-child { margin-top: 0; padding-top: 0; border-top: none; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
</head>
<body>
<template id="__bundler_thumbnail" data-bg-color="#1A1815">
  <svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
    <rect width="1200" height="800" fill="#1A1815"/>
    <rect x="360" y="240" width="480" height="320" rx="28" fill="#F7F5F1"/>
    <rect x="360" y="240" width="480" height="64" rx="28" fill="#F7F5F1"/>
    <circle cx="410" cy="272" r="18" fill="#F5A623"/>
    <rect x="700" y="256" width="32" height="32" rx="8" fill="#D8D3C9"/>
    <rect x="400" y="336" width="400" height="16" rx="8" fill="#D8D3C9"/>
    <rect x="400" y="372" width="400" height="16" rx="8" fill="#EDEAE3"/>
    <rect x="400" y="420" width="128" height="60" rx="10" fill="#F5A623"/>
    <rect x="544" y="420" width="128" height="60" rx="10" fill="#EDEAE3"/>
    <rect x="688" y="420" width="128" height="60" rx="10" fill="#EDEAE3"/>
  </svg>
</template>
<div id="root"></div>
<script>
  const { Modal, Button } = window.StariumDesignSystem_019e02;
  const h = React.createElement;

  const targetIcon = h('svg', { viewBox: '0 0 24 24', width: 18, height: 18, fill: 'none', stroke: 'currentColor', strokeWidth: 1.75, strokeLinecap: 'round' },
    h('circle', { cx: 12, cy: 12, r: 10 }), h('line', { x1: 12, y1: 8, x2: 12, y2: 16 }), h('line', { x1: 8, y1: 12, x2: 16, y2: 12 }));
  const uploadIcon = h('svg', { viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', strokeWidth: 1.75, strokeLinecap: 'round' },
    h('path', { d: 'M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4' }), h('polyline', { points: '17 8 12 3 7 8' }), h('line', { x1: 12, y1: 3, x2: 12, y2: 15 }));
  const checkIcon = h('svg', { viewBox: '0 0 24 24', width: 13, height: 13, fill: 'none', stroke: 'currentColor', strokeWidth: 3, strokeLinecap: 'round', strokeLinejoin: 'round' }, h('polyline', { points: '20 6 9 17 4 12' }));

  const MEMBERS = [
    { name: 'Marc Dupont', init: 'MD', color: '#C0392B' },
    { name: 'Claire Dubois', init: 'CD', color: '#5F3F00' },
    { name: 'Sophie Moreau', init: 'SM', color: '#2E6B4F' },
  ];

  function Toggle({ on, onClick }) {
    return h('div', { className: 'toggle-sw' + (on ? ' on' : ''), onClick }, h('div', { className: 'toggle-sw-dot' }));
  }
  function Check({ on, onClick }) {
    return h('div', { className: 'chk-box' + (on ? ' on' : ''), onClick }, on ? checkIcon : null);
  }

  function Demo() {
    const [open, setOpen] = React.useState(true);
    const [tone, setTone] = React.useState('success');
    const [notify, setNotify] = React.useState(true);
    const [reminder, setReminder] = React.useState(false);
    const [confidential, setConfidential] = React.useState(false);
    const [urgent, setUrgent] = React.useState(true);
    const [pct, setPct] = React.useState(60);
    const [members, setMembers] = React.useState(MEMBERS);

    const tones = [
      { key: 'success', label: 'Vert' },
      { key: 'info', label: 'Bleu' },
      { key: 'warning', label: 'Or' },
      { key: 'purple', label: 'Violet' },
    ];

    return h('div', { className: 'wrap' },
      h('div', { className: 'row' },
        h('span', { className: 'lbl' }, 'Ouvrir'),
        h(Button, { variant: 'primary', onClick: () => setOpen(true) }, 'Voir la modale complète'),
      ),
      h(Modal, {
        open, onClose: () => setOpen(false), icon: targetIcon, width: 560,
        title: 'Nouvel axe stratégique',
        subtitle: "Tous les champs disponibles pour un formulaire de modale",
        footer: h(React.Fragment, null,
          h(Button, { variant: 'secondary', onClick: () => setOpen(false) }, 'Annuler'),
          h(Button, { variant: 'primary', onClick: () => setOpen(false) }, "Créer l'axe"),
        ),
      },
        h('div', { className: 'seg-title' }, 'Informations'),
        h('div', { className: 'field' }, h('label', { className: 'field-label' }, "Nom de l'axe ", h('span', { className: 'req' }, '*')),
          h('input', { className: 'input', placeholder: 'Ex : Excellence relation client', defaultValue: 'Performance opérationnelle' })),
        h('div', { className: 'field' }, h('label', { className: 'field-label' }, 'Description'),
          h('textarea', { className: 'textarea', placeholder: "Décrivez l'objectif de cet axe…", defaultValue: "Industrialiser l'exploitation et fiabiliser les services pour atteindre 99,9% de disponibilité." })),
        h('div', { className: 'field-row' },
          h('div', { className: 'field' }, h('label', { className: 'field-label' }, 'Portefeuille'),
            h('select', { className: 'nselect', defaultValue: 'plan2025' },
              h('option', { value: 'plan2025' }, 'Plan stratégique 2025'),
              h('option', { value: 'plan2026' }, 'Plan stratégique 2026'),
              h('option', { value: 'transverse' }, 'Initiatives transverses'))),
          h('div', { className: 'field' }, h('label', { className: 'field-label' }, 'Échéance'),
            h('input', { className: 'input', type: 'date', defaultValue: '2026-12-31' }))),

        h('div', { className: 'seg-title' }, 'Thème' ),
        h('div', { className: 'field' },
          h('div', { className: 'type-pills' },
            tones.map(t => h('div', {
              key: t.key,
              className: 'type-pill' + (tone === t.key ? ' sel' : ''),
              onClick: () => setTone(t.key),
            }, t.label)))),

        h('div', { className: 'seg-title' }, 'Équipe'),
        h('div', { className: 'field', style: { display: 'flex', flexWrap: 'wrap', gap: 8 } },
          members.map((m, i) => h('span', { className: 'chip', key: m.name },
            h('span', { className: 'av', style: { background: m.color } }, m.init),
            m.name,
            h('svg', { className: 'chip-x', viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', strokeWidth: 2, strokeLinecap: 'round', onClick: () => setMembers(members.filter((_, j) => j !== i)) },
              h('line', { x1: 18, y1: 6, x2: 6, y2: 18 }), h('line', { x1: 6, y1: 6, x2: 18, y2: 18 })))),
          h('button', { className: 'add-chip', onClick: () => setMembers([...members, { name: 'Nouveau membre', init: 'NM', color: '#767066' }]) }, '+ Ajouter')),

        h('div', { className: 'seg-title' }, 'Avancement'),
        h('div', { className: 'field range-wrap' },
          h('label', { className: 'field-label' }, 'Avancement — ', h('span', { className: 'range-val' }, pct + '%')),
          h('input', { type: 'range', min: 0, max: 100, step: 5, value: pct, onChange: e => setPct(Number(e.target.value)) })),

        h('div', { className: 'seg-title' }, 'Options'),
        h('div', { className: 'field' },
          h('div', { className: 'toggle-row' },
            h('div', null, h('div', { className: 'toggle-row-lbl' }, 'Notifier les parties prenantes'), h('div', { className: 'toggle-row-sub' }, 'Email aux membres associés')),
            h(Toggle, { on: notify, onClick: () => setNotify(!notify) })),
          h('div', { className: 'toggle-row' },
            h('div', null, h('div', { className: 'toggle-row-lbl' }, 'Rappel avant échéance')),
            h(Toggle, { on: reminder, onClick: () => setReminder(!reminder) })),
          h('div', { style: { display: 'flex', gap: 18, marginTop: 10 } },
            h('div', { className: 'chk-row', onClick: () => setConfidential(!confidential) }, h(Check, { on: confidential }), 'Confidentiel'),
            h('div', { className: 'chk-row', onClick: () => setUrgent(!urgent) }, h(Check, { on: urgent }), 'Prioritaire'))),

        h('div', { className: 'seg-title' }, 'Pièce jointe'),
        h('div', { className: 'file-drop' }, uploadIcon, 'Glissez un fichier ou cliquez pour parcourir'),
      ),
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
<style id="__om-edit-overrides">
.type-pill.sel { background-color: #F6AA02E8 !important; }
</style>
</body>
</html>
