  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

View(\\'list\\')\">Pilotage<\u002Fa><span class=\"bc-sep\">/<\u002Fspan><span class=\"bc-current\">Plans d\\'action<\u002Fspan>'},\n  cycles:{nav:'cycles', bc:'<a onclick=\"showView(\\'list\\')\">Pilotage<\u002Fa><span class=\"bc-sep\">/<\u002Fspan><span class=\"bc-current\">Cycles de pilotage<\u002Fspan>'},\n  atlas:{nav:'atlas', bc:'<span class=\"bc-current\">Atlas — Cartographie dynamique<\u002Fspan>'},\n  budgets:{nav:'budgets', bc:'<a onclick=\"showView(\\'list\\')\">Pilotage financier<\u002Fa><span class=\"bc-sep\">/<\u002Fspan><span class=\"bc-current\">Budgets<\u002Fspan>'}\n};\nwindow.addEventListener('message', (e)=>{\n  if(e.data && e.data.type==='starium-atlas-back'){ showView('dashboard'); }\n});\nfunction showView(name){\n  if(name==='quarterplan'){ // no dedicated section — reuse the Projets list with the Capacité toggle on\n    document.querySelectorAll('.view').forEach(v=>v.classList.toggle('active', v.id==='view-list'));\n    document.querySelector('.page-content').scrollTop=0;\n    const m=VIEW_META.quarterplan;\n    document.getElementById('breadcrumb').innerHTML=m.bc;\n    document.querySelectorAll('.sidebar .sb-item[data-nav]').forEach(i=>i.classList.toggle('active', i.dataset.nav===m.nav));\n    const cb=document.getElementById('plBtnCapa'); if(cb) plListView(cb,'capa');\n    return;\n  }\n  document.querySelectorAll('.view').forEach(v=>v.classList.toggle('active', v.id==='view-'+name));\n  document.querySelector('.page-content').scrollTop=0;\n  const meta=VIEW_META[name]||VIEW_META.detail;\n  document.getElementById('breadcrumb').innerHTML=meta.bc;\n  document.querySelectorAll('.sidebar .sb-item[data-nav]').forEach(i=>i.classList.toggle('active', i.dataset.nav===meta.nav));\n  if(name==='budgets' && typeof mbShowHome==='function') mbShowHome();\n  if(name==='plans' && typeof paShowHome==='function') paShowHome();\n  if(name==='conformite' && typeof confBack==='function') confBack();\n  if(name==='capacity' && typeof capRender==='function') capRender();\n  if(name==='reunions' && typeof mtgRender==='function') mtgRender();\n  if(name==='seance' && typeof livRender==='function') livRender();\n}\nfunction plListView(btn,mode){\n  document.querySelectorAll('#view-list .seg-toggle .seg-btn').forEach(b=>b.classList.remove('active'));\n  btn.classList.add('active');\n  document.getElementById('plTableCard').style.display = (mode==='matrix'||mode==='capa') ? 'none' : '';\n  document.getElementById('plMatrixCard').style.display = mode==='matrix' ? '' : 'none';\n  document.getElementById('plCapaCard').style.display = mode==='capa' ? '' : 'none';\n  if(mode==='capa') cpRenderCells();\n}\nfunction cpRenderCells(){\n  const cells=document.querySelectorAll('#plCapaCard .cp-cell');\n  cells.forEach(c=>{\n    if(c.dataset.done) return;\n    const load=+c.dataset.load, segs=JSON.parse(c.dataset.segs);\n    const tone=load>100?'var(--state-danger)':(load>=85?'var(--brand-gold-700)':'var(--state-success)');\n    const maxS=Math.max(load,100); // track spans up to max(load,100); cap marker sits at 100\n    let bars='', tip='';\n    segs.forEach(s=>{ bars+='<div class=\"cp-seg\" style=\"width:'+(s[2]/maxS*100)+'%;background:'+s[1]+'\"><\u002Fdiv>';\n      tip+='<div class=\"r\"><i style=\"background:'+s[1]+'\"><\u002Fi>'+s[0]+' · '+s[2]+' j·h<\u002Fdiv>'; });\n    const projCount=segs.length;\n    c.innerHTML='<div class=\"cp-cbar\"><div class=\"cp-cfill\">'+bars+'<\u002Fdiv><span class=\"cp-cap\" style=\"left:'+(100/maxS*100)+'%\"><\u002Fspan><\u002Fdiv>'\n      +'<div class=\"cp-cmeta\"><span class=\"cp-cload\" style=\"color:'+tone+'\">'+load+'%<\u002Fspan><span class=\"cp-cproj\">'+projCount+' projet'+(projCount>1?'s':'')+'<\u002Fspan><\u002Fdiv>'\n      +'<div class=\"cp-ctip\"><div style=\"font-weight:800;margin-bottom:3px\">Charge '+load+'% de la capacité<\u002Fdiv>'+tip+'<\u002Fdiv>';\n    c.dataset.done='1';\n  });\n}\ndocument.addEventListener('DOMContentLoaded',()=>{try{cpRenderCells();}catch(e){}});\n\n/* ─── Nouveau projet · wizard ─── */\nlet npStep=1;\nfunction npRender(){\n  document.querySelectorAll('#vstepper .vstep').forEach(s=>{\n    const n=+s.dataset.step;\n    s.classList.toggle('active', n===npStep);\n    s.classList.toggle('done', n<npStep);\n  });\n  document.querySelectorAll('#view-new .np-pane').forEach(p=>p.classList.toggle('active', +p.dataset.pane===npStep));\n  const back=document.getElementById('np-back');\n  back.style.visibility = npStep>1 ? 'visible' : 'hidden';\n  const next=document.getElementById('np-next');\n  if(npStep===4){ next.innerHTML='<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\" stroke-linecap=\"round\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><line x1=\"12\" y1=\"8\" x2=\"12\" y2=\"16\"/><line x1=\"8\" y1=\"12\" x2=\"16\" y2=\"12\"/><\u002Fsvg>Créer le projet'; next.setAttribute('onclick','showView(\\'detail\\')'); }\n  else { next.innerHTML='Continuer<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\" stroke-linecap=\"round\"><polyline points=\"9 18 15 12 9 6\"/><\u002Fsvg>'; next.setAttribute('onclick','npNext()'); }\n  if(npStep===4) npSync();\n}\nfunction npGoStep(n){ npStep=n; npRender(); }\nfunction npNext(){ if(npStep<4){ npStep++; npRender(); } }\nfunction npPrev(){ if(npStep>1){ npStep--; npRender(); } }\n\n/* ─── Budget workspace ─── */\nfunction showBud(name){\n  document.querySelectorAll('#view-detail .bud-subtab').forEach(t=>t.classList.toggle('active', t.dataset.bud===name));\n  document.querySelectorAll('#view-detail .bud-pane').forEach(p=>p.classList.toggle('active', p.dataset.budpane===name));\n  if(name==='categories') budRenderCats();\n}\nconst BUD_ICO={\n  purple:'<path d=\"M12 19l7-7 3 3-7 7-3-3z\"/><path d=\"M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z\"/><circle cx=\"11\" cy=\"11\" r=\"2\"/>',\n  green:'<polyline points=\"16 18 22 12 16 6\"/><polyline points=\"8 6 2 12 8 18\"/>',\n  blue:'<path d=\"M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z\"/>',\ 5, calM=4;\n\nfunction openPlan(){ document.getElementById('planModal').classList.add('open'); }\nfunction closePlan(){ document.getElementById('planModal').classList.remove('open'); }\nfunction pmPickType(el){ document.querySelectorAll('#planModal .type-pill').forEach(p=>p.classList.remove('sel')); el.classList.add('sel'); }\nfunction pmRemoveTag(x){ x.closest('.tag').remove(); }\nfunction pmAddTag(sel){\n  if(!sel.value) return;\n  const [av,ini,name]=sel.value.split('|');\n  const tag=document.createElement('span');\n  tag.className='tag';\n  tag.innerHTML='<span class=\"av '+av+'\">'+ini+'<\u002Fspan>'+name+'<span class=\"tag-x\" onclick=\"pmRemoveTag(this)\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\" stroke-linecap=\"round\"><line x1=\"18\" y1=\"6\" x2=\"6\" y2=\"18\"/><line x1=\"6\" y1=\"6\" x2=\"18\" y2=\"18\"/><\u002Fsvg><\u002Fspan>';\n  sel.parentNode.insertBefore(tag, sel);\n  sel.querySelector('option[value=\"'+sel.value+'\"]').remove();\n  sel.value='';\n}\nfunction savePlan(){\n  const type=(document.querySelector('#planModal .type-pill.sel')||{}).dataset?.type||'COPIL';\n  const label=(document.getElementById('pm-label').value||'').trim()||(type+' — nouvelle instance');\n  const dRaw=document.getElementById('pm-date').value;\n  const start=document.getElementById('pm-start').value||'';\n  const end=document.getElementById('pm-end').value||'';\n  const rec=document.getElementById('pm-rec').value;\n  const loc=(document.getElementById('pm-loc').value||'').trim()||'À définir';\n  const agenda=(document.getElementById('pm-agenda').value||'').split('\\n').map(l=>l.trim()).filter(Boolean);\n  const tags=[...document.querySelectorAll('#pm-tags .tag .av')];\n  if(dRaw){ cycEvents.push({date:dRaw,type:type,name:label,start:start}); }\n  // construire la carte d'instance\n  const t=CYC_TYPES[type]||CYC_TYPES.COPIL;\n  let d='--', m='';\n  if(dRaw){ const dt=new Date(dRaw+'T00:00'); d=String(dt.getDate()).padStart(2,'0'); m=CYC_MONTHS_SHORT[dt.getMonth()]; }\n  const recBadge = rec && rec!=='Ponctuel' ? '<span class=\"badge bdg-info\">'+rec+'<\u002Fspan>' : '<span class=\"badge bdg-neutral\">Ponctuel<\u002Fspan>';\n  const typeBadge = t.badge ? '<span class=\"badge '+t.badge+'\">'+type+'<\u002Fspan>' : '<span class=\"badge\" style=\"background:var(--purple-bg);color:var(--purple)\">'+type+'<\u002Fspan>';\n  const timeStr = start ? (start+(end?' – '+end:'')) : 'Horaire à définir';\n  const agendaStr = agenda.length ? agenda.length+' point'+(agenda.length>1?'s':'')+' à l\\'ordre du jour' : 'Ordre du jour à préparer';\n  const avs = tags.slice(0,3).map(a=>'<div class=\"'+a.className+'\">'+a.textContent+'<\u002Fdiv>').join('') + (tags.length>3?'<div class=\"av av-5\">+'+(tags.length-3)+'<\u002Fdiv>':'');\n  // enregistrer l'instance pour la préparation\n  const prepKey='inst-'+(Date.now());\n  INST_PREP[prepKey]={\n    name:label, type:type, badge:(t.badge||'bdg-neutral'), bg:t.bg, fg:t.fg,\n    d:d, m:m, sub:timeStr+' · '+loc,\n    agenda: agenda.length ? agenda.map(p=>[p,'—']) : [['Point à définir','—']],\n    docs:[], arb:[],\n    parts: tags.map(a=>[a.textContent, (a.className.match(/av-\\d/)||['av-1'])[0]]),\n    partsN: tags.length\n  };\n  const item=document.createElement('div');\n  item.className='cyc-item row-flash';\n  item.innerHTML='<div class=\"cyc-date\"><span class=\"d\">'+d+'<\u002Fspan><span class=\"m\">'+m+'<\u002Fspan><\u002Fdiv>'\n    +'<div class=\"cyc-body\">'\n    +'<div class=\"cyc-toprow\"><span class=\"cyc-name\">'+label+'<\u002Fspan>'+typeBadge+recBadge+'<\u002Fdiv>'\n    +'<div class=\"cyc-meta\">'+timeStr+' · '+loc+' · '+agendaStr+'<\u002Fdiv>'\n    +'<div class=\"cyc-foot\">'\n    +'<div class=\"cyc-participants\">'+avs+'<\u002Fdiv>'\n    +'<div class=\"cyc-stat\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.75\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><polyline points=\"12 6 12 12 16 14\"/><\u002Fsvg>Convocation à envo lvl}<\u002Fdiv><\u002Fdiv>\n            <div class=\"pp2card\"><div class=\"pp2card-label\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"rgba(255,255,255,.5)\" stroke-width=\"2\"><path d=\"M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2\"/><circle cx=\"9\" cy=\"7\" r=\"4\"/><\u002Fsvg>Équipe · ${p.team.length}<\u002Fdiv><div class=\"pp2-team\">${team}<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv><\u002Fdiv>`;\n  }).join('');\n}\nfunction openPresent(){\n  buildPresentSlides();\n  const slides=document.querySelectorAll('#presentStage .pslide');\n  presentTotal=slides.length;\n  // dots\n  const dots=document.getElementById('presentDots');\n  dots.innerHTML='';\n  for(let i=0;i<presentTotal;i++){ const d=document.createElement('div'); d.className='pdot'; d.onclick=()=>presentSet(i); dots.appendChild(d); }\n  presentIdx=0;\n  document.getElementById('present').classList.add('open');\n  presentSet(0);\n}\nfunction closePresent(){ document.getElementById('present').classList.remove('open'); }\nfunction presentSet(i){\n  presentIdx=Math.max(0,Math.min(i,presentTotal-1));\n  document.querySelectorAll('#presentStage .pslide').forEach((s,n)=>s.classList.toggle('active', n===presentIdx));\n  document.querySelectorAll('#presentDots .pdot').forEach((d,n)=>{ d.classList.toggle('active', n===presentIdx); d.classList.toggle('done', n<presentIdx); });\n  document.getElementById('presentCount').textContent=(presentIdx+1)+' / '+presentTotal;\n  document.getElementById('pPrev').disabled=presentIdx===0;\n  document.getElementById('pNext').disabled=presentIdx===presentTotal-1;\n}\nfunction presentGo(d){ presentSet(presentIdx+d); }\ndocument.addEventListener('keydown',e=>{\n  if(!document.getElementById('present').classList.contains('open')) return;\n  if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'){ e.preventDefault(); presentGo(1); }\n  else if(e.key==='ArrowLeft'||e.key==='PageUp'){ e.preventDefault(); presentGo(-1); }\n  else if(e.key==='Escape'){ closePresent(); }\n});\nfunction npPickType(el,label){\n  document.querySelectorAll('#view-new .typecard').forEach(c=>c.classList.remove('sel'));\n  el.classList.add('sel');\n  const cat=label.replace(/&amp;/g,'&');\n  document.getElementById('npp-cat').textContent=cat;\n  const rt=document.getElementById('r-type'); if(rt) rt.textContent=cat;\n}\nfunction npPickMethod(el){\n  document.querySelectorAll('#view-new .methodcard').forEach(c=>c.classList.remove('sel'));\n  el.classList.add('sel');\n  const m=el.querySelector('.methodcard-name').textContent;\n  const rm=document.getElementById('r-method'); if(rm) rm.textContent=m;\n}\n/* ============================================================\n   VISION STRATÉGIQUE — axes & objectifs\n   ============================================================ */\nconst AXIS_TONE={\n  success:{color:'var(--state-success)', bg:'var(--state-success-bg)', bar:'var(--state-success)', badge:'bdg-success', label:'En bonne trajectoire', icon:'<polyline points=\"22 7 13.5 15.5 8.5 10.5 2 17\"/><polyline points=\"16 7 22 7 22 13\"/>'},\n  info:{color:'var(--state-info)', bg:'var(--state-info-bg)', bar:'var(--state-info)', badge:'bdg-success', label:'En bonne trajectoire', icon:'<rect x=\"2\" y=\"7\" width=\"20\" height=\"14\" rx=\"2\"/><path d=\"M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16\"/>'},\n  warning:{color:'var(--state-warning)', bg:'var(--state-warning-bg)', bar:'var(--brand-gold)', badge:'bdg-warn', label:'Attention requise', icon:'<path d=\"M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z\"/>'},\n  purple:{color:'var(--purple)', bg:'var(--purple-bg)', bar:'var(--purple)', badge:'bdg-success', label:'En bonne trajectoire', icon:'<path d=\"M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2\"/><circle cx=\"9\" cy=\"7\" r=\"4\"/><path d=\"M23 21v-2a4 4 0 0 0-3-3.87\"/>'}\n};\nlet AXES=[\n  {id:'ax1', idx:1, name:'Performance opérationnelle', desc:\"Industrialiser l'exploitation et fiabiliser les services pour atteindre 99,9% de disponibilité.\", pct:85, tone:'success', total:6, completed:5, objectives:[]},\n  {id:'ax2', idx:2, name:'Transformation digitale', desc:\"Moderniser le SI et l'expérience utilisateur pour accélérer la mise sur le marché des services.\", pct:72, tone:'info', total:6, completed:4, objectives:[]},\n  {id:'ax3', idx:3, name:'Maîtrise des risques', desc:'Renforcer la cybersécurité et la conformité (DORA, RGPD) face à des exigences réglementaires croissantes.', pct:65, tone:'warning', total:6, completed:3, objectives:[]},\n  {id:'ax4', idx:4, name:'Talents & culture', desc:'Attirer et fidéliser les compétences clés, et diffuser une culture produit et data dans les équipes.', pct:78, tone:'purple', total:7, completed:5, objectives:[]}\n];\nfunction pad2(n){ return n<10?'0'+n:''+n; }\nfunction renderAxes(){\n  document.getElementById('axes-sec-title').textContent='Les '+AXES.length+' axes stratégiques';\n  document.getElementById('axis-grid').innerHTML=AXES.map(a=>{\n    const t=AXIS_TONE[a.tone];\n    return '<div class=\"card axiscard\" style=\"'+(a.tone==='warning'?'border-color:#F2D9A8':'')+'\">'\n      +'<div class=\"axiscard-head\">'\n      +'<div class=\"axiscard-ico\" style=\"background:'+t.bg+';color:'+t.color+'\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.75\" stroke-linecap=\"round\">'+t.icon+'<\u002Fsvg><\u002Fdiv>'\n      +'<div><div class=\"axiscard-idx\">Axe '+pad2(a.idx)+'<\u002Fdiv><div class=\"axiscard-name\">'+a.name+'<\u002Fdiv><\u002Fdiv>'\n      +'<div class=\"axiscard-pct\" style=\"color:'+t.color+'\">'+a.pct+'%<\u002Fdiv>'\n      +'<\u002Fdiv>'\n      +'<p class=\"axiscard-desc\">'+a.desc+'<\u002Fp>'\n      +'<div class=\"bigbar\"><div class=\"bigbar-fill\" style=\"width:'+a.pct+'%;background:'+t.bar+'\"><\u002Fdiv><\u002Fdiv>'\n      +'<div class=\"axiscard-foot\">'\n      +'<span class=\"badge '+t.badge+'\">'+t.label+'<\u002Fspan>'\n      +'<span class=\"axiscard-obj\" style=\"cursor:pointer\" onclick=\"openAxisObjModal(\\''+a.id+'\\')\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.75\"><polyline points=\"9 11 12 14 22 4\"/><path d=\"M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11\"/><\u002Fsvg>'+a.completed+'/'+a.total+' objectifs<\u002Fspan>'\n      +'<\u002Fdiv><\u002Fdiv>';\n  }).join('');\n}\nfunction openAxisModal(){\n  document.getElementById('ax-name').value='';\n  document.getElementById('ax-desc').value='';\n  document.getElementById('ax-total').value='';\n  document.querySelectorAll('#ax-tone .type-pill').forEach((p,i)=>p.classList.toggle('sel', i===0));\n  document.getElementById('axisModal').classList.add('open');\n}\nfunction closeAxisModal(){ document.getElementById('axisModal').classList.remove('open'); }\nfunction axPickTone(el){ el.parentElement.querySelectorAll('.type-pill').forEach(p=>p.classList.remove('sel')); el.classList.add('sel'); }\nfunction saveAxis(){\n  const name=document.getElementById('ax-name').value.trim();\n  if(!name){ showToast && showToast('Merci de renseigner un nom'); return; }\n  const desc=document.getElementById('ax-desc').value.trim();\n  const total=parseInt(document.getElementById('ax-total').value,10)||0;\n  const tone=(document.querySelector('#ax-tone .type-pill.sel')||{}).dataset.tone||'success';\n  AXES.push({id:'ax'+Date.now(), idx:AXES.length+1, name, desc:desc||'Description à compléter.', pct:0, tone, total, completed:0, objectives:[]});\n  renderAxes();\n  closeAxisModal();\n}\nlet AOM_CURRENT=null;\nfunction openAxisObjModal(axisId){\n  AOM_CURRENT=axisId;\n  const a=AXES.find(x=>x.id===axisId); if(!a) return;\n  document.getElementById('aom-sub').textContent=a.name;\n  renderObjList(a);\n  hideAddObjectiveForm();\n  document.getElementById('axisObjModal').classList.add('open');\n}\nfunction closeAxisObjModal(){ document.getElementById('axisObjModal').classList.remove('open'); AOM_CURRENT=null; }\nfunction renderObjList(a){\n  const list=document.getElementById('aom-list');\n  if(!a.objectives.length){\n    list.innerHTML='<div style=\"font-size:13px;color:var(--neutral-500);padding:6px 0\">Aucun objectif détaillé pour le moment. Utilisez « Ajouter un objectif » pour en renseigner un.<\u002Fdiv>';\n    return;\n  }\n  list.innerHTML='<table class=\"dt\"><thead><tr><th>Objectif<\u002Fth><th>Responsable<\u002Fth><th>Échéance<\u002Fth><th>Avancement<\u002Fth><\u002Ftr><\u002Fthead><tbody>'\n    +a.objectives.map(o=>'<tr><td class=\"cell-strong\">'+o.title+'<\u002Ftd><td>'+(o.who||'—')+'<\u002Ftd><td>'+(o.due||'—')+'<\u002Ftd><td>'\n      +'<div class=\"bigbar\" style=\"width:100px;height:6px;display:inline-block;vertical-align:middle;margin-right:8px\"><div class=\"bigbar-fill\" style=\"width:'+o.pct+'%;background:'+(o.pct>=70?'var(--state-success)':o.pct>=40?'var(--brand-gold)':'var(--state-danger)')+'\"><\u002Fdiv><\u002Fdiv>'+o.pct+'%<\u002Ftd><\u002Ftr>').join('')\n    +'<\u002Ftbody><\u002Ftable>';\n}\nfunction showAddObjectiveForm(){\n  document.getElementById('aom-form').style.display='block';\n  document.getElementById('aom-addbtn').style.display='none';\n  document.getElementById('aom-cancelbtn').style.display='inline-flex';\n  document.getElementById('aom-savebtn').style.display='inline-flex';\n  document.getElementById('aom-title').value='';\n  document.getElementById('aom-who').value='';\n  document.getElementById('aom-due').value='';\n  document.getElementById('aom-pct').value=0;\n  document.getElementById('aom-pct-val').textContent='0%';\n}\nfunction hideAddObjectiveForm(){\n  document.getElementById('aom-form').style.display='none';\n  document.getElementById('aom-addbtn').style.display='inline-flex';\n  document.getElementById('aom-cancelbtn').style.display='none';\n  document.getElementById('aom-savebtn').style.display='none';\n}\nfunction saveObjective(){\n  const a=AXES.find(x=>x.id===AOM_CURRENT); if(!a) return;\n  const title=document.getElementById('aom-title').value.trim();\n  if(!title){ showToast && showToast(\"Merci de renseigner un titre d'objectif\"); return; }\n  const who=document.getElementById('aom-who').value.trim();\n  const due=document.getElementById('aom-due').value;\n  const pct=parseInt(document.getElementById('aom-pct').value,10)||0;\n  a.objectives.push({title, who, due, pct});\n  a.total+=1;\n  if(pct>=100) a.completed+=1;\n  renderObjList(a);\n  hideAddObjectiveForm();\n  renderAxes();\n}\ntry{renderAxes();}catch(e){}\n\nfunction npToggleMember(el){ el.classList.toggle('sel'); npSync(); }\nfunction npSync(){\n  const name=(document.getElementById('f-name')||{}).value||'Refonte Portail Client';\n  const budget=(document.getElementById('f-budget')||{}).value||'120 000 €';\n  const due=(document.getElementById('f-due')||{}).value||'30 juin 2025';\n  document.getElementById('npp-name').textContent=name;\n  document.getElementById('npp-budget').textContent=budget;\n  document.getElementById('npp-due').textContent=due;\n  // team: chef + selected members\n  const sel=[...document.querySelectorAll('#view-new .member-row.sel')];\n  const count=sel.length+1;\n  document.getElementById('npp-team-count').textContent=count+' membre'+(count>1?'s':'');\n  const av=document.getElementById('npp-avatars');\n  let html='<div class=\"av av-2\">MD<\u002Fdiv>';\n  sel.forEach(m=>{ const a=m.querySelector('.av'); html+='<div class=\"av '+[...a.classList].filter(c=>c.startsWith('av-')).join(' ')+'\">'+a.textContent+'<\u002Fdiv>'; });\n  av.innerHTML=html;\n  // recap mirrors\n  const set=(id,v)=>{const e=document.getElementById(id); if(e) e.textContent=v;};\n  set('r-name',name); set('r-budget',budget); set('r-due',due);\n  set('r-team', sel.length+' membre'+(sel.length>1?'s':''));\n}\n\n<\u002Fscript>\n\n<\u002Fbody><\u002Fhtml>"
  </script>
