<link rel="stylesheet" href="styles.css">
<style>
  html,body{margin:0;padding:0}
  .tile{width:1280px;height:854px;display:flex;font-family:var(--font-sans,sans-serif)}
  .main{flex:1;background:var(--brand-ink);display:flex;align-items:center;justify-content:center}
  .wordmark{color:#fff;font-size:210px;font-weight:800;letter-spacing:-0.02em;line-height:1}
  .swatches{width:220px;display:flex;flex-direction:column}
  .swatches div{flex:1}
</style>
<div class="tile">
  <div class="main"><div class="wordmark">Starium</div></div>
  <div class="swatches">
    <div style="background:var(--brand-gold)"></div>
    <div style="background:var(--state-info)"></div>
    <div style="background:var(--state-danger)"></div>
    <div style="background:var(--state-success)"></div>
  </div>
</div>
