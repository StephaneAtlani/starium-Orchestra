  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    const resourceBlobs = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

){\n  const items=PA_ACTIONS.filter(a=>!proj||a.project===proj);\n  const total=items.length, done=items.filter(a=>a.status==='termine').length;\n  const cours=items.filter(a=>a.status==='encours').length;\n  const late=items.filter(a=>paIsLate(a)).length;\n  const taux=total?Math.round(done/total*100):0;\n  return {total,open:total-done,cours,late,taux};\n}\nfunction paProgClass(p){ return p<50?'pf-bad':(p<80?'pf-warn':'pf-blue'); }\nfunction paCardHTML(a){\n  const pr=PA_PRIO[a.prio], own=PA_OWNERS.find(o=>o.id===a.owner)||PA_OWNERS[0];\n  const done=a.status==='termine', late=paIsLate(a);\n  const tag=done?'<span class=\"kcard-tag\" style=\"background:var(--state-success-bg);color:var(--state-success)\">Réalisé<\u002Fspan>':'<span class=\"kcard-tag '+pr.tag+'\">'+pr.label+'<\u002Fspan>';\n  const titleStyle=done?' style=\"text-decoration:line-through;text-decoration-color:var(--neutral-300)\"':'';\n  const wrapStyle=done?'flex:1;opacity:.78':'flex:1';\n  const dueIcon=done?'<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><polyline points=\"20 6 9 17 4 12\"/><\u002Fsvg>':'<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.75\"><rect x=\"3\" y=\"4\" width=\"18\" height=\"18\" rx=\"2\"/><line x1=\"16\" y1=\"2\" x2=\"16\" y2=\"6\"/><line x1=\"8\" y1=\"2\" x2=\"8\" y2=\"6\"/><line x1=\"3\" y1=\"10\" x2=\"21\" y2=\"10\"/><\u002Fsvg>';\n  const dueClass=done?'kcard-due':('kcard-due'+(late?' late':''));\n  const dueColor=done?' style=\"color:var(--state-success)\"':'';\n  const prog=(a.status==='encours'&&a.progress!=null)?'<div class=\"prog-cell\" style=\"margin:0 0 10px\"><div class=\"ptrack\"><div class=\"pfill '+paProgClass(a.progress)+'\" style=\"width:'+a.progress+'%\"><\u002Fdiv><\u002Fdiv><span class=\"prog-pct\">'+a.progress+'%<\u002Fspan><\u002Fdiv>':'';\n  return '<div class=\"kcard\" draggable=\"true\" ondragstart=\"paDragStart(event,'+a.id+')\" ondragend=\"paDragEnd(event)\" onclick=\"paEditAction('+a.id+')\">'\n    +'<div style=\"display:flex\"><div class=\"kprio\" style=\"background:'+(done?'var(--state-success)':pr.dot)+'\"><\u002Fdiv><div style=\"'+wrapStyle+'\">'\n    +'<div class=\"kcard-top\">'+tag+'<\u002Fdiv>'\n    +'<div class=\"kcard-title\"'+titleStyle+'>'+a.title+'<\u002Fdiv>'\n    +'<div class=\"kcard-proj\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.75\">'+paIconFor(a.project)+'<\u002Fsvg>'+a.project+'<\u002Fdiv>'\n    +prog\n    +'<div class=\"kcard-foot\"><span class=\"'+dueClass+'\"'+dueColor+'>'+dueIcon+a.dueLabel+'<\u002Fspan><div class=\"kav '+own.av+'\">'+own.ini+'<\u002Fdiv><\u002Fdiv>'\n    +'<\u002Fdiv><\u002Fdiv><\u002Fdiv>';\n}\nfunction paRenderKanban(proj){\n  const wrap=document.getElementById('pa-kanban'); if(!wrap) return;\n  const items=paFilteredActions(proj);\n  wrap.innerHTML=PA_COLS.map(c=>{\n    const colItems=items.filter(a=>a.status===c.key);\n    return '<div class=\"kcol\" data-status=\"'+c.key+'\" ondragover=\"paDragOver(event)\" ondragleave=\"paDragLeave(event)\" ondrop=\"paDrop(event,\\''+c.key+'\\')\">'\n      +'<div class=\"kcol-head\"><div class=\"kcol-title\"><span class=\"kcol-dot\" style=\"background:'+c.dot+'\"><\u002Fspan>'+c.label+'<\u002Fdiv><span class=\"kcol-count\">'+colItems.length+'<\u002Fspan><\u002Fdiv>'\n      +(colItems.length?colItems.map(paCardHTML).join(''):'<div class=\"kcard-empty-hint\">Glissez une action ici<\u002Fdiv>')\n      +'<\u002Fdiv>';\n  }).join('');\n}\nfunction paRowHTML(a){\n  const pr=PA_PRIO[a.prio], st=PA_STATUS_META[a.status], own=PA_OWNERS.find(o=>o.id===a.owner)||PA_OWNERS[0];\n  const late=paIsLate(a);\n  const prog=a.progress!=null?('<div class=\"prog-cell\"><div class=\"ptrack\"><div class=\"pfill '+paProgClass(a.progress)+'\" style=\"width:'+a.progress+'%\"><\u002Fdiv><\u002Fdiv><span class=\"prog-pct\">'+a.progress+'%<\u002Fspan><\u002Fdiv>'):'<span style=\"color:var(--neutral-300)\">—<\u002Fspan>';\n  return '<tr class=\" =>x.id===paEditingId);\n  PA_ACTIONS=PA_ACTIONS.filter(x=>x.id!==paEditingId);\n  paCloseAction();\n  paRefresh();\n  if(a) showToast('« '+a.title+' » supprimée');\n}\nfunction paRenderHome(){\n  const grid=document.getElementById('pa-cardgrid'); if(!grid) return;\n  grid.innerHTML=PA_PLANS.map(p=>{\n    const s=paStats(p.proj);\n    return '<div class=\"mb-card\" onclick=\"paOpen(\\''+p.id+'\\')\">'\n      +'<div class=\"mb-card-top\"><div class=\"mb-card-ico\" style=\"background:'+p.bg+';color:'+p.fg+'\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\">'+p.ico+'<\u002Fsvg><\u002Fdiv><div class=\"mb-card-tt\"><div class=\"mb-card-name\">'+p.name+'<\u002Fdiv><div class=\"mb-card-dir\">'+p.sub+'<\u002Fdiv><\u002Fdiv><\u002Fdiv>'\n      +'<div class=\"mb-card-total\">Actions ouvertes<br><b>'+s.open+'<\u002Fb> <span style=\"font-size:12px;font-weight:600;color:var(--neutral-500)\">/ '+s.total+' au total<\u002Fspan><\u002Fdiv>'\n      +'<div class=\"mb-card-track\"><i style=\"width:'+s.taux+'%;background:var(--state-success)\"><\u002Fi><\u002Fdiv>'\n      +'<div style=\"display:flex;justify-content:space-between;font-size:11px;font-weight:700\"><span style=\"color:var(--neutral-500)\">Réalisé '+s.taux+'%<\u002Fspan><span style=\"color:var(--neutral-500)\">'+s.cours+' en cours<\u002Fspan><\u002Fdiv>'\n      +'<div class=\"mb-card-foot\"><div>'+(s.late>0?'<span class=\"mb-card-alert\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z\"/><line x1=\"12\" y1=\"9\" x2=\"12\" y2=\"13\"/><\u002Fsvg>'+s.late+' en retard<\u002Fspan>':'<span class=\"mcf-k\" style=\"color:var(--state-success);font-weight:700\">À jour<\u002Fspan>')+'<\u002Fdiv><span class=\"mb-card-arrow\">Ouvrir<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\"><polyline points=\"9 18 15 12 9 6\"/><\u002Fsvg><\u002Fspan><\u002Fdiv>'\n      +'<\u002Fdiv>';\n  }).join('');\n}\nfunction paShowHome(){\n  document.getElementById('plans-detail').style.display='none';\n  document.getElementById('plans-home').style.display='';\n  paRenderHome();\n}\nfunction paOpen(id){\n  const p=PA_PLANS.find(x=>x.id===id)||PA_PLANS[0];\n  paCurrentId=id;\n  document.getElementById('plans-home').style.display='none';\n  document.getElementById('plans-detail').style.display='';\n  document.querySelector('.page-content').scrollTop=0;\n  document.getElementById('pa-title').textContent=p.name;\n  document.getElementById('pa-sub').textContent=p.proj?('Actions correctives et d\\'amélioration du projet '+p.proj+'.'):'Pilotez les actions correctives et d\\'amélioration sur l\\'ensemble des projets.';\n  document.getElementById('breadcrumb').innerHTML='<a onclick=\"showView(\\'list\\')\">Pilotage<\u002Fa><span class=\"bc-sep\">/<\u002Fspan><a onclick=\"paShowHome()\">Plans d\\'action<\u002Fa><span class=\"bc-sep\">/<\u002Fspan><span class=\"bc-current\">'+p.name+'<\u002Fspan>';\n  paPopulateSelects();\n  paRefresh();\n}\nfunction showTab(name){\n  document.querySelectorAll('#view-detail .dtab').forEach(t=>t.classList.toggle('active', t.dataset.tab===name));\n  document.querySelectorAll('#view-detail .tab-pane').forEach(p=>p.classList.toggle('active', p.dataset.pane===name));\n  document.querySelector('.page-content').scrollTop=0;\n}\n\n/* ─── Nouveau projet · wizard ─── */\nlet npStep=1;\nfunction npRender(){\n  document.querySelectorAll('#vstepper .vstep').forEach(s=>{\n    const n=+s.dataset.step;\n    s.classList.toggle('active', n===npStep);\n    s.classList.toggle('done', n<npStep);\n  });\n  document.querySelectorAll('#view-new .np-pane').forEach(p=>p.classList.toggle('active', +p.dataset.pane===npStep));\n  const back=document.getElementById('np-back');\n  back.style.visibility = npStep>1 ? 'visible' : 'hidden';\n  const next=document.getElementByI ementById('budgetModal').classList.remove('open'); }\n\n/* ═══════════ ÉQUIPES · planning éditable ═══════════ */\nconst EQ_MEMBERS=[\n  {id:'jt',ini:'JT',av:'av-1',name:'Julien Thomas',role:'Lead technique',team:'Développement',lead:true},\n  {id:'md',ini:'MD',av:'av-2',name:'Marc Dupont',role:'Chef de projet',team:'Développement'},\n  {id:'cn',ini:'CN',av:'av-5',name:'Camille Noël',role:'Développeuse',team:'Développement'},\n  {id:'ab',ini:'AB',av:'av-6',name:'Alice Bernard',role:'Lead UX & Design',team:'Design & UX',lead:true},\n  {id:'sl',ini:'SL',av:'av-3',name:'Sophie Leroy',role:'Architecte système',team:'Infrastructure',lead:true},\n  {id:'pd',ini:'PD',av:'av-4',name:'Paul Dubois',role:'Data Engineer',team:'Infrastructure'}\n];\nconst EQ_ASSIGN={\n  portail:{label:'Portail Client',sub:'7h',c:'var(--state-info)',bg:'var(--state-info-bg)'},\n  cloud:{label:'Migration Cloud',sub:'7h',c:'var(--teal)',bg:'var(--teal-bg)'},\n  sirh:{label:'SI RH',sub:'7h',c:'var(--purple)',bg:'var(--purple-bg)'},\n  dora:{label:'Conformité DORA',sub:'7h',c:'var(--brand-gold-700)',bg:'var(--brand-gold-050)'},\n  teletravail:{label:'Télétravail',sub:'',c:'var(--state-success)',bg:'var(--state-success-bg)'},\n  formation:{label:'Formation',sub:'',c:'#A02A52',bg:'#F6D7E3'},\n  conge:{label:'Congé',sub:'',c:'var(--neutral-500)',bg:'var(--neutral-100)'}\n};\nconst EQ_BASE={\n  jt:['portail','portail','cloud','portail','formation'],\n  md:['portail','portail','portail','teletravail','portail'],\n  cn:['portail','cloud','cloud','portail','teletravail'],\n  ab:['portail','portail','sirh','teletravail','portail'],\n  sl:['cloud','cloud','dora','cloud','teletravail'],\n  pd:['sirh','sirh','conge','conge','sirh']\n};\nconst EQ_MONTHS=['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];\nconst EQ_DAYNAMES=['Lun','Mar','Mer','Jeu','Ven'];\nfunction eqBuildWeeks(){\n  const base=new Date(2025,4,12); // lundi 12 mai (semaine courante = index 1)\n  const arr=[] ),engage:mbSumLines(env.lines,'engage'),conso:mbSumLines(env.lines,'conso'),prev:mbSumLines(env.lines,'prev'),dep:env.lines.reduce((s,l)=>s+Math.max(0,l.prev-l.budget),0)}; }\nfunction mbTot(b){\n  let t={budget:0,engage:0,conso:0,prev:0,dep:0,capex:0,opex:0};\n  b.env.forEach(e=>{const et=mbEnvTot(e);t.budget+=et.budget;t.engage+=et.engage;t.conso+=et.conso;t.prev+=et.prev;t.dep+=et.dep;if(e.type==='CAPEX')t.capex+=et.budget;else t.opex+=et.budget;});\n  return t;\n}\nfunction mbPfClass(pct){ return pct>=90?'pf-bad':(pct>=75?'pf-warn':'pf-ok'); }\nfunction mbBarColor(pct){ return pct>=90?'var(--state-danger)':(pct>=75?'var(--brand-gold)':'var(--state-info)'); }\n\n/* ---- ACCUEIL ---- */\nfunction mbShowHome(){\n  mbCurrentId=null;\n  document.getElementById('budgets-detail').style.display='none';\n  document.getElementById('budgets-home').style.display='';\n  renderBudgetsHome();\n}\nfunction mbSetYear(y,el){\n  mbYear=y; mbCurMonth = y==='2024'?12:9;\n  if(el){ el.parentElement.querySelectorAll('.seg-btn').forEach(b=>b.classList.remove('active')); el.classList.add('active'); }\n  if(mbCurrentId) renderBudgetDetail(mbCurrentId); else renderBudgetsHome();\n}\nfunction mbSetHomeView(v,el){\n  mbHomeView=v;\n  if(el){ el.parentElement.querySelectorAll('.seg-btn').forEach(b=>b.classList.remove('active')); el.classList.add('active'); }\n  document.getElementById('mb-cardgrid').style.display = v==='cards'?'':'none';\n  document.getElementById('mb-table').style.display = v==='table'?'':'none';\n}\nfunction renderBudgetsHome(){\n  let gB=0,gE=0,gC=0,gDep=0,alerts=0;\n  MBUDGETS.forEach(b=>{const t=mbTot(b);gB+=t.budget;gE+=t.engage;gC+=t.conso;gDep+=t.dep;if(t.conso/t.budget>=0.85||t.dep>0)alerts++;});\n  gB=mbf(gB);gE=mbf(gE);gC=mbf(gC);gDep=mbf(gDep);\n  const cons=document.getElementById('mb-consol');\n  if(cons) cons.innerHTML=\n    '<div class=\"mb-cons-cell lead\"><div class=\"mb-cons-k\" style=\"opacity:.8\">Budget consolidé '+mbYear+'<\u002Fdiv><div class=\"mb-con =\"mb-card-ico\" style=\"background:'+ac[0]+';color:'+ac[1]+'\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\">'+MB_ICO[b.ico]+'<\u002Fsvg><\u002Fdiv><div class=\"mb-card-tt\"><div class=\"mb-card-name\">'+b.name+'<\u002Fdiv><div class=\"mb-card-dir\">'+b.dir+'<\u002Fdiv><\u002Fdiv><span class=\"mb-card-type\" style=\"background:'+kindBg+';color:'+kindCol+'\">'+kind+'<\u002Fspan><\u002Fdiv>'\n      +'<div class=\"mb-card-total\">Budget alloué<br><b>'+fmtEur(mbf(t.budget))+'<\u002Fb><\u002Fdiv>'\n      +'<div class=\"mb-card-track\"><i style=\"width:'+Math.min(pct,100)+'%;background:'+mbBarColor(pct)+'\"><\u002Fi><\u002Fdiv>'\n      +'<div style=\"display:flex;justify-content:space-between;font-size:11px;font-weight:700\"><span style=\"color:var(--neutral-500)\">Consommé '+pct+'%<\u002Fspan><span style=\"color:var(--neutral-500)\">Reste '+fmtEur(mbf(t.budget-t.engage))+'<\u002Fspan><\u002Fdiv>'\n      +'<div class=\"mb-card-foot\"><div>'+(alert?'<span class=\"mb-card-alert\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z\"/><line x1=\"12\" y1=\"9\" x2=\"12\" y2=\"13\"/><\u002Fsvg>'+(t.dep>0?'Dépassement +'+fmtEur(mbf(t.dep)):'Seuil d\\'alerte')+'<\u002Fspan>':'<span class=\"mb-card-foot mcf-k\" style=\"color:var(--state-success);font-weight:700\">Sous contrôle<\u002Fspan>')+'<\u002Fdiv><span class=\"mb-card-arrow\">Ouvrir<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\"><polyline points=\"9 18 15 12 9 6\"/><\u002Fsvg><\u002Fspan><\u002Fdiv>'\n      +'<\u002Fdiv>';\n  }).join('');\n  // ---- vue tableau ----\n  document.getElementById('mb-cardgrid').style.display = mbHomeView==='cards'?'':'none';\n  document.getElementById('mb-table').style.display = mbHomeView==='table'?'':'none';\n  const tbody=document.getElementById('mb-table-body');\n  if(tbody){\n    let sB=0,sE=0,sC=0;\n    tbody.innerHTML=MBUDGETS.map(b=>{\n      const t=mbTot(b), ac=MB_ACCENT[b.color], pct=Math.round(t.conso/t.budget*100);\n      sB+=mbf(t.budget);sE+=mbf(t.engage);sC+=mbf(t.conso);\n      const alert=(pct>=90||t.dep>0), warn=(pct>=85&&pct<90);\n      const kind=t.capex&&t.opex?'Mixte':(t.capex?'CAPEX':'OPEX');\n      const etat=alert?'<span class=\"badge bdg-danger\">Alerte<\u002Fspan>':(warn?'<span class=\"badge bdg-warn\">À surveiller<\u002Fspan>':'<span class=\"badge bdg-success\">Sain<\u002Fspan>');\n      return '<tr class=\"cat-row\" onclick=\"openBudget(\\''+b.id+'\\')\"><td><div class=\"bcat\"><div class=\"bcat-ico\" style=\"background:'+ac[0]+';color:'+ac[1]+'\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\">'+MB_ICO[b.ico]+'<\u002Fsvg><\u002Fdiv><div><div class=\"cell-strong\">'+b.name+'<\u002Fdiv><div class=\"cell-sub\">'+b.dir+'<\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Ftd>'\n        +'<td><span class=\"badge bdg-neutral nodot\">'+kind+'<\u002Fspan><\u002Ftd>'\n        +'<td class=\"num\">'+fmtEur(mbf(t.budget))+'<\u002Ftd>'\n        +'<td class=\"num\" style=\"color:var(--brand-gold-700);font-weight:600\">'+fmtEur(mbf(t.engage))+'<\u002Ftd>'\n        +'<td class=\"num\" style=\"color:var(--state-info);font-weight:700\">'+fmtEur(mbf(t.conso))+'<\u002Ftd>'\n        +'<td class=\"num\">'+fmtEur(mbf(t.budget-t.engage))+'<\u002Ftd>'\n        +'<td><div class=\"prog-cell\" style=\"min-width:100px\"><div class=\"ptrack\"><div class=\"pfill '+mbPfClass(pct)+'\" style=\"width:'+Math.min(pct,100)+'%\"><\u002Fdiv><\u002Fdiv><span class=\"prog-pct\"'+(pct>=90?' style=\"color:var(--state-danger)\"':'')+'>'+pct+'%<\u002Fspan><\u002Fdiv><\u002Ftd>'\n        +'<td class=\"right\">'+etat+'<\u002Ftd><\u002Ftr>';\n    }).join('');\n    const spct=sB?Math.round(sC/sB*100):0;\n    document.getElementById('mb-table-foot').innerHTML='<tr style=\"border-top:2px solid var(--neutral-200)\"><td style=\"padding:14px 16px;font-weight:800;color:var(--brand-ink)\">Total consolidé<\u002Ftd><td><\u002Ftd><td class=\"num\" style=\"font-weight:800\">'+fmtEur(sB)+'<\u002Ftd><td class=\"num\" style=\"font-weight:800;color:var(--brand-gold-700)\">'+fmtEur(sE)+'<\u002Ftd><td class=\"num\" style=\"font-weight:800;color:var(--state-info)\">'+fmtEur(sC)+'<\u002Ftd><td class=\"num\" style=\"font-weight:800\">'+fmtEur(sB-sE)+'<\u002Ftd><td style=\"font-weight:800\">'+spct+'%<\u002Ftd><td><\u002Ftd><\u002Ftr>';\n  }\n}\n\n/* ---- DÉTAIL ---- */\nfunction openBudget(id){\n  mbCurrentId=id; mbFilter='all';\n  document.getElementById('budgets-home').style.display='none';\n  document.getElementById('budgets-detail').style.display='';\n  document.querySelector('.page-content').scrollTop=0;\n  document.getElementById('breadcrumb').innerHTML='<a onclick=\"showView(\\'list\\')\">Pilotage financier<\u002Fa><span class=\"bc-sep\">/<\u002Fspan><a onclick=\"mbShowHome()\">Budgets<\u002Fa><span class=\"bc-sep\">/<\u002Fspan><span class=\"bc-current\">'+MBUDGETS.find(b=>b.id===id).name+'<\u002Fspan>';\n  renderBudgetDetail(id);\n}\nfunction mbMonthly(b){\n  const t=mbTot(b), sumAll=MB_CURVE.reduce((a,c)=>a+c,0);\n  let sumUp=0; for(let m=0;m<mbCurMonth;m++) sumUp+=MB_CURVE[m];\n  const prev=MB_CURVE.map(c=>mbf(t.budget)*c/sumAll);\n  const real=MB_CURVE.map((c,m)=>m<mbCurMonth?mbf(t.conso)*c/sumUp:0);\n  return {prev,real};\n}\nfunction mbSetFilter(f,el){\n  mbFilter=f;\n  el.parentElement.querySelectorAll('.seg-btn').forEach(b=>b.classList.remove('active')); el.classList.add('active');\n  mbRenderTable();\n}\nfunction renderBudgetDetail(id){\n  const b=MBUDGETS.find(x=>x.id===id); if(!b) return;\n  const t=mbTot(b), ac=MB_ACCENT[b.color];\n  const pct=Math.round(t.conso/t.budget*100), engPct=Math.round(t.engage/t.budget*100);\n  const reste=t.budget-t.engage;\n  const kind=t.capex&&t.opex?'Mixte':(t.capex?'CAPEX':'OPEX');\n  const options=MBUDGETS.map(x=>'<option value=\"'+x.id+'\"'+(x.id===id?' selected':'')+'>'+x.name+'<\u002Foption>').join('');\n  const kpi=(k,v,sub,col,bar,barcol)=>'<div class=\"mb-kpi\"><div class=\"mb-kpi-k\">'+k+'<\u002Fdiv><div class=\"mb-kpi-v\"'+(col?' style=\"color:'+col+'\"':'')+'>'+v+'<\u002Fdiv>'+(sub?'<div class=\"mb-kpi-sub\" style=\"color:'+(col||'var(--neutral-500)')+'\">'+sub+'<\u002Fdiv>':'')+(bar!=null?'<div class=\"mb-kpi-bar\"><i style=\"width:'+Math.min(bar,100)+'%;background:'+(barcol||'var(--state-info)')+'\"><\u002Fi><\u002Fdiv>':'')+'<\u002Fdiv>';\n  const m=mbMonthly(b), maxM=Math.max(...m.prev,...m.real,1);\n  const chart=MB_MONTHS.map((mo,i)=>{\n    const over=m.real[i]>m.prev[i]*1.02;\n    return '<div class=\"mb-mcol\"><div class=\"mb-mbars\"><div class=\"mb-mbar prev\" style=\"height:'+(m.prev[i]/maxM*100)+'%\" title=\"Prévu '+fmtEur(Math.round(m.prev[i]))+'\"><\u002Fdiv><div class=\"mb-mbar real'+(over?' over':'')+'\" style=\"height:'+(m.real[i]/maxM*100)+'%\" title=\"Réalisé '+fmtEur(Math.round(m.real[i]))+'\"><\u002Fdiv><\u002Fdiv><div class=\"mb-mlabel\">'+mo+'<\u002Fdiv><\u002Fdiv>';\n  }).join('');\n  // recommandations\n  const recos=mbRecos(b,t);\n  const html=\n    '<div><span class=\"mb-back\" onclick=\"mbShowHome()\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\"><polyline points=\"15 18 9 12 15 6\"/><\u002Fsvg>Tous les budgets<\u002Fspan><\u002Fdiv>'\n    +'<div class=\"mb-detail-head\"><div class=\"mb-title-row\"><div class=\"mb-title-ico\" style=\"background:'+ac[0]+';color:'+ac[1]+'\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\">'+MB_ICO[b.ico]+'<\u002Fsvg><\u002Fdiv><div><div class=\"mb-title-h\">'+b.name+'<\u002Fdiv><div class=\"mb-title-sub\">'+b.dir+' · exercice '+mbYear+' · '+kind+'<\u002Fdiv><\u002Fdiv><\u002Fdiv>'\n    +'<div class=\"mb-switch\"><select class=\"nselect\" onchange=\"openBudget(this.value)\">'+options+'<\u002Fselect>'\n    +'<button class=\"mb-act-btn\" onclick=\"mbExport()\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.75\" stroke-linecap=\"round\"><path d=\"M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4\"/><polyline points=\"7 10 12 15 17 10\"/><line x1=\"12\" y1=\"15\" x2=\"12\" y2=\"3\"/><\u002Fsvg>Exporter<\u002Fbutton>'\n    +'<button class=\"mb-act-btn\" onclick=\"mbOpenForecast()\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.75\" stroke-linecap=\"round\"><path d=\"M3 3v18h18\"/><path d=\"M18.7 8l-5.1 5.2-2.8-2.7L7 14.3\"/><path d=\"M12 20h9\"/><\u002Fsvg>Prévisionnel<\u002Fbutton>'\n    +'<button class=\"mb-act-btn\" onclick=\"mbOpenReaffect()\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.75\" stroke-linecap=\"round\"><polyline points=\"17 1 21 5 17 9\"/><path d=\"M3 11V9a4 4 0 0 1 4-4h14\"/><polyline points=\"7 23 3 19 7 15\"/><path d=\"M21 13v2a4 4 0 0 1-4 4H3\"/><\u002Fsvg>Réaffecter<\u002Fbutton>'\n    +'<button class=\"mb-act-btn primary\" onclick=\"mbOpenDepense()\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\"><line x1=\"12\" y1=\"5\" x2=\"12\" y2=\"19\"/><line x1=\"5\" y1=\"12\" x2=\"19\" y2=\"12\"/><\u002Fsvg>Saisir une dépense<\u002Fbutton><\u002Fdiv><\u002Fdiv>'\n    +'<div class=\"mb-filters\"><div class=\"seg-toggle\"><button class=\"seg-btn active\" onclick=\"mbSetYear(\\'2025\\',this)\"'+(mbYear==='2025'?'':'')+'>2025<\u002Fbutton><button class=\"seg-btn'+(mbYear==='2024'?' active':'')+'\" onclick=\"mbSetYear(\\'2024\\',this)\">2024<\u002Fbutton><\u002Fdiv>'\n    +'<div class=\"seg-toggle\"><button class=\"seg-btn'+(mbFilter==='all'?' active':'')+'\" onclick=\"mbSetFilter(\\'all\\',this)\">Tout<\u002Fbutton><button class=\"seg-btn'+(mbFilter==='CAPEX'?' active':'')+'\" onclick=\"mbSetFilter(\\'CAPEX\\',this)\">CAPEX<\u002Fbutton><button class=\"seg-btn'+(mbFilter==='OPEX'?' active':'')+'\" onclick=\"mbSetFilter(\\'OPEX\\',this)\">OPEX<\u002Fbutton><\u002Fdiv><\u002Fdiv>'\n    +'<div class=\"mb-detail-kpis\">'\n    +kpi('Alloué',fmtEur(mbf(t.budget)),kind,'var(--brand-ink)',100,'var(--neutral-300)')\n    +kpi('Engagé',fmtEur(mbf(t.engage)),engPct+'%','var(--brand-gold-700)',engPct,'var(--brand-gold)')\n    +kpi('Consommé',fmtEur(mbf(t.conso)),pct+'%','var(--state-info)',pct,'var(--state-info)')\n    +kpi('Reste à engager',fmtEur(mbf(reste)),Math.round(reste/t.budget*100)+'% dispo','var(--state-success)',Math.round(reste/t.budget*100),'var(--state-success)')\n    +kpi('Dépassement',t.dep>0?'+'+fmtEur(mbf(t.dep)):'—',t.dep>0?'prévision > budget':'maîtrisé',t.dep>0?'var(--state-danger)':'var(--state-success)',null)\n    +kpi('Taux d\\'exécution',pct+'%',pct>=90?'tension':'nominal',pct>=90?'var(--state-danger)':'var(--brand-ink)',null)\n    +'<\u002Fdiv>'\n    +'<div class=\"mb-grid2\"><div class=\"card\" style=\"padding:18px\"><div class=\"bo-head\" style=\"margin-bottom:4px\"><span class=\"bo-title\">Réalisé vs prévu par mois<\u002Fspan><div class=\"gantt-legend\" style=\"padding:0\"><div class=\"gantt-leg\"><span class=\"gantt-leg-dot\" style=\"background:var(--neutral-200)\"><\u002Fspan>Prévu<\u002Fdiv><div class=\"gantt-leg\"><span class=\"gantt-leg-dot\" style=\"background:var(--state-info)\"><\u002Fspan>Réalisé<\u002Fdiv><\u002Fdiv><\u002Fdiv><div class=\"mb-mchart\">'+chart+'<\u002Fdiv><\u002Fdiv>'\n    +'<div class=\"mb-analysis\"><div class=\"mb-an-h\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M9.5 2A2.5 2.5 0 0 1 12 4.5v15A2.5 2.5 0 0 0 14.5 22\"/><path d=\"M3 7h4M3 12h4M3 17h4\"/><path d=\"M14.5 2A2.5 2.5 0 0 0 12 4.5\"/><path d=\"M17 7h4M17 12h4M17 17h4\"/><\u002Fsvg>Analyse & recommandations<\u002Fdiv>'+recos+'<\u002Fdiv><\u002Fdiv>'\n    +'<div class=\"card tablecard\"><div class=\"table-wrap\"><table class=\"dt\"><thead><tr><th>Enveloppe / ligne budgétaire<\u002Fth><th>Budget<\u002Fth><th>Engagé<\u002Fth><th>Consommé<\u002Fth><th>Prévision<\u002Fth><th>Dépassement<\u002Fth><th>Exécution<\u002Fth><\u002Ftr><\u002Fthead><tbody id=\"mb-tbody\"><\u002Ftbody><tfoot id=\"mb-tfoot\"><\u002Ftfoot><\u002Ftable><\u002Fdiv><div style=\"padding:12px 16px;border-top:1px solid var(--neutral-100);font-size:11.5px;color:var(--neutral-400);display:flex;align-items:center;gap:6px\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.75\" width=\"13\" height=\"13\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><line x1=\"12\" y1=\"16\" x2=\"12\" y2=\"12\"/><line x1=\"12\" y1=\"8\" x2=\"12.01\" y2=\"8\"/><\u002Fsvg>Cliquez sur une enveloppe pour déplier ses lignes · une ligne pour y saisir une dépense · « Prévisionnel » pour réviser les prévisions de fin d’exercice.<\u002Fdiv><\u002Fdiv>';\n  document.getElementById('budgets-detail').innerHTML=html;\n  mbRenderTable();\n}\nfunction mbRecos(b,t){\n  const out=[];\n  // lignes en dépassement\n  const depLines=[];\n  b.env.forEach(e=>e.lines.forEach(l=>{ if(l.prev>l.budget) depLines.push({env:e.name,name:l.name,gap:l.prev-l.budget}); }));\n  depLines.sort((a,x)=>x.gap-a.gap);\n  if(depLines.length){\n    const d=depLines[0];\n    out.push(['red','<path d=\"M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z\"/><line x1=\"12\" y1=\"9\" x2=\"12\" y2=\"13\"/>','<b>'+d.name+'<\u002Fb> ('+d.env+') dépasse son budget de '+fmtEur(mbf(d.gap))+'. '+(depLines.length>1?depLines.length+' lignes en dépassement au total.':'')+' Réaffectez depuis une ligne sous-consommée.','Réaffecter le budget','mbOpenReaffect()']);\n  }\n  // ligne sous-consommée -> source\n  let under=null; b.env.forEach(e=>e.lines.forEach(l=>{ const r=l.budget-l.engage; if(r>0 && (!under||r>under.r)) under={name:l.name,r:r}; }));\n  if(under && under.r>0){\n    out.push(['green','<polyline points=\"20 6 9 17 4 12\"/>','<b style=\"color:var(--state-success)\">'+under.name+'<\u002Fb> dispose de '+fmtEur(mbf(under.r))+' de marge non engagée — mobilisable pour absorber les dépassements ou financer une priorité.','Saisir une dépense','mbOpenDepense()']);\n  }\n  // exécution\n  const pct=Math.round(t.conso/t.budget*100);\n  if(pct<55 && mbCurMonth>=9){\n    out.push(['gold','<circle cx=\"12\" cy=\"12\" r=\"10\"/><polyline points=\"12 6 12 12 16 14\"/>','Taux d\\'exécution de seulement <b style=\"color:var(--brand-gold-700)\">'+pct+'%<\u002Fb> à '+mbCurMonth+' mois écoulés — risque de sous-consommation en fin d\\'exercice. Anticipez les engagements du T4.',null,null]);\n  } else {\n    out.push(['blue','<line x1=\"12\" y1=\"20\" x2=\"12\" y2=\"10\"/><line x1=\"18\" y1=\"20\" x2=\"18\" y2=\"4\"/><line x1=\"6\" y1=\"20\" x2=\"6\" y2=\"16\"/>','Exécution à <b style=\"color:var(--state-info)\">'+pct+'%<\u002Fb>, prévision de fin d\\'exercice à '+fmtEur(mbf(t.prev))+' pour '+fmtEur(mbf(t.budget))+' alloués — écart '+(t.budget-t.prev>=0?'favorable de '+fmtEur(mbf(t.budget-t.prev)):'défavorable de '+fmtEur(mbf(t.prev-t.budget)))+'.',null,null]);\n  }\n  return out.map(r=>{const ac=MB_ACCENT[r[0]];return '<div class=\"mb-reco\"><div class=\"mb-reco-ico\" style=\"background:'+ac[0]+';color:'+ac[1]+'\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.9\" stroke-linecap=\"round\" stroke-linejoin=\"round\">'+r[1]+'<\u002Fsvg><\u002Fdiv><div class=\"mb-reco-b\"><div class=\"mb-reco-t\">'+r[2]+'<\u002Fdiv>'+(r[3]?'<span class=\"mb-reco-a\" onclick=\"'+r[4]+'\">'+r[3]+'<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\"><polyline points=\"9 18 15 12 9 6\"/><\u002Fsvg><\u002Fspan>':'')+'<\u002Fdiv><\u002Fdiv>';}).join('');\n}\nfunction mbRenderTable(){\n  const b=MBUDGETS.find(x=>x.id===mbCurrentId); if(!b) return;\n  const tb=document.getElementById('mb-tbody'); if(!tb) return;\n  let html='', tB=0,tE=0,tC=0,tP=0,tDep=0;\n  b.env.forEach((e,ei)=>{\n    if(mbFilter!=='all' && e.type!==mbFilter) return;\n    const et=mbEnvTot(e), pct=Math.round(et.conso/et.budget*100);\n    tB+=et.budget;tE+=et.engage;tC+=et.conso;tP+=et.prev;tDep+=et.dep;\n    const tCol=e.type==='CAPEX'?['var(--state-info-bg)','var(--state-info)']:['var(--purple-bg)','var(--purple)'];\n    html+='<tr class=\"cat-row\" onclick=\"mbToggleEnv('+ei+')\"><td><div class=\"mb-env-name\"><span class=\"cat-chevron\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\" stroke-linecap=\"round\"><polyline points=\"9 18 15 12 9 6\"/><\u002Fsvg><\u002Fspan>'+e.name+'<span class=\"mb-env-type\" style=\"background:'+tCol[0]+';color:'+tCol[1]+'\">'+e.type+'<\u002Fspan><\u002Fdiv><\u002Ftd>'\n      +'<td class=\"num\">'+fmtEur(mbf(et.budget))+'<\u002Ftd>'\n      +'<td class=\"num\" style=\"color:var(--brand-gold-700);font-weight:600\">'+fmtEur(mbf(et.engage))+'<\u002Ftd>'\n      +'<td class=\"num\" style=\"color:var(--state-info);font-weight:700\">'+fmtEur(mbf(et.conso))+'<\u002Ftd>'\n      +'<td class=\"num\" style=\"color:var(--neutral-600);font-weight:600\">'+fmtEur(mbf(et.prev))+'<\u002Ftd>'\n      +'<td class=\"num\">'+(et.dep>0?'<span class=\"dep-pos\">+'+fmtEur(mbf(et.dep))+'<\u002Fspan>':'<span class=\"dep-none\">—<\u002Fspan>')+'<\u002Ftd>'\n      +'<td><div class=\"prog-cell\" style=\"min-width:100px\"><div class=\"ptrack\"><div class=\"pfill '+mbPfClass(pct)+'\" style=\"width:'+Math.min(pct,100)+'%\"><\u002Fdiv><\u002Fdiv><span class=\"prog-pct\"'+(pct>=90?' style=\"color:var(--state-danger)\"':'')+'>'+pct+'%<\u002Fspan><\u002Fdiv><\u002Ftd><\u002Ftr>';\n    e.lines.forEach((l,li)=>{\n      const ldep=Math.max(0,l.prev-l.budget), lpct=Math.round(l.conso/l.budget*100), leng=l.engage>l.budget;\n      html+='<tr class=\"mb-line-row\" data-env=\"'+ei+'\" style=\"display:none;cursor:pointer\" onclick=\"mbOpenDepense('+ei+','+li+')\"><td><span class=\"mb-line-name\">'+l.name+(leng?' <span class=\"badge bdg-danger\" style=\"margin-left:4px\">Engagé &gt; budget<\u002Fspan>':'')+'<\u002Fspan><\u002Ftd>'\n        +'<td class=\"num\">'+fmtEur(mbf(l.budget))+'<\u002Ftd>'\n        +'<td class=\"num\" style=\"font-weight:600;color:'+(leng?'var(--state-danger)':'var(--brand-gold-700)')+'\">'+fmtEur(mbf(l.engage))+'<\u002Ftd>'\n        +'<td class=\"num\" style=\"color:var(--state-info)\">'+fmtEur(mbf(l.conso))+'<\u002Ftd>'\n        +'<td class=\"num\" style=\"color:var(--neutral-600)\">'+fmtEur(mbf(l.prev))+'<\u002Ftd>'\n        +'<td class=\"num\">'+(ldep>0?'<span class=\"dep-pos\">+'+fmtEur(mbf(ldep))+'<\u002Fspan>':'<span class=\"dep-none\">—<\u002Fspan>')+'<\u002Ftd>'\n        +'<td><div class=\"prog-cell\" style=\"min-width:100px\"><div class=\"ptrack\"><div class=\"pfill '+mbPfClass(lpct)+'\" style=\"width:'+Math.min(lpct,100)+'%\"><\u002Fdiv><\u002Fdiv><span class=\"prog-pct\"'+(lpct>=90?' style=\"color:var(--state-danger)\"':'')+'>'+lpct+'%<\u002Fspan><\u002Fdiv><\u002Ftd><\u002Ftr>';\n    });\n  });\n  tb.innerHTML=html;\n  const tpct=tB?Math.round(tC/tB*100):0;\n  document.getElementById('mb-tfoot').innerHTML='<tr style=\"border-top:2px solid var(--neutral-200)\"><td style=\"padding:14px 16px;font-weight:800;color:var(--brand-ink)\">Total'+(mbFilter!=='all'?' '+mbFilter:'')+'<\u002Ftd><td class=\"num\" style=\"font-weight:800\">'+fmtEur(mbf(tB))+'<\u002Ftd><td class=\"num\" style=\"font-weight:800;color:var(--brand-gold-700)\">'+fmtEur(mbf(tE))+'<\u002Ftd><td class=\"num\" style=\"font-weight:800;color:var(--state-info)\">'+fmtEur(mbf(tC))+'<\u002Ftd><td class=\"num\" style=\"font-weight:800;color:var(--neutral-600)\">'+fmtEur(mbf(tP))+'<\u002Ftd><td class=\"num\" style=\"font-weight:800\">'+(tDep>0?'<span class=\"dep-pos\">+'+fmtEur(mbf(tDep))+'<\u002Fspan>':'—')+'<\u002Ftd><td style=\"font-weight:800\">'+tpct+'%<\u002Ftd><\u002Ftr>';\n}\nfunction mbToggleEnv(ei){\n  const rows=document.querySelectorAll('#mb-tbody .cat-row');\n  let idx=-1, target=null;\n  document.querySelectorAll('#mb-tbody tr').forEach(r=>{});\n  // find the cat-row whose onclick matches ei\n  rows.forEach(r=>{ if(r.getAttribute('onclick')==='mbToggleEnv('+ei+')') target=r; });\n  if(!target) return;\n  target.classList.toggle('open');\n  const open=target.classList.contains('open');\n  document.querySelectorAll('#mb-tbody .mb-line-row[data-env=\"'+ei+'\"]').forEach(r=>r.style.display=open?'':'none');\n}\nfunction mbExport(){\n  const b=MBUDGETS.find(x=>x.id===mbCurrentId); if(!b) return;\n  let csv='Enveloppe;Ligne;Type;Budget;Engagé;Consommé;Prévision;Dépassement\\n';\n  b.env.forEach(e=>e.lines.forEach(l=>{csv+=[e.name,l.name,e.type,mbf(l.budget),mbf(l.engage),mbf(l.conso),mbf(l.prev),Math.max(0,mbf(l.prev)-mbf(l.budget))].join(';')+'\\n';}));\n  mbDownloadCsv(csv, b.id+'-'+mbYear+'.csv');\n  showToast('Budget « '+b.name+' » exporté ('+mbYear+')');\n}\nfunction mbExportAll(){\n  let csv='Budget;Direction;Budget;Engagé;Consommé;Dépassement\\n';\n  MBUDGETS.forEach(b=>{const t=mbTot(b);csv+=[b.name,b.dir,mbf(t.budget),mbf(t.engage),mbf(t.conso),mbf(t.dep)].join(';')+'\\n';});\n  mbDownloadCsv(csv,'budgets-consolide-'+mbYear+'.csv');\n  showToast('Budget consolidé exporté ('+mbYear+')');\n}\nfunction mbDownloadCsv(csv,name){\n  try{ const blob=new Blob(['\\ufeff'+csv],{type:'text/csv;charset=utf-8'}); const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),1000); }catch(e){}\n}\n/* ---- Saisir une dépense ---- */\nlet mbDepNature='engage', mbDepPre=null;\nfunction mbFillEnvSelect(sel,b){ sel.innerHTML=b.env.map((e,i)=>'<option value=\"'+i+'\">'+e.name+'<\u002Foption>').join(''); }\nfunction mbFillLineSelect(sel,b,ei){ sel.innerHTML=b.env[ei].lines.map((l,i)=>'<option value=\"'+i+'\">'+l.name+'<\u002Foption>').join(''); }\nfunction mbOpenDepense(ei,li){\n  const b=MBUDGETS.find(x=>x.id===mbCurrentId); if(!b) return;\n  mbDepNature='engage';\n  document.querySelectorAll('#mbDepModal .type-pill').forEach(p=>p.classList.toggle('sel',p.dataset.nat==='engage'));\n  document.getElementById('mbDepSub').textContent=b.name+' · '+b.dir;\n  const eSel=document.getElementById('mbDepEnv'); mbFillEnvSelect(eSel,b);\n  if(typeof ei==='number'){ eSel.value=ei; }\n  mbDepEnvChange();\n  if(typeof li==='number'){ document.getElementById('mbDepLine').value=li; }\n  document.getElementById('mbDepLabel').value='';\n  mbDepUpdateImpact();\n  document.getElementById('mbDepModal').classList.add('open');\n}\nfunction mbCloseDepense(){ document.getElementById('mbDepModal').classList.remove('open'); }\nfunction mbDepNat(el){ mbDepNature=el.dataset.nat; el.parentElement.querySelectorAll('.type-pill').forEach(p=>p.classList.remove('sel')); el.classList.add('sel'); mbDepUpdateImpact(); }\nfunction mbDepEnvChange(){ const b=MBUDGETS.find(x=>x.id===mbCurrentId); mbFillLineSelect(document.getElementById('mbDepLine'),b,+document.getElementById('mbDepEnv').value); mbDepUpdateImpact(); }\nfunction mbDepUpdateImpact(){\n  const b=MBUDGETS.find(x=>x.id===mbCurrentId); if(!b) return;\n  const ei=+document.getElementById('mbDepEnv').value, li=+document.getElementById('mbDepLine').value;\n  const l=b.env[ei].lines[li]; if(!l) return;\n  const amt=Math.max(0,+document.getElementById('mbDepAmt').value||0);\n  const nEng=mbDepNature==='engage'?l.engage+amt:Math.max(l.engage,l.conso+amt);\n  const nCon=mbDepNature==='conso'?l.conso+amt:l.conso;\n  const over=nEng>l.budget;\n  document.getElementById('mbDepImpact').innerHTML='Ligne <b>'+l.name+'<\u002Fb> — budget '+fmtEur(l.budget)+'. Après saisie : engagé '+fmtEur(nEng)+' · consommé '+fmtEur(nCon)+'. '+(over?'<span style=\"color:var(--state-danger);font-weight:800\">⚠ Dépassement de '+fmtEur(nEng-l.budget)+'<\u002Fspan>':'<span style=\"color:var(--state-success);font-weight:700\">Dans l\\'enveloppe.<\u002Fspan>');\n}\ndocument.addEventListener('input',e=>{ if(e.target&&e.target.id==='mbDepAmt') mbDepUpdateImpact(); });\ndocument.addEventListener('change',e=>{ if(e.target&&e.target.id==='mbDepLine') mbDepUpdateImpact(); });\nfunction mbSaveDepense(){\n  const b=MBUDGETS.find(x=>x.id===mbCurrentId); if(!b) return;\n  const ei=+document.getElementById('mbDepEnv').value, li=+document.getElementById('mbDepLine').value;\n  const l=b.env[ei].lines[li];\n  const amt=Math.max(0,+document.getElementById('mbDepAmt').value||0);\n  if(!amt){ showToast('Renseignez un montant'); return; }\n  if(mbDepNature==='engage'){ l.engage+=amt; }\n  else { l.conso+=amt; if(l.conso>l.engage) l.engage=l.conso; }\n  mbCloseDepense();\n  renderBudgetDetail(mbCurrentId);\n  showToast('Dépense enregistrée · '+fmtEur(amt)+' sur '+l.name);\n}\n/* ---- Réaffecter ---- */\nfunction mbFlatLines(b){ const arr=[]; b.env.forEach((e,ei)=>e.lines.forEach((l,li)=>arr.push({ei,li,label:e.name+' › '+l.name,l}))); return arr; }\nfunction mbOpenReaffect(){\n  const b=MBUDGETS.find(x=>x.id===mbCurrentId); if(!b) return;\n  document.getElementById('mbReafSub').textContent=b.name;\n  const flat=mbFlatLines(b);\n  const opts=flat.map((f,i)=>'<option value=\"'+i+'\">'+f.label+' ('+fmtEur(f.l.budget)+')<\u002Foption>').join('');\n  const from=document.getElementById('mbReafFrom'), to=document.getElementById('mbReafTo');\n  from.innerHTML=opts; to.innerHTML=opts; to.value=1;\n  mbReafCalc();\n  document.getElementById('mbReafModal').classList.add('open');\n}\nfunction mbCloseReaffect(){ document.getElementById('mbReafModal').classList.remove('open'); }\nfunction mbReafCalc(){\n  const b=MBUDGETS.find(x=>x.id===mbCurrentId); if(!b) return;\n  const flat=mbFlatLines(b);\n  const fi=+document.getElementById('mbReafFrom').value, ti=+document.getElementById('mbReafTo').value;\n  const amt=Math.max(0,+document.getElementById('mbReafAmt').value||0);\n  const F=flat[fi], T=flat[ti];\n  if(!F||!T){ return; }\n  const el=document.getElementById('mbReafImpact');\n  if(fi===ti){ el.innerHTML='<span style=\"color:var(--state-danger);font-weight:700\">Sélectionnez deux lignes différentes.<\u002Fspan>'; return; }\n  const fRest=F.l.budget-F.l.engage;\n  const warn=amt>fRest?'<span style=\"color:var(--state-danger);font-weight:800\">⚠ '+F.l.name+' n\\'a que '+fmtEur(fRest)+' non engagés.<\u002Fspan>':'';\n  el.innerHTML='<b>'+F.l.name+'<\u002Fb> : '+fmtEur(F.l.budget)+' → '+fmtEur(F.l.budget-amt)+'<br><b>'+T.l.name+'<\u002Fb> : '+fmtEur(T.l.budget)+' → '+fmtEur(T.l.budget+amt)+'<br>'+warn;\n}\nfunction mbSaveReaffect(){\n  const b=MBUDGETS.find(x=>x.id===mbCurrentId); if(!b) return;\n  const flat=mbFlatLines(b);\n  const fi=+document.getElementById('mbReafFrom').value, ti=+document.getElementById('mbReafTo').value;\n  const amt=Math.max(0,+document.getElementById('mbReafAmt').value||0);\n  if(fi===ti||!amt){ showToast('Réaffectation impossible'); return; }\n  flat[fi].l.budget-=amt; flat[ti].l.budget+=amt;\n  mbCloseReaffect();\n  renderBudgetDetail(mbCurrentId);\n  showToast(fmtEur(amt)+' réaffectés vers '+flat[ti].l.name);\n}\n/* ---- Réviser le prévisionnel + calculette ---- */\nlet mbFcOrig=null;\nlet mbCalcState={lineIdx:0,base:'prev',growth:0,gran:'trimestre',method:'lineaire',step:5};\nfunction mbOpenForecast(){\n  const b=MBUDGETS.find(x=>x.id===mbCurrentId); if(!b) return;\n  document.getElementById('mbFcSub').textContent=b.name+' · prévisions de fin d\\'exercice '+mbYear;\n  mbFcOrig=mbFlatLines(b).map(f=>f.l.prev);\n  mbCalcState={lineIdx:0,base:'prev',growth:0,gran:'trimestre',method:'lineaire',step:5};\n  const lineSel=document.getElementById('mbCalcLine');\n  lineSel.innerHTML=mbFlatLines(b).map((f,i)=>'<option value=\"'+i+'\">'+f.label+'<\u002Foption>').join('');\n  lineSel.value='0';\n  document.getElementById('mbCalcBase').value='prev';\n  document.getElementById('mbCalcGrowth').value='0';\n  document.getElementById('mbCalcStep').value='5';\n  document.getElementById('mbCalcStepWrap').style.display='none';\n  mbFcRenderAll();\n  document.getElementById('mbFcModal').classList.add('open');\n}\nfunction mbCloseForecast(){ document.getElementById('mbFcModal').classList.remove('open'); if(mbCurrentId) renderBudgetDetail(mbCurrentId); }\nfunction mbFcReset(){\n  const b=MBUDGETS.find(x=>x.id===mbCurrentId); if(!b||!mbFcOrig) return;\n  mbFlatLines(b).forEach((f,i)=>{ f.l.prev=mbFcOrig[i]; delete f.l.mth; delete f.l.sched; });\n  mbFcRenderAll();\n}\nfunction mbFcRenderAll(){ mbFcRenderSummary(); mbFcRenderList(); mbCalcRegen(); }\nfunction mbFcTotals(){\n  const b=MBUDGETS.find(x=>x.id===mbCurrentId); const t=mbTot(b); return {b,budget:t.budget,prev:t.prev,conso:t.conso};\n}\nfunction mbFcRenderSummary(){\n  const T=mbFcTotals(); const gap=T.prev-T.budget;\n  const cell=(k,v,col)=>'<div style=\"border:1px solid var(--neutral-200);border-radius:10px;padding:11px 13px;text-align:center\"><div style=\"font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--neutral-500);margin-bottom:5px\">'+k+'<\u002Fdiv><div style=\"font-size:16px;font-weight:800;font-variant-numeric:tabular-nums'+(col?';color:'+col:'')+'\">'+v+'<\u002Fdiv><\u002Fdiv>';\n  document.getElementById('mbFcSummary').innerHTML=cell('Budget alloué',fmtEur(mbf(T.budget)))+cell('Prévision totale',fmtEur(mbf(T.prev)),'var(--state-info)')+cell('Écart projeté',(gap>0?'+':'')+fmtEur(mbf(gap)),gap>0?'var(--state-danger)':'var(--state-success)');\n}\nfunction mbFcRenderList(){\n  const b=MBUDGETS.find(x=>x.id===mbCurrentId);\n  const flat=mbFlatLines(b); flat.forEach(f=>mbEnsureMonthly(f.l));\n  const M=['Jan','Fév','Mar','Avr','Mai','Juin','Juil','Aoû','Sep','Oct','Nov','Déc'];\n  let head='<tr><th>Ligne<\u002Fth>'+M.map(m=>'<th>'+m+'<\u002Fth>').join('')+'<th>Total<\u002Fth><th>Écart<\u002Fth><\u002Ftr>';\n  const rows=flat.map(f=>{\n    const l=f.l, sum=l.mth.reduce((s,v)=>s+(+v||0),0), gap=sum-l.budget;\n    const cells=l.mth.map((v,m)=>'<td><input class=\"mb-mth-in\" type=\"number\" inputmode=\"decimal\" value=\"'+Math.round(v)+'\" oninput=\"mbFcEditMonth('+f.ei+','+f.li+','+m+',this.value)\"><\u002Ftd>').join('');\n    return '<tr><td class=\"mb-mth-name\" title=\"'+f.label+'\">'+l.name+'<\u002Ftd>'+cells+'<td class=\"mb-mth-tot\" id=\"mbrt-'+f.ei+'-'+f.li+'\">'+fmtEur(mbf(sum))+'<\u002Ftd><td class=\"mb-mth-ec\" id=\"mbre-'+f.ei+'-'+f.li+'\" style=\"color:'+(gap>0?'var(--state-danger)':(gap<0?'var(--state-success)':'var(--neutral-400)'))+'\">'+(gap>0?'+'+fmtEur(mbf(gap)):(gap<0?fmtEur(mbf(gap)):'—'))+'<\u002Ftd><\u002Ftr>';\n  }).join('');\n  document.getElementById('mbFcList').innerHTML='<table class=\"mb-mth-table\"><thead>'+head+'<\u002Fthead><tbody>'+rows+'<\u002Ftbody><\u002Ftable>';\n}\nfunction mbEnsureMonthly(l){\n  if(l.mth && l.mth.length===12) return;\n  const sum=MB_CURVE.reduce((a,c)=>a+c,0); let arr=[];\n  for(let m=0;m<12;m++) arr.push(Math.round(l.prev*MB_CURVE[m]/sum));\n  arr[11]+=l.prev-arr.reduce((a,c)=>a+c,0);\n  l.mth=arr;\n}\nfunction mbFcEditMonth(ei,li,m,val){\n  const b=MBUDGETS.find(x=>x.id===mbCurrentId); const l=b.env[ei].lines[li];\n  l.mth[m]=Math.max(0,+val||0);\n  const sum=l.mth.reduce((s,v)=>s+(+v||0),0); l.prev=sum;\n  const gap=sum-l.budget;\n  const rt=document.getElementById('mbrt-'+ei+'-'+li); if(rt) rt.textContent=fmtEur(mbf(sum));\n  const re=document.getElementById('mbre-'+ei+'-'+li); if(re){ re.textContent=gap>0?'+'+fmtEur(mbf(gap)):(gap<0?fmtEur(mbf(gap)):'—'); re.style.color=gap>0?'var(--state-danger)':(gap<0?'var(--state-success)':'var(--neutral-400)'); }\n  mbFcRenderSummary();\n}\nfunction mbCalcSet(key,val,el){\n  mbCalcState[key]=(key==='growth'||key==='step'||key==='lineIdx')?(+val||0):val;\n  if(el){ el.parentElement.querySelectorAll('.seg-btn').forEach(b=>b.classList.remove('active')); el.classList.add('active'); }\n  if(key==='method'){ document.getElementById('mbCalcStepWrap').style.display = val==='croissance'?'':'none'; }\n  mbCalcRegen();\n}\nfunction mbCalcLineRef(){\n  const b=MBUDGETS.find(x=>x.id===mbCurrentId); const flat=mbFlatLines(b);\n  return flat[Math.min(mbCalcState.lineIdx,flat.length-1)]||flat[0];\n}\nfunction mbCalcNb(){ return {mois:12,trimestre:4,semestre:2}[mbCalcState.gran]||4; }\nfunction mbCalcGenerate(){\n  const f=mbCalcLineRef(); const l=f.l;\n  const baseVal = mbCalcState.base==='budget'?l.budget:l.prev;\n  const total = Math.round(baseVal*(1+mbCalcState.growth/100));\n  const n=mbCalcNb(); let parts=[];\n  if(mbCalcState.method==='croissance' && mbCalcState.step!==0){\n    const r=1+mbCalcState.step/100; let denom=0; for(let k=0;k<n;k++) denom+=Math.pow(r,k);\n    const p0=total/denom; for(let k=0;k<n;k++) parts.push(Math.round(p0*Math.pow(r,k)));\n  } else { const p=Math.round(total/n); for(let k=0;k<n;k++) parts.push(p); }\n  mbCalcState.parts=parts;\n}\nfunction mbCalcRegen(){ mbCalcGenerate(); mbCalcRenderBars(); mbCalcRenderGrid(); mbCalcRenderTotal(); }\nfunction mbCalcSum(){ return (mbCalcState.parts||[]).reduce((s,p)=>s+(+p||0),0); }\nfunction mbCalcRenderBars(){\n  const parts=mbCalcState.parts||[], labels=mbCalcLabels(parts.length), maxP=Math.max(...parts,1);\n  document.getElementById('mbCalcBars').innerHTML=parts.map((p,i)=>\n    '<div class=\"mb-fc-bcol\"><div class=\"mb-fc-bval\">'+fmtEur(mbf(Math.round(p)))+'<\u002Fdiv><div class=\"mb-fc-bar\" style=\"height:'+Math.max(4,p/maxP*100)+'%\"><\u002Fdiv><div class=\"mb-fc-blbl\">'+labels[i]+'<\u002Fdiv><\u002Fdiv>'\n  ).join('');\n}\nfunction mbCalcRenderGrid(){\n  const parts=mbCalcState.parts||[], labels=mbCalcLabels(parts.length);\n  document.getElementById('mbCalcGrid').innerHTML=parts.map((p,i)=>\n    '<div class=\"mb-fc-cell\"><div class=\"mb-fc-cell-l\">'+labels[i]+'<\u002Fdiv><input type=\"number\" inputmode=\"decimal\" value=\"'+Math.round(p)+'\" oninput=\"mbCalcEditCell('+i+',this.value)\"><\u002Fdiv>'\n  ).join('');\n}\nfunction mbCalcRenderTotal(){\n  const f=mbCalcLineRef(), sum=mbCalcSum(), l=f.l, gap=sum-l.budget;\n  const gapTxt=gap>0?'<span style=\"color:var(--state-danger);font-weight:800\">dépassement +'+fmtEur(mbf(gap))+'<\u002Fspan>':(gap<0?'<span style=\"color:var(--state-success);font-weight:700\">marge '+fmtEur(mbf(-gap))+'<\u002Fspan>':'équilibré');\n  document.getElementById('mbCalcTotal').innerHTML='<span>Total réparti · <span style=\"color:var(--neutral-500);font-weight:600\">budget '+fmtEur(mbf(l.budget))+' · '+gapTxt+'<\u002Fspan><\u002Fspan><span class=\"tt-v\">'+fmtEur(mbf(sum))+'<\u002Fspan>';\n}\nfunction mbCalcEditCell(i,val){ mbCalcState.parts[i]=Math.max(0,+val||0); mbCalcRenderBars(); mbCalcRenderTotal(); }\nfunction mbCalcLabels(n){\n  if(n===12) return ['Jan','Fév','Mar','Avr','Mai','Juin','Juil','Aoû','Sep','Oct','Nov','Déc'];\n  if(n===4) return ['T1','T2','T3','T4'];\n  return ['S1','S2'];\n}\nfunction mbCalcApply(){\n  const b=MBUDGETS.find(x=>x.id===mbCurrentId); if(!b) return;\n  const f=mbCalcLineRef(), sum=mbCalcSum();\n  const l=b.env[f.ei].lines[f.li];\n  l.prev=sum;\n  l.sched={gran:mbCalcState.gran,parts:mbCalcState.parts.slice()};\n  l.mth=mbToMonthly(mbCalcState.parts, mbCalcNb());\n  mbFcRenderSummary(); mbFcRenderList(); mbCalcRenderTotal();\n  showToast('Prévisionnel appliqué · '+f.label+' → '+fmtEur(mbf(sum)));\n}\nfunction mbToMonthly(parts,n){\n  if(n===12) return parts.map(p=>Math.round(p));\n  const per=12/n, out=[];\n  parts.forEach(p=>{ const each=Math.round(p/per); for(let k=0;k<per;k++) out.push(each); });\n  return out;\n}\nrenderBudgetsHome();\n\n/* ─── Cycles de pilotage : Planifier une instance + Calendrier ─── */\nconst CYC_TODAY='2025-05-13';\nconst CYC_TYPES={\n  COPIL:{bg:'var(--brand-gold-050)',fg:'var(--brand-gold-700)',dot:'var(--brand-gold)',badge:'bdg-gold'},\n  COMEX:{bg:'var(--state-danger-bg)',fg:'var(--state-danger)',dot:'var(--state-danger)',badge:'bdg-danger'},\n  CRA:{bg:'var(--state-info-bg)',fg:'var(--state-info)',dot:'var(--state-info)',badge:'bdg-info'},\n  CODIR:{bg:'var(--purple-bg)',fg:'var(--purple)',dot:'var(--purple)',badge:''}\n};\nconst CYC_MONTHS=['janvier','février','mars','avril','mai','juin','j docs+'<\u002Fdiv>';\n  document.getElementById('consultModal').classList.add('open');\n}\nfunction closeConsult(){ document.getElementById('consultModal').classList.remove('open'); }\nfunction bmPickType(el){ document.querySelectorAll('#budgetModal .type-pill').forEach(p=>p.classList.remove('sel')); el.classList.add('sel'); }\nfunction bmCalc(){\n  const ht=parseFloat((document.getElementById('bm-ht').value||'0').replace(/[^0-9.]/g,''))||0;\n  const rate=parseFloat(document.getElementById('bm-tva').value)||0;\n  const ttc=Math.round(ht*(1+rate/100));\n  document.getElementById('bm-ttc').textContent=fmtEur(ttc);\n}\ndocument.addEventListener('keydown',e=>{ if(e.key==='Escape'){ closeBudgetModal(); closePlan(); closeCalendar(); closePrepare(); closeConsult(); closeMeeting(); mbCloseDepense(); mbCloseReaffect(); mbCloseForecast(); } });\n\n/* toast */\nfunction showToast(msg){\n  const w=document.getElementById('toastWrap');\n  const t=document.createElement('div');\n  t.className='toast';\n  t.innerHTML='<span class=\"toast-ico\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\" stroke-linecap=\"round\"><polyline points=\"20 6 9 17 4 12\"/><\u002Fsvg><\u002Fspan>'+msg;\n  w.appendChild(t);\n  requestAnimationFrame(()=>t.classList.add('show'));\n  setTimeout(()=>{ t.classList.remove('show'); setTimeout(()=>t.remove(),300); }, 3200);\n}\n\n/* Enregistrer une dépense → ajoute la ligne dans le tableau Factures */\nlet factureSeq=161;\nfunction saveBudget(){\n  const label=(document.getElementById('bm-label').value||'').trim() || 'Nouvelle dépense';\n  const cat=document.getElementById('bm-cat').value;\n  const sup=document.getElementById('bm-sup').value;\n  const ttc=document.getElementById('bm-ttc').textContent;\n  const dRaw=document.querySelector('#budgetModal input[type=date]').value;\n  let dLabel='—';\n  if(dRaw){ const dt=new Date(dRaw+'T00:00'); dLabel=dt.toLocaleDateString('fr-FR',{day:'numeric',month:'short',year:'numeric'}); }\n  const typePill=document.querySelector('#budgetModal .type-pill.sel');\n  const statut=(typePill&&typePill.dataset.type)||'Engagée';\n  const statusClass={'Engagée':'is-engage','Facturée':'is-facture','Payée':'is-paye'}[statut]||'is-engage';\n  const prefix=statut==='Engagée'?'CMD':'FAC';\n  const ref=prefix+'-2025-0'+(++factureSeq);\n  const tb=document.getElementById('factures-tbody');\n  const tr=document.createElement('tr');\n  tr.className='row-flash'; tr.style.cursor='pointer';\n  tr.innerHTML='<td><div><div class=\"cell-strong\">'+ref+'<\u002Fdiv><div class=\"cell-sub\">'+label+'<\u002Fdiv><\u002Fdiv><\u002Ftd>'\n    +'<td>'+sup+'<\u002Ftd>'\n    +'<td><span class=\"badge bdg-neutral nodot\">'+cat+'<\u002Fspan><\u002Ftd>'\n    +'<td style=\"font-weight:700;font-variant-numeric:tabular-nums\">'+ttc+'<\u002Ftd>'\n    +'<td style=\"color:var(--neutral-600)\">'+dLabel+'<\u002Ftd>'\n    +'<td style=\"color:var(--neutral-600)\">—<\u002Ftd>'\n    +'<td class=\"right\"><span class=\"invoice-status '+statusClass+'\">'+statut+'<\u002Fspan><\u002Ftd>';\n  tb.insertBefore(tr, tb.firstChild);\n  closeBudgetModal();\n  showBud('factures');\n  showToast('Dépense enregistrée · '+ttc+' ('+statut.toLowerCase()+')');\n  // reset\n  document.getElementById('bm-label').value='';\n}\n\n/* Rend tous les segmented-toggles cliquables (état actif) */\ndocument.addEventListener('click',e=>{\n  const seg=e.target.closest('.seg-toggle .seg-btn');\n  if(seg){ seg.parentElement.querySelectorAll('.seg-btn').forEach(b=>b.classList.remove('active')); seg.classList.add('active'); }\n});\n\n/* ─── Mode présentation CODIR ─── */\nconst PRESENT_PROJECTS=[\n  {name:'Refonte Portail Client',cat:'Transformation digitale',owner:'Marc Dupont',av:'MD',avc:'av-2',icoc:'ti-gold',ico:'<rect x=\"2\" y=\"7\" width=\"20\" height=\"14\" rx=\"2\"/><path d=\"M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16\"/>',health:'excellente',htone:'success',status:'En cours',stone:'success',\n    indics:[{l:'Avancement',v:'68 =\"pproj2-indic-val\" style=\"color:${d.c}\">${d.v}<\u002Fdiv><div class=\"pproj2-indic-foot\">${d.f}<\u002Fdiv><\u002Fdiv>`).join('');\n    // timeline\n    const doneCount=p.timeline.filter(t=>t.s==='done').length;\n    const curIdx=p.timeline.findIndex(t=>t.s==='current');\n    const fillIdx=curIdx>=0?curIdx:doneCount-1;\n    const fillPct=p.timeline.length>1?(fillIdx/(p.timeline.length-1))*100:0;\n    const nodes=p.timeline.map(t=>`<div class=\"ptl-node ${t.s}\"><div class=\"ptl-dot\"><\u002Fdiv><div class=\"ptl-label\">${t.l}<\u002Fdiv><div class=\"ptl-date\">${t.d}<\u002Fdiv><\u002Fdiv>`).join('');\n    const team=p.team.map(t=>{const[ini,cls]=t.split(' ');return `<span class=\"av ${cls}\">${ini}<\u002Fspan>`;}).join('');\n    const dtone={success:{bg:'rgba(31,138,91,.22)',fg:'#A8E0C4',ic:'<polyline points=\"20 6 9 17 4 12\"/>'},info:{bg:'rgba(42,111,219,.2)',fg:'#9DCBF5',ic:'<circle cx=\"12\" cy=\"12\" r=\"10\"/><polyline points=\"12 6 12 12 16 14\"/>'},warn:{bg:'rgba(232,163,23,.2)',fg:'#F4D58A',ic:'<circle cx=\"12\" cy=\"12\" r=\"10\"/><line x1=\"12\" y1=\"8\" x2=\"12\" y2=\"12\"/><line x1=\"12\" y1=\"16\" x2=\"12.01\" y2=\"16\"/>'}};\n    const decis=(p.decisions||[]).map(d=>{const dt=dtone[d.tone];return `<div class=\"pdecis-row\"><div class=\"pdecis-ico\" style=\"background:${dt.bg};color:${dt.fg}\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\">${dt.ic}<\u002Fsvg><\u002Fdiv><div class=\"pdecis-body\"><div class=\"pdecis-text\">${d.t}<\u002Fdiv><div class=\"pdecis-meta\"><span class=\"pdecis-tag\" style=\"background:${dt.bg};color:${dt.fg}\">${d.tag}<\u002Fspan>${d.m}<\u002Fdiv><\u002Fdiv><\u002Fdiv>`;}).join('');\n    return `<div class=\"pslide\"><div class=\"pslide-eyebrow\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"7\" height=\"7\"/><rect x=\"14\" y=\"3\" width=\"7\" height=\"7\"/><rect x=\"14\" y=\"14\" width=\"7\" height=\"7\"/><rect x=\"3\" y=\"14\" width=\"7\" height=\"7\"/><\u002Fsvg>Reporting projet · ${i+1}/${PRESENT_PROJECTS.length}<\u002Fdiv>\n      <div class=\"pproj2\">\n        <div class=\"pproj2-left\">\n          <div class=\"pproj-ico\" style=\"background:${ICOBG[p.icoc]};color:${ICOFG[p.icoc]}\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.75\" stroke-linecap=\"round\">${p.ico}<\u002Fsvg><\u002Fdiv>\n          <div class=\"pproj-name\">${p.name}<\u002Fdiv>\n          <div class=\"pproj-cat\">${p.cat}<\u002Fdiv>\n          <div class=\"pproj-owner\"><span class=\"av ${p.avc}\">${p.av}<\u002Fspan><span>${p.owner}<\u002Fspan><\u002Fdiv>\n          <div class=\"pproj-health\" style=\"background:${ht.bg};color:${ht.fg}\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\" stroke-linecap=\"round\">${ht.ico}<\u002Fsvg>Santé ${p.health}<\u002Fdiv>\n          <div class=\"pproj2-indics\">${indics}<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"pproj2-right\">\n          <div>\n            <div class=\"ptl-title\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\"><line x1=\"3\" y1=\"12\" x2=\"21\" y2=\"12\"/><circle cx=\"7\" cy=\"12\" r=\"2\" fill=\"currentColor\"/><circle cx=\"17\" cy=\"12\" r=\"2\" fill=\"currentColor\"/><\u002Fsvg>Feuille de route<\u002Fdiv>\n            <div class=\"ptimeline\">\n              <div class=\"ptl-track\"><\u002Fdiv><div class=\"ptl-track-fill\" style=\"width:${fillPct}%\"><\u002Fdiv>\n              <div class=\"ptl-nodes\">${nodes}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"pdecis\">\n            <div class=\"ptl-title\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\"><path d=\"M9 11l3 3L22 4\"/><path d=\"M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11\"/><\u002Fsvg>Dernières décisions<\u002Fdiv>\n            <div class=\"pdecis-list\">${decis}<\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"pproj2-cards\">\n            <div class=\"pp2card\"><div class=\"pp2card-label\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"var(--brand-gold)\" stroke-width=\"2\"><polygon points=\"12 2 22 8.5 22 15.5 12 22 2 15.5 2 8.5 12 2\"/><\u002Fsvg>Prochain jalon<\u002Fdiv><div class=\"pp2card-main\">${p.next.m}<\u002Fdiv><div class=\"pp2card-sub\">${p.next.d}<\u002Fdiv><\u002Fdiv>\n            <div class=\"pp2card\"><div class=\"pp2card-label\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"${riskTone[p.risk.lvl]}\" stroke-width=\"2\"><path d=\"M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z\"/><line x1=\"12\" y1=\"9\" x2=\"12\" y2=\"13\"/><\u002Fsvg>Risque principal<\u002Fdiv><div class=\"pp2card-main\">${p.risk.m}<\u002Fdiv><div class=\"pp2card-sub\" style=\"color:${riskTone[p.risk.lvl]}\">Niveau ${p.risk.lvl}<\u002Fdiv><\u002Fdiv>\n            <div class=\"pp2card\"><div class=\"pp2card-label\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"rgba(255,255,255,.5)\" stroke-width=\"2\"><path d=\"M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2\"/><circle cx=\"9\" cy=\"7\" r=\"4\"/><\u002Fsvg>Équipe · ${p.team.length}<\u002Fdiv><div class=\"pp2-team\">${team}<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv><\u002Fdiv>`;\n  }).join('');\n}\nfunction openPresent(){\n  buildPresentSlides();\n  const slides=document.querySelectorAll('#presentStage .pslide');\n  presentTotal=slides.length;\n  // dots\n  const dots=document.getElementById('presentDots');\n  dots.innerHTML='';\n  for(let i=0;i<presentTotal;i++){ const d=document.createElement('div'); d.className='pdot'; d.onclick=()=>presentSet(i); dots.appendChild(d); }\n  presentIdx=0;\n  document.getElementById('present').classList.add('open');\n  presentSet(0);\n}\nfunction closePresent(){ document.getElementById('present').classList.remove('open'); }\nfunction presentSet(i){\n  presentIdx=Math.max(0,Math.min(i,presentTotal-1));\n  document.querySelectorAll('#presentStage .pslide').forEach((s,n)=>s.classList.toggle('active', n===presentIdx));\n  document.querySelectorAll('#presentDots .pdot').forEach((d,n)=>{ d.classList.toggle('active', n===presentIdx); d.classList.toggle('done', n<presentIdx); });\n  document.getElementById('presentCount').textContent=(presentIdx+1)+' / '+presentTotal;\n  document.getElementById('pPrev').disabled=presentIdx===0;\n  document.getElementById('pNext').disabled=presentIdx===presentTotal-1;\n}\nfunction presentGo(d){ presentSet(presentIdx+d); }\ndocument.addEventListener('keydown',e=>{\n  if(!document.getElementById('present').classList.contains('open')) return;\n  if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'){ e.preventDefault(); presentGo(1); }\n  else if(e.key==='ArrowLeft'||e.key==='PageUp'){ e.preventDefault(); presentGo(-1); }\n  else if(e.key==='Escape'){ closePresent(); }\n});\nfunction npPickType(el,label){\n  document.querySelectorAll('#view-new .typecard').forEach(c=>c.classList.remove('sel'));\n  el.classList.add('sel');\n  const cat=label.replace(/&amp;/g,'&');\n  document.getElementById('npp-cat').textContent=cat;\n  const rt=document.getElementById('r-type'); if(rt) rt.textContent=cat;\n}\nfunction npPickMethod(el){\n  document.querySelectorAll('#view-new .methodcard').forEach(c=>c.classList.remove('sel'));\n  el.classList.add('sel');\n  const m=el.querySelector('.methodcard-name').textContent;\n  const rm=document.getElementById('r-method'); if(rm) rm.textContent=m;\n}\n/* ============================================================\n   VISION STRATÉGIQUE — axes & objectifs\n   ============================================================ */\nconst AXIS_TONE={\n  success:{color:'var(--state-success)', bg:'var(--state-success-bg)', bar:'var(--state-success)', badge:'bdg-success', label:'En bonne trajectoire', icon:'<polyline points=\"22 7 13.5 15.5 8.5 10.5 2 17\"/><polyline points=\"16 7 22 7 22 13\"/>'},\n  info:{color:'var(--state-info)', bg:'var(--state-info-bg)', bar:'var(--state-info)', badge:'bdg-success', label:'En bonne trajectoire', icon:'<rect x=\"2\" y=\"7\" width=\"20\" height=\"14\" rx=\"2\"/><path d=\"M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16\"/>'},\n  warning:{color:'var(--state-warning)', bg:'var(--state-warning-bg)', bar:'var(--brand-gold)', badge:'bdg-warn', label:'Attention requise', icon:'<path d=\"M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z\"/>'},\n  purple:{color:'var(--purple)', bg:'var(--purple-bg)', bar:'var(--purple)', badge:'bdg-success', label:'En bonne trajectoire', icon:'<path d=\"M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2\"/><circle cx=\"9\" cy=\"7\" r=\"4\"/><path d=\"M23 21v-2a4 4 0 0 0-3-3.87\"/>'}\n};\nlet AXES=[\n  {id:'ax1', idx:1, name:'Performance opérationnelle', desc:\"Industrialiser l'exploitation et fiabiliser les services pour atteindre 99,9% de disponibilité.\", pct:85, tone:'success', total:6, completed:5, objectives:[]},\n  {id:'ax2', idx:2, name:'Transformation digitale', desc:\"Moderniser le SI et l'expérience utilisateur pour accélérer la mise sur le marché des services.\", pct:72, tone:'info', total:6, completed:4, objectives:[]},\n  {id:'ax3', idx:3, name:'Maîtrise des risques', desc:'Renforcer la cybersécurité et la conformité (DORA, RGPD) face à des exigences réglementaires croissantes.', pct:65, tone:'warning', total:6, completed:3, objectives:[]},\n  {id:'ax4', idx:4, name:'Talents & culture', desc:'Attirer et fidéliser les compétences clés, et diffuser une culture produit et data dans les équipes.', pct:78, tone:'purple', total:7, completed:5, objectives:[]}\n];\nfunction pad2(n){ return n<10?'0'+n:''+n; }\nfunction renderAxes(){\n  document.getElementById('axes-sec-title').textContent='Les '+AXES.length+' axes stratégiques';\n  document.getElementById('axis-grid').innerHTML=AXES.map(a=>{\n    const t=AXIS_TONE[a.tone];\n    return '<div class=\"card axiscard\" style=\"'+(a.tone==='warning'?'border-color:#F2D9A8':'')+'\">'\n      +'<div class=\"axiscard-head\">'\n      +'<div class=\"axiscard-ico\" style=\"background:'+t.bg+';color:'+t.color+'\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.75\" stroke-linecap=\"round\">'+t.icon+'<\u002Fsvg><\u002Fdiv>'\n      +'<div><div class=\"axiscard-idx\">Axe '+pad2(a.idx)+'<\u002Fdiv><div class=\"axiscard-name\">'+a.name+'<\u002Fdiv><\u002Fdiv>'\n      +'<div class=\"axiscard-pct\" style=\"color:'+t.color+'\">'+a.pct+'%<\u002Fdiv>'\n      +'<\u002Fdiv>'\n      +'<p class=\"axiscard-desc\">'+a.desc+'<\u002Fp>'\n      +'<div class=\"bigbar\"><div class=\"bigbar-fill\" style=\"width:'+a.pct+'%;background:'+t.bar+'\"><\u002Fdiv><\u002Fdiv>'\n      +'<div class=\"axiscard-foot\">'\n      +'<span class=\"badge '+t.badge+'\">'+t.label+'<\u002Fspan>'\n      +'<span class=\"axiscard-obj\" style=\"cursor:pointer\" onclick=\"openAxisObjModal(\\''+a.id+'\\')\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.75\"><polyline points=\"9 11 12 14 22 4\"/><path d=\"M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11\"/><\u002Fsvg>'+a.completed+'/'+a.total+' objectifs<\u002Fspan>'\n      +'<\u002Fdiv><\u002Fdiv>';\n  }).join('');\n}\nfunction openAxisModal(){\n  document.getElementById('ax-name').value='';\n  document.getElementById('ax-desc').value='';\n  document.getElementById('ax-total').value='';\n  document.querySelectorAll('#ax-tone .type-pill').forEach((p,i)=>p.classList.toggle('sel', i===0));\n  document.getElementById('axisModal').classList.add('open');\n}\nfunction closeAxisModal(){ document.getElementById('axisModal').classList.remove('open'); }\nfunction axPickTone(el){ el.parentElement.querySelectorAll('.type-pill').forEach(p=>p.classList.remove('sel')); el.classList.add('sel'); }\nfunction saveAxis(){\n  const name=document.getElementById('ax-name').value.trim();\n  if(!name){ showToast && showToast('Merci de renseigner un nom'); return; }\n  const desc=document.getElementById('ax-desc').value.trim();\n  const total=parseInt(document.getElementById('ax-total').value,10)||0;\n  const tone=(document.querySelector('#ax-tone .type-pill.sel')||{}).dataset.tone||'success';\n  AXES.push({id:'ax'+Date.now(), idx:AXES.length+1, name, desc:desc||'Description à compléter.', pct:0, tone, total, completed:0, objectives:[]});\n  renderAxes();\n  closeAxisModal();\n}\nlet AOM_CURRENT=null;\nfunction openAxisObjModal(axisId){\n  AOM_CURRENT=axisId;\n  const a=AXES.find(x=>x.id===axisId); if(!a) return;\n  document.getElementById('aom-sub').textContent=a.name;\n  renderObjList(a);\n  hideAddObjectiveForm();\n  document.getElementById('axisObjModal').classList.add('open');\n}\nfunction closeAxisObjModal(){ document.getElementById('axisObjModal').classList.remove('open'); AOM_CURRENT=null; }\nfunction renderObjList(a){\n  const list=document.getElementById('aom-list');\n  if(!a.objectives.length){\n    list.innerHTML='<div style=\"font-size:13px;color:var(--neutral-500);padding:6px 0\">Aucun objectif détaillé pour le moment. Utilisez « Ajouter un objectif » pour en renseigner un.<\u002Fdiv>';\n    return;\n  }\n  list.innerHTML='<table class=\"dt\"><thead><tr><th>Objectif<\u002Fth><th>Responsable<\u002Fth><th>Échéance<\u002Fth><th>Avancement<\u002Fth><\u002Ftr><\u002Fthead><tbody>'\n    +a.objectives.map(o=>'<tr><td class=\"cell-strong\">'+o.title+'<\u002Ftd><td>'+(o.who||'—')+'<\u002Ftd><td>'+(o.due||'—')+'<\u002Ftd><td>'\n      +'<div class=\"bigbar\" style=\"width:100px;height:6px;display:inline-block;vertical-align:middle;margin-right:8px\"><div class=\"bigbar-fill\" style=\"width:'+o.pct+'%;background:'+(o.pct>=70?'var(--state-success)':o.pct>=40?'var(--brand-gold)':'var(--state-danger)')+'\"><\u002Fdiv><\u002Fdiv>'+o.pct+'%<\u002Ftd><\u002Ftr>').join('')\n    +'<\u002Ftbody><\u002Ftable>';\n}\nfunction showAddObjectiveForm(){\n  document.getElementById('aom-form').style.display='block';\n  document.getElementById('aom-addbtn').style.display='none';\n  document.getElementById('aom-cancelbtn').style.display='inline-flex';\n  document.getElementById('aom-savebtn').style.display='inline-flex';\n  document.getElementById('aom-title').value='';\n  document.getElementById('aom-who').value='';\n  document.getElementById('aom-due').value='';\n  document.getElementById('aom-pct').value=0;\n  document.getElementById('aom-pct-val').textContent='0%';\n}\nfunction hideAddObjectiveForm(){\n  document.getElementById('aom-form').style.display='none';\n  document.getElementById('aom-addbtn').style.display='inline-flex';\n  document.getElementById('aom-cancelbtn').style.display='none';\n  document.getElementById('aom-savebtn').style.display='none';\n}\nfunction saveObjective(){\n  const a=AXES.find(x=>x.id===AOM_CURRENT); if(!a) return;\n  const title=document.getElementById('aom-title').value.trim();\n  if(!title){ showToast && showToast(\"Merci de renseigner un titre d'objectif\"); return; }\n  const who=document.getElementById('aom-who').value.trim();\n  const due=document.getElementById('aom-due').value;\n  const pct=parseInt(document.getElementById('aom-pct').value,10)||0;\n  a.objectives.push({title, who, due, pct});\n  a.total+=1;\n  if(pct>=100) a.completed+=1;\n  renderObjList(a);\n  hideAddObjectiveForm();\n  renderAxes();\n}\nrenderAxes();\n\nfunction npToggleMember(el){ el.classList.toggle('sel'); npSync(); }\nfunction npSync(){\n  const name=(document.getElementById('f-name')||{}).value||'Refonte Portail Client';\n  const budget=(document.getElementById('f-budget')||{}).value||'120 000 €';\n  const due=(document.getElementById('f-due')||{}).value||'30 juin 2025';\n  document.getElementById('npp-name').textContent=name;\n  document.getElementById('npp-budget').textContent=budget;\n  document.getElementById('npp-due').textContent=due;\n  // team: chef + selected members\n  const sel=[...document.querySelectorAll('#view-new .member-row.sel')];\n  const count=sel.length+1;\n  document.getElementById('npp-team-count').textContent=count+' membre'+(count>1?'s':'');\n  const av=document.getElementById('npp-avatars');\n  let html='<div class=\"av av-2\">MD<\u002Fdiv>';\n  sel.forEach(m=>{ const a=m.querySelector('.av'); html+='<div class=\"av '+[...a.classList].filter(c=>c.startsWith('av-')).join(' ')+'\">'+a.textContent+'<\u002Fdiv>'; });\n  av.innerHTML=html;\n  // recap mirrors\n  const set=(id,v)=>{const e=document.getElementById(id); if(e) e.textContent=v;};\n  set('r-name',name); set('r-budget',budget); set('r-due',due);\n  set('r-team', sel.length+' membre'+(sel.length>1?'s':''));\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
