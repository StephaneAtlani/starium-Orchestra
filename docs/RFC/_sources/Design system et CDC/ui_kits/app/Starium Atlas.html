<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Starium Atlas — Cartographie dynamique</title>
<template id="__bundler_thumbnail" data-bg-color="#14171C">
  <svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
    <rect width="1200" height="800" fill="#14171C"/>
    <circle cx="420" cy="300" r="26" fill="#2A6FDB"/>
    <circle cx="620" cy="380" r="26" fill="#E8A317"/>
    <circle cx="760" cy="260" r="20" fill="#6B2FB2"/>
    <circle cx="520" cy="520" r="18" fill="#1F8A5B"/>
    <line x1="420" y1="300" x2="620" y2="380" stroke="#3a4048" stroke-width="4"/>
    <line x1="620" y1="380" x2="760" y2="260" stroke="#B42318" stroke-width="4" stroke-dasharray="10 8"/>
    <line x1="420" y1="300" x2="520" y2="520" stroke="#3a4048" stroke-width="4"/>
  </svg>
</template>
<style>
@font-face {
  font-family: 'Manrope';
  src: url('../../fonts/Manrope-VariableFont_wght.ttf') format('truetype');
  font-weight: 200 800; font-style: normal; font-display: swap;
}
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --gold:#E8A317; --gold-600:#CC8E0E; --gold-100:#F4D58A; --gold-050:#FBEAB5;
  --danger:#B42318; --danger-bg:#FBE8E6;
  --warning:#C77A00; --warning-bg:#FFF1DC;
  --success:#1F8A5B; --success-bg:#E6F4ED;
  --info:#2A6FDB; --info-bg:#E3EEFB;
  --purple:#6B2FB2; --purple-bg:#EEE3FA;
  --orange:#C1660A; --orange-bg:#FBEADB;
  --teal:#0E7C74; --teal-bg:#DFF3F1;
  --gray-node:#5F5A52; --gray-bg:#F4F2EE;

  /* Chrome Starium — papier + or (design system officiel) */
  --atlas-bg:#FAF9F7;
  --atlas-surface:#FFFFFF;
  --atlas-surface-2:#F4F2EE;
  --atlas-border:#E9E6E0;
  --atlas-border-soft:#F0EDE7;
  --text-1:#0E0E10;
  --text-2:#5F5A52;
  --text-3:#8C8579;

  /* Le canevas du graphe suit exactement le fond papier Starium */
  --canvas-bg:#FAF9F7;
  --canvas-grid:#F4F2EE;

  --font-sans:'Manrope',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --radius-sm:6px; --radius-md:10px; --radius-lg:14px; --radius-xl:20px; --radius-pill:999px;
  --shadow-2:0 2px 8px rgba(14,14,16,.10),0 1px 2px rgba(14,14,16,.06);
  --shadow-3:0 10px 30px rgba(14,14,16,.14),0 2px 8px rgba(14,14,16,.08);
  --shadow-4:0 26px 70px rgba(14,14,16,.22),0 8px 20px rgba(14,14,16,.12);
  --ease:cubic-bezier(.2,0,0,1);
}

html,body{height:100%;background:var(--atlas-bg);color:var(--text-1);font-family:var(--font-sans);overflow:hidden}
#canvas-wrap{background:var(--canvas-bg)}
button,input,select,textarea{font-family:inherit;color:inherit}
::selection{background:var(--gold-100);color:#14171C}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}

#app{position:relative;width:100vw;height:100vh;overflow:hidden}

/* ───────── canvas ───────── */
#canvas-wrap{position:absolute;inset:0}
#canvas-wrap svg{width:100%;height:100%;display:block;cursor:grab}
#canvas-wrap svg.panning{cursor:grabbing}
.node{cursor:pointer}
.node-halo{opacity:0;transition:opacity .18s var(--ease)}
.node.selected .node-halo{opacity:1}
.node-circle{stroke-width:2;transition:opacity .18s var(--ease),filter .18s var(--ease)}
.node-icon{pointer-events:none}
.node-label{font:700 12.5px var(--font-sans);fill:var(--text-1);pointer-events:none;transition:opacity .18s var(--ease)}
.node-sublabel{font:600 9.5px var(--font-sans);fill:var(--text-3);pointer-events:none;transition:opacity .18s var(--ease)}
.edge{fill:none;transition:opacity .18s var(--ease),stroke-width .18s var(--ease)}
.edge-hit{fill:none;stroke:transparent;stroke-width:14;cursor:pointer}
.dim{opacity:.1 !important}
.dim-mid{opacity:.28 !important}
.badge-dot{transition:opacity .18s var(--ease)}

/* ───────── topbar ───────── */
.topbar{position:absolute;top:18px;left:18px;right:18px;z-index:40;display:flex;flex-wrap:wrap;row-gap:10px;align-items:center;gap:10px;pointer-events:none}
.topbar>*{pointer-events:auto}
.tb-brand{display:flex;align-items:center;gap:9px;background:var(--atlas-surface);border:1px solid var(--atlas-border);border-radius:var(--radius-md);padding:9px 14px 9px 10px;box-shadow:var(--shadow-2)}
.tb-brand img{width:22px;height:22px;display:block}
.tb-brand-name{font-size:14px;font-weight:800;letter-spacing:-.01em}
.tb-brand-tag{font-size:9.5px;color:var(--text-3);font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-top:1px}
.tb-back{width:34px;height:34px;border-radius:var(--radius-md);border:1px solid var(--atlas-border);background:var(--atlas-surface);color:var(--text-2);display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:var(--shadow-2);text-decoration:none}
.tb-back:hover{color:var(--text-1);background:var(--atlas-surface-2)}
.tb-back svg{width:17px;height:17px}

.tb-search{flex:1;max-width:420px;display:flex;align-items:center;gap:9px;background:var(--atlas-surface);border:1px solid var(--atlas-border);border-radius:var(--radius-md);padding:0 13px;height:38px;box-shadow:var(--shadow-2)}
.tb-search svg{width:15px;height:15px;color:var(--text-3);flex-shrink:0}
.tb-search input{flex:1;background:none;border:none;outline:none;font-size:13px;color:var(--text-1)}
.tb-search input::placeholder{color:var(--text-3)}
.tb-search-results{position:absolute;top:44px;left:0;width:100%;background:var(--atlas-surface);border:1px solid var(--atlas-border);border-radius:var(--radius-md);box-shadow:var(--shadow-3);max-height:280px;overflow-y:auto;display:none}
.tb-search-results.open{display:block}
.tb-search-row{display:flex;align-items:center;gap:10px;padding:9px 12px;cursor:pointer;font-size:12.5px;font-weight:600}
.tb-search-row:hover{background:var(--atlas-surface-2)}
.tb-search-row i{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.tb-search-wrap{position:relative;flex:1 1 220px;min-width:180px;max-width:420px}
.tb-search-wrap .tb-search{max-width:none}

.tb-presets{display:flex;align-items:center;gap:2px;background:var(--atlas-surface);border:1px solid var(--atlas-border);border-radius:var(--radius-md);padding:3px;box-shadow:var(--shadow-2);overflow-x:auto;max-width:100%;flex-shrink:1}
.tb-preset-btn{padding:7px 12px;border-radius:7px;border:none;background:none;color:var(--text-2);font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap}
.tb-preset-btn:hover{color:var(--text-1)}
.tb-preset-btn.active{background:var(--gold);color:#1A1300}

.tb-right{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-left:auto;row-gap:10px}
.tb-btn{height:38px;padding:0 14px;display:flex;align-items:center;gap:7px;border-radius:var(--radius-md);border:1px solid var(--atlas-border);background:var(--atlas-surface);color:var(--text-2);font-size:12.5px;font-weight:700;cursor:pointer;box-shadow:var(--shadow-2);white-space:nowrap}
.tb-btn:hover{color:var(--text-1);background:var(--atlas-surface-2)}
.tb-btn svg{width:15px;height:15px}
.tb-btn.on{color:var(--gold);border-color:rgba(232,163,23,.4);background:rgba(232,163,23,.1)}
.tb-btn.gold{background:var(--gold);color:#1A1300;border-color:var(--gold)}
.tb-btn.gold:hover{background:var(--gold-600)}
.tb-icon-btn{width:38px;height:38px;flex:none;padding:0;justify-content:center}
.tb-badge-count{background:var(--gold);color:#1A1300;font-size:9.5px;font-weight:800;border-radius:999px;padding:0 5px;min-width:15px;text-align:center;line-height:15px}

/* dropdown menu (create) */
.dropmenu{position:absolute;top:44px;right:0;background:var(--atlas-surface);border:1px solid var(--atlas-border);border-radius:var(--radius-md);box-shadow:var(--shadow-3);min-width:200px;padding:6px;display:none;z-index:60}
.dropmenu.open{display:block}
.dropmenu button{width:100%;display:flex;align-items:center;gap:9px;padding:9px 10px;border:none;background:none;color:var(--text-1);font-size:12.5px;font-weight:600;border-radius:7px;cursor:pointer;text-align:left}
.dropmenu button:hover{background:var(--atlas-surface-2)}
.dropmenu button svg{width:15px;height:15px;color:var(--gold)}
.tb-createwrap{position:relative}

/* ───────── zoom controls ───────── */
.zoom-controls{position:absolute;bottom:22px;left:18px;z-index:35;display:flex;flex-direction:column;background:var(--atlas-surface);border:1px solid var(--atlas-border);border-radius:var(--radius-md);box-shadow:var(--shadow-2);overflow:hidden}
.zoom-controls button{width:38px;height:38px;border:none;background:none;color:var(--text-2);display:flex;align-items:center;justify-content:center;cursor:pointer;border-bottom:1px solid var(--atlas-border)}
.zoom-controls button:last-child{border-bottom:none}
.zoom-controls button:hover{background:var(--atlas-surface-2);color:var(--text-1)}
.zoom-controls svg{width:16px;height:16px}

/* legend */
.legend{position:absolute;bottom:22px;right:18px;z-index:35;background:var(--atlas-surface);border:1px solid var(--atlas-border);border-radius:var(--radius-md);box-shadow:var(--shadow-2);padding:12px 14px;font-size:11px;color:var(--text-2);display:flex;gap:16px}
.legend-col{display:flex;flex-direction:column;gap:6px}
.legend-item{display:flex;align-items:center;gap:7px;white-space:nowrap}
.legend-item i{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.legend-item .ln{width:16px;height:0;border-top:2px solid;flex-shrink:0}
.legend-item .ln.dashed{border-top-style:dashed;border-top-width:2.5px}

/* ───────── left drawer (filtres/calques) ───────── */
.drawer-left{position:absolute;top:70px;left:18px;bottom:90px;width:280px;background:var(--atlas-surface);border:1px solid var(--atlas-border);border-radius:var(--radius-lg);box-shadow:var(--shadow-3);z-index:38;display:flex;flex-direction:column;transform:translateX(-330px);opacity:0;transition:all .22s var(--ease);pointer-events:none}
.drawer-left.open{transform:translateX(0);opacity:1;pointer-events:auto}
.dl-tabs{display:flex;border-bottom:1px solid var(--atlas-border);flex-shrink:0}
.dl-tab{flex:1;padding:13px 8px;text-align:center;font-size:12px;font-weight:700;color:var(--text-3);cursor:pointer;border-bottom:2px solid transparent}
.dl-tab.active{color:var(--text-1);border-color:var(--gold)}
.dl-body{flex:1;overflow-y:auto;padding:14px}
.dl-pane{display:none}
.dl-pane.active{display:block}
.dl-group{margin-bottom:18px}
.dl-group:last-child{margin-bottom:4px}
.dl-group-title{font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--text-3);margin-bottom:9px;display:flex;align-items:center;justify-content:space-between}
.dl-group-title button{background:none;border:none;color:var(--gold);font-size:10px;font-weight:700;cursor:pointer;text-transform:none;letter-spacing:0}
.chk-row{display:flex;align-items:center;gap:9px;padding:6px 2px;cursor:pointer;font-size:12.5px;font-weight:600;color:var(--text-2)}
.chk-row:hover{color:var(--text-1)}
.chk-row input{width:15px;height:15px;accent-color:var(--gold);cursor:pointer}
.chk-row i{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.chk-row .cnt{margin-left:auto;font-size:10.5px;color:var(--text-3);font-weight:700}
.dl-select{width:100%;height:34px;background:var(--atlas-surface-2);border:1px solid var(--atlas-border);border-radius:8px;padding:0 10px;font-size:12.5px;color:var(--text-1)}

/* ───────── right drawer (detail) ───────── */
.drawer-right{position:absolute;top:0;right:0;bottom:0;width:380px;background:var(--atlas-surface);border-left:1px solid var(--atlas-border);box-shadow:var(--shadow-4);z-index:50;display:flex;flex-direction:column;transform:translateX(400px);transition:transform .24s var(--ease);}
.drawer-right.open{transform:translateX(0)}
.dr-head{padding:20px 20px 16px;border-bottom:1px solid var(--atlas-border);flex-shrink:0;position:relative}
.dr-close{position:absolute;top:16px;right:16px;width:28px;height:28px;border-radius:8px;border:none;background:var(--atlas-surface-2);color:var(--text-2);display:flex;align-items:center;justify-content:center;cursor:pointer}
.dr-close:hover{color:var(--text-1)}
.dr-close svg{width:14px;height:14px}
.dr-type-row{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.dr-type-pill{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;padding:3px 9px;border-radius:999px}
.dr-crit-pill{font-size:10px;font-weight:800;padding:3px 9px;border-radius:999px}
.dr-title{font-size:19px;font-weight:800;letter-spacing:-.01em;line-height:1.2;padding-right:26px}
.dr-desc{font-size:12.5px;color:var(--text-2);margin-top:6px;line-height:1.5}
.dr-badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.dr-badge{display:flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;padding:4px 9px;border-radius:999px}
.dr-badge svg{width:11px;height:11px}
.dr-body{flex:1;overflow-y:auto;padding:18px 20px 30px}
.dr-sec{margin-bottom:22px}
.dr-sec:last-child{margin-bottom:0}
.dr-sec-h{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--text-3);margin-bottom:11px}
.dr-sec-h svg{width:13px;height:13px}
.dr-kv{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;font-size:12.5px}
.dr-kv dt{color:var(--text-3);font-weight:600}
.dr-kv dd{color:var(--text-1);font-weight:700;text-align:right}
.dr-complete-bar{height:6px;border-radius:999px;background:var(--atlas-surface-2);overflow:hidden;margin-top:4px}
.dr-complete-fill{height:100%;border-radius:999px;background:var(--gold)}
.dr-rel-row{display:flex;align-items:center;gap:9px;padding:9px 0;border-bottom:1px solid var(--atlas-border-soft);cursor:pointer}
.dr-rel-row:last-child{border-bottom:none}
.dr-rel-row:hover .dr-rel-name{color:var(--gold)}
.dr-rel-ico{width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.dr-rel-ico svg{width:13px;height:13px}
.dr-rel-name{font-size:12.5px;font-weight:700;transition:color .12s}
.dr-rel-meta{font-size:10.5px;color:var(--text-3);margin-top:1px}
.dr-rel-dir{margin-left:auto;font-size:9px;color:var(--text-3);text-transform:uppercase;font-weight:800;letter-spacing:.03em}
.dr-card{background:var(--atlas-surface-2);border:1px solid var(--atlas-border);border-radius:10px;padding:12px 13px;margin-bottom:9px}
.dr-card:last-child{margin-bottom:0}
.dr-card-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:5px}
.dr-card-title{font-size:12.5px;font-weight:700}
.dr-pill-sm{font-size:9.5px;font-weight:800;padding:2px 8px;border-radius:999px;white-space:nowrap}
.dr-card-meta{font-size:11px;color:var(--text-3);display:flex;gap:10px;flex-wrap:wrap}
.dr-empty{font-size:12px;color:var(--text-3);font-style:italic}
.dr-impact-btn{width:100%;height:42px;border-radius:10px;border:none;background:var(--gold);color:#1A1300;font-size:13px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;margin-top:6px}
.dr-impact-btn:hover{background:var(--gold-600)}
.dr-impact-btn svg{width:15px;height:15px}

/* ═══ FICHE OBJET (plein écran, multi-onglets) ═══ */
.fiche-overlay{position:fixed;inset:0;background:var(--atlas-bg);z-index:220;display:none;flex-direction:column}
.fiche-overlay.open{display:flex}
.fiche-head{background:#14171C;color:#fff;padding:18px 26px;display:flex;align-items:center;gap:14px;flex-shrink:0}
.fiche-head-ico{width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.fiche-head-ico svg{width:17px;height:17px}
.fiche-head-tt{flex:1;min-width:0}
.fiche-head-title{font-size:16.5px;font-weight:800;letter-spacing:-.01em}
.fiche-head-sub{font-size:11.5px;color:#B7BCC6;margin-top:1px}
.fiche-head-crit{font-size:10px;font-weight:800;padding:4px 10px;border-radius:999px;text-transform:uppercase;letter-spacing:.03em}
.fiche-close{width:34px;height:34px;border-radius:9px;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.06);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
.fiche-close:hover{background:rgba(255,255,255,.14)}
.fiche-close svg{width:16px;height:16px}
.fiche-tabs{display:flex;gap:2px;background:var(--atlas-surface);border-bottom:1px solid var(--atlas-border);padding:0 22px;flex-shrink:0;overflow-x:auto}
.fiche-tab{padding:13px 14px;font-size:12.5px;font-weight:700;color:var(--text-3);border:none;background:none;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;display:flex;align-items:center;gap:7px}
.fiche-tab svg{width:14px;height:14px}
.fiche-tab.active{color:var(--text-1);border-color:var(--gold)}
.fiche-tab .fiche-tab-count{background:var(--atlas-surface-2);color:var(--text-2);font-size:9.5px;font-weight:800;padding:1px 6px;border-radius:999px}
.fiche-body{flex:1;overflow-y:auto;padding:26px 32px 60px}
.fiche-maxw{max-width:1100px;margin:0 auto}
.fiche-grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:20px}
.fiche-card{background:var(--atlas-surface);border:1px solid var(--atlas-border);border-radius:var(--radius-lg);padding:20px 22px;margin-bottom:18px}
.fiche-card-h{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--text-3);margin-bottom:14px;display:flex;align-items:center;gap:8px}
.fiche-card-h svg{width:13px;height:13px}
.fiche-field-label{font-size:11.5px;font-weight:700;color:var(--text-2);margin-bottom:6px;display:block}
.fiche-field-val{width:100%;min-height:38px;background:var(--atlas-surface-2);border:1px solid var(--atlas-border);border-radius:9px;padding:9px 12px;font-size:13px;color:var(--text-1);margin-bottom:14px}
.fiche-field-val.area{min-height:76px;line-height:1.5}
.fiche-field-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.fiche-complete-bar{height:6px;border-radius:999px;background:var(--atlas-surface-2);overflow:hidden;margin-top:4px}
.fiche-complete-fill{height:100%;border-radius:999px;background:var(--gold)}
.fiche-empty{font-size:12.5px;color:var(--text-3);font-style:italic;padding:6px 0}

/* impact mode banner */
.impact-bar{position:absolute;top:70px;left:50%;transform:translateX(-50%);z-index:39;background:var(--atlas-surface);border:1px solid rgba(232,163,23,.5);border-radius:var(--radius-md);box-shadow:var(--shadow-3);padding:10px 14px;display:none;align-items:center;gap:14px}
.impact-bar.open{display:flex}
.impact-bar-label{font-size:12px;font-weight:700;color:var(--text-2)}
.impact-bar-label b{color:var(--gold)}
.depth-seg{display:flex;background:var(--atlas-surface-2);border-radius:8px;padding:2px}
.depth-seg button{padding:6px 12px;border:none;background:none;color:var(--text-2);font-size:11.5px;font-weight:700;border-radius:6px;cursor:pointer}
.depth-seg button.active{background:var(--gold);color:#1A1300}
.impact-exit{background:none;border:none;color:var(--text-2);font-size:11.5px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:5px}
.impact-exit:hover{color:var(--text-1)}
.impact-exit svg{width:13px;height:13px}

/* ───────── dashboard view ───────── */
#dashboard{position:absolute;inset:0;background:var(--atlas-bg);z-index:20;overflow-y:auto;display:none;padding:90px 40px 60px}
#dashboard.open{display:block}
.db-maxw{max-width:1440px;margin:0 auto}
.db-head{margin-bottom:26px}
.db-h1{font-size:26px;font-weight:800;letter-spacing:-.02em}
.db-sub{font-size:13px;color:var(--text-2);margin-top:4px}
.db-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:28px}
.db-kpi{background:var(--atlas-surface);border:1px solid var(--atlas-border);border-radius:var(--radius-lg);padding:16px 18px}
.db-kpi-label{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--text-3);margin-bottom:8px}
.db-kpi-val{font-size:26px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.db-kpi-sub{font-size:11px;color:var(--text-3);margin-top:4px;font-weight:600}
.db-grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.db-block{background:var(--atlas-surface);border:1px solid var(--atlas-border);border-radius:var(--radius-lg);padding:18px 20px}
.db-block-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.db-block-title{font-size:14px;font-weight:800}
.db-block-count{font-size:10.5px;font-weight:800;background:var(--atlas-surface-2);color:var(--text-2);padding:3px 9px;border-radius:999px}
.db-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--atlas-border-soft);font-size:12.5px}
.db-row:last-child{border-bottom:none}
.db-row-ico{width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.db-row-ico svg{width:13px;height:13px}
.db-row-name{font-weight:700;flex:1}
.db-row-meta{color:var(--text-3);font-size:11px}
.db-row-pill{font-size:9.5px;font-weight:800;padding:3px 8px;border-radius:999px;white-space:nowrap}
.db-empty-row{color:var(--text-3);font-size:12px;font-style:italic;padding:8px 0}

/* ───────── modals ───────── */
.modal-overlay{position:fixed;inset:0;background:rgba(10,11,14,.6);backdrop-filter:blur(8px);z-index:200;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .18s var(--ease)}
.modal-overlay.open{opacity:1;pointer-events:auto}
.modal{width:520px;max-height:86vh;background:var(--atlas-surface);border:1px solid var(--atlas-border);border-radius:var(--radius-xl);box-shadow:var(--shadow-4);display:flex;flex-direction:column;transform:translateY(14px) scale(.98);transition:transform .18s var(--ease)}
.modal-overlay.open .modal{transform:none}
.modal-head{padding:20px 22px;border-bottom:1px solid var(--atlas-border);display:flex;align-items:center;gap:12px;flex-shrink:0}
.modal-head-ico{width:38px;height:38px;border-radius:10px;background:var(--gold-050);color:var(--gold-600);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.modal-head-ico svg{width:18px;height:18px}
.modal-title{font-size:15.5px;font-weight:800}
.modal-sub{font-size:11.5px;color:var(--text-3);margin-top:1px}
.modal-close{margin-left:auto;width:30px;height:30px;border-radius:8px;border:none;background:var(--atlas-surface-2);color:var(--text-2);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
.modal-close svg{width:14px;height:14px}
.modal-body{flex:1;overflow-y:auto;padding:20px 22px}
.modal-foot{padding:16px 22px;border-top:1px solid var(--atlas-border);display:flex;gap:10px;justify-content:flex-end;flex-shrink:0}
.field{margin-bottom:15px}
.field:last-child{margin-bottom:0}
.field-label{font-size:11.5px;font-weight:700;color:var(--text-2);margin-bottom:6px;display:block}
.field-label .req{color:var(--danger)}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.inp,.sel,textarea.inp{width:100%;height:38px;background:var(--atlas-surface-2);border:1px solid var(--atlas-border);border-radius:9px;padding:0 12px;font-size:13px;color:var(--text-1)}
.inp:focus,.sel:focus{outline:none;border-color:var(--gold)}
textarea.inp{height:74px;padding:10px 12px;resize:vertical;font-family:inherit}
.type-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.type-opt{padding:10px 8px;border:1.5px solid var(--atlas-border);border-radius:9px;background:var(--atlas-surface-2);cursor:pointer;text-align:center;font-size:11.5px;font-weight:700;color:var(--text-2)}
.type-opt.sel{border-color:var(--gold);color:var(--gold);background:rgba(232,163,23,.08)}
.btn{height:38px;padding:0 16px;border-radius:9px;border:1px solid var(--atlas-border);background:var(--atlas-surface-2);color:var(--text-1);font-size:13px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:7px}
.btn:hover{background:#2A303C}
.btn-primary{background:var(--gold);color:#1A1300;border-color:var(--gold)}
.btn-primary:hover{background:var(--gold-600)}
.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:2px 0}
.toggle{width:38px;height:22px;border-radius:999px;background:var(--atlas-border);position:relative;cursor:pointer;flex-shrink:0}
.toggle.on{background:var(--gold)}
.toggle i{position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .15s var(--ease)}
.toggle.on i{left:18px}

/* toast */
#toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--atlas-surface);border:1px solid var(--atlas-border);color:var(--text-1);padding:12px 18px;border-radius:10px;font-size:12.5px;font-weight:700;box-shadow:var(--shadow-3);opacity:0;pointer-events:none;transition:all .22s var(--ease);z-index:300}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* watermark */
.watermark{position:absolute;top:-60px;right:-60px;width:520px;height:520px;opacity:.05;pointer-events:none;z-index:1}

/* scrollbars */
.dl-body::-webkit-scrollbar,.dr-body::-webkit-scrollbar,.modal-body::-webkit-scrollbar,#dashboard::-webkit-scrollbar{width:8px}
.dl-body::-webkit-scrollbar-thumb,.dr-body::-webkit-scrollbar-thumb,.modal-body::-webkit-scrollbar-thumb,#dashboard::-webkit-scrollbar-thumb{background:var(--atlas-border);border-radius:999px}
</style>
</head>
<body>
<div id="app">

  <img class="watermark" src="../../assets/icon-starium.png" alt="">

  <div id="canvas-wrap"></div>

  <!-- ═══ TOPBAR ═══ -->
  <div class="topbar">
    <button class="tb-back" onclick="atGoBack()" title="Retour à Starium"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg></button>
    <div class="tb-brand">
      <img src="../../assets/icon-starium.png" alt="">
      <div><div class="tb-brand-name">Starium Atlas</div><div class="tb-brand-tag">Cartographie dynamique</div></div>
    </div>

    <div class="tb-search-wrap">
      <div class="tb-search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input id="atlas-search" placeholder="Rechercher un objet…" oninput="atSearch(this.value)" onfocus="atSearch(this.value)">
      </div>
      <div class="tb-search-results" id="search-results"></div>
    </div>

    <div class="tb-presets" id="preset-bar"></div>

    <div class="tb-right">
      <button class="tb-btn" id="btn-filters" onclick="atToggleDrawer('filtres')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>Filtres<span class="tb-badge-count" id="filter-count" style="display:none">0</span></button>
      <button class="tb-btn" id="btn-layers" onclick="atToggleDrawer('calques')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg>Calques</button>
      <button class="tb-btn" id="btn-dashboard" onclick="atShowDashboard()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>Dashboard</button>
      <button class="tb-btn" id="btn-fullscreen" onclick="atToggleFullscreen()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg><span id="fullscreen-label">Plein écran</span></button>
      <div class="tb-createwrap">
        <button class="tb-btn gold" onclick="atToggleMenu(event)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>Créer</button>
        <div class="dropmenu" id="create-menu">
          <button onclick="omOpen()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg>Nouvel objet</button>
          <button onclick="fmOpen()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><line x1="17" y1="7" x2="7" y2="17"/><polyline points="8 7 17 7 17 16"/></svg>Nouveau flux</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ═══ IMPACT BAR ═══ -->
  <div class="impact-bar" id="impact-bar">
    <div class="impact-bar-label">Analyse d'impact — <b id="impact-obj-name">—</b></div>
    <div class="depth-seg" id="depth-seg">
      <button data-d="1" onclick="atSetDepth(1)">Profondeur 1</button>
      <button data-d="2" onclick="atSetDepth(2)">Profondeur 2</button>
      <button data-d="3" onclick="atSetDepth(3)">Profondeur 3</button>
    </div>
    <button class="impact-exit" onclick="atExitImpact()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>Quitter l'analyse</button>
  </div>

  <!-- ═══ ZOOM CONTROLS ═══ -->
  <div class="zoom-controls">
    <button onclick="atZoom(1.25)" title="Zoomer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></svg></button>
    <button onclick="atZoom(0.8)" title="Dézoomer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><line x1="8" y1="11" x2="14" y2="11"/></svg></button>
    <button onclick="atRecenter()" title="Recentrer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg></button>
    <button onclick="atToggleFullscreen()" title="Plein écran"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg></button>
  </div>

  <!-- ═══ LEGEND ═══ -->
  <div class="legend" id="legend"></div>

  <!-- ═══ LEFT DRAWER : filtres / calques ═══ -->
  <div class="drawer-left" id="drawer-left">
    <div class="dl-tabs">
      <div class="dl-tab active" data-tab="calques" onclick="atDrawerTab('calques')">Calques</div>
      <div class="dl-tab" data-tab="filtres" onclick="atDrawerTab('filtres')">Filtres</div>
    </div>
    <div class="dl-body">
      <div class="dl-pane" id="pane-calques"></div>
      <div class="dl-pane" id="pane-filtres"></div>
    </div>
  </div>

  <!-- ═══ RIGHT DRAWER : détail objet (analyse d'impact) ═══ -->
  <div class="drawer-right" id="drawer-right">
    <div class="dr-head" id="dr-head"></div>
    <div class="dr-body" id="dr-body"></div>
  </div>

  <!-- ═══ FICHE OBJET (plein écran, multi-onglets) ═══ -->
  <div class="fiche-overlay" id="fiche-overlay">
    <div class="fiche-head">
      <div class="fiche-head-ico" id="fiche-head-ico"></div>
      <div class="fiche-head-tt">
        <div class="fiche-head-title" id="fiche-title">—</div>
        <div class="fiche-head-sub" id="fiche-sub">—</div>
      </div>
      <span class="fiche-head-crit" id="fiche-crit"></span>
      <button class="fiche-close" onclick="ficheClose()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
    <div class="fiche-tabs" id="fiche-tabs"></div>
    <div class="fiche-body"><div class="fiche-maxw" id="fiche-body"></div></div>
  </div>

  <!-- ═══ DASHBOARD ═══ -->
  <div id="dashboard"></div>

  <!-- ═══ MODAL : NOUVEL OBJET ═══ -->
  <div class="modal-overlay" id="om-overlay" onclick="if(event.target===this)omClose()">
    <div class="modal">
      <div class="modal-head">
        <div class="modal-head-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg></div>
        <div><div class="modal-title">Nouvel objet</div><div class="modal-sub">Ajouter un objet à la cartographie</div></div>
        <button class="modal-close" onclick="omClose()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
      </div>
      <div class="modal-body">
        <div class="field">
          <label class="field-label">Type d'objet <span class="req">*</span></label>
          <div class="type-grid" id="om-types"></div>
        </div>
        <div class="field"><label class="field-label">Nom <span class="req">*</span></label><input class="inp" id="om-name" placeholder="Ex : Outil de signature électronique"></div>
        <div class="field"><label class="field-label">Description</label><textarea class="inp" id="om-desc" placeholder="Rôle et périmètre de l'objet…"></textarea></div>
        <div class="field-row">
          <div class="field"><label class="field-label">Propriétaire métier</label><input class="inp" id="om-ownerb" placeholder="Ex : Direction Juridique"></div>
          <div class="field"><label class="field-label">Propriétaire technique</label><input class="inp" id="om-ownert" placeholder="Ex : DSI"></div>
        </div>
        <div class="field">
          <label class="field-label">Criticité <span class="req">*</span></label>
          <div class="type-grid" id="om-crit"></div>
        </div>
      </div>
      <div class="modal-foot">
        <button class="btn" onclick="omClose()">Annuler</button>
        <button class="btn btn-primary" onclick="omSave()">Créer l'objet</button>
      </div>
    </div>
  </div>

  <!-- ═══ MODAL : NOUVEAU FLUX ═══ -->
  <div class="modal-overlay" id="fm-overlay" onclick="if(event.target===this)fmClose()">
    <div class="modal">
      <div class="modal-head">
        <div class="modal-head-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><line x1="17" y1="7" x2="7" y2="17"/><polyline points="8 7 17 7 17 16"/></svg></div>
        <div><div class="modal-title">Nouveau flux</div><div class="modal-sub">Relier deux objets de la cartographie</div></div>
        <button class="modal-close" onclick="fmClose()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
      </div>
      <div class="modal-body">
        <div class="field-row">
          <div class="field"><label class="field-label">Source <span class="req">*</span></label><select class="sel" id="fm-source"></select></div>
          <div class="field"><label class="field-label">Cible <span class="req">*</span></label><select class="sel" id="fm-target"></select></div>
        </div>
        <div class="field-row">
          <div class="field"><label class="field-label">Type de flux <span class="req">*</span></label>
            <select class="sel" id="fm-flowtype">
              <option value="applicatif">Applicatif</option>
              <option value="metier">Métier</option>
              <option value="technique">Technique</option>
              <option value="fournisseur">Fournisseur</option>
            </select>
          </div>
          <div class="field"><label class="field-label">Mode d'échange <span class="req">*</span></label>
            <select class="sel" id="fm-mode">
              <option>API</option><option>SFTP</option><option>EDI</option><option>Fichier plat</option><option>Email</option><option>Saisie manuelle</option><option>Batch</option>
            </select>
          </div>
        </div>
        <div class="field-row">
          <div class="field"><label class="field-label">Fréquence</label><input class="inp" id="fm-freq" placeholder="Ex : Temps réel, quotidien…"></div>
          <div class="field"><label class="field-label">Sens</label>
            <select class="sel" id="fm-dir"><option value="uni">Unidirectionnel</option><option value="bi">Bidirectionnel</option></select>
          </div>
        </div>
        <div class="field">
          <label class="field-label">Criticité du flux</label>
          <div class="type-grid" id="fm-crit"></div>
        </div>
        <div class="field toggle-row"><span class="field-label" style="margin:0">Flux sécurisé</span><div class="toggle on" id="fm-secure" onclick="this.classList.toggle('on')"><i></i></div></div>
        <div class="field toggle-row"><span class="field-label" style="margin:0">Flux manuel (non automatisé)</span><div class="toggle" id="fm-manual" onclick="this.classList.toggle('on')"><i></i></div></div>
      </div>
      <div class="modal-foot">
        <button class="btn" onclick="fmClose()">Annuler</button>
        <button class="btn btn-primary" onclick="fmSave()">Créer le flux</button>
      </div>
    </div>
  </div>

  <div id="toast"></div>
</div>

<script src="atlas-data.js"></script>
<script src="atlas-engine.js"></script>
<script src="atlas-dashboard.js"></script>
<script src="atlas-modals.js"></script>
</body>
</html>
