<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Starium · Vision stratégique — Impression</title>
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="themes.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="../../assets/icon-starium.png">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<style>
  /* ===== Print-specific overrides ===== */
  @page { size: A4 landscape; margin: 1cm 1.2cm; }

  * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }

  @media print {
    /* Suppress browser chrome artifacts */
    body { background: #FAF9F7 !important; }

    /* Kill all sticky/fixed positioning */
    .topbar { position: static !important; box-shadow: none !important; }
    .sidebar { position: static !important; height: auto !important; max-height: none !important; overflow: visible !important; }

    /* Remove sidebar scroll, let it flow */
    .sidebar-nav { overflow: visible !important; }

    /* App layout: keep side-by-side but limit sidebar */
    .app { min-height: unset !important; }

    /* KPI grid: 4-up in print */
    .kpi-grid { grid-template-columns: repeat(4, 1fr) !important; }

    /* Main grid: keep 2-col */
    .main-grid { grid-template-columns: 2fr 1fr !important; }

    /* Prevent cards splitting */
    .card, .kpi, .axis, .vision, .doc, .alert { break-inside: avoid !important; }

    /* Axes grid: 4-up */
    .axes-grid { grid-template-columns: repeat(4, 1fr) !important; }

    /* Tabs: show all inline, no border, smaller */
    .tabs { flex-wrap: wrap !important; gap: 4px !important; margin-bottom: 12px !important; }
    .tab { padding: 4px 8px !important; font-size: 11px !important; }

    /* Reduce topbar height */
    .topbar { height: auto !important; padding: 8px 16px !important; }

    /* Smaller page padding */
    .page { padding: 12px 16px 24px !important; }

    /* Hide interactive-only elements */
    .kbd, .icon-btn .badge-num, .sidebar-footer { display: none !important; }

    /* Buttons: no borders, lighter */
    .btn { border: 1px solid var(--border-subtle) !important; }

    /* Reduce font sizes slightly for dense layout */
    .kpi-value { font-size: 28px !important; }
    .page-title { font-size: 24px !important; }

    /* Sparklines stay visible */
    .kpi-spark { display: block !important; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script>
  /* Apply theme before React renders */
  (function () {
    function apply() {
      const app = document.querySelector('.app');
      if (app) {
        app.setAttribute('data-theme', 'B');
        app.setAttribute('data-menu', 'light');
        app.setAttribute('data-font', 'F2');
      }
    }
    const obs = new MutationObserver(() => {
      if (document.querySelector('.app')) { apply(); obs.disconnect(); }
    });
    obs.observe(document.getElementById('root'), { childList: true, subtree: true });
  })();
</script>

<script type="text/babel" src="Icons.jsx"></script>
<script type="text/babel" src="Sidebar-standalone.jsx"></script>
<script type="text/babel" src="TopBar.jsx"></script>
<script type="text/babel" src="KpiCard.jsx"></script>
<script type="text/babel" src="VisionCard.jsx"></script>
<script type="text/babel" src="AxisCard.jsx"></script>
<script type="text/babel" src="ObjectivesTable.jsx"></script>
<script type="text/babel" src="AlertsList.jsx"></script>
<script type="text/babel" src="AlignmentChart.jsx"></script>
<script type="text/babel" src="DocumentsList.jsx"></script>
<script type="text/babel" src="App.jsx"></script>

<!-- Auto-print: runs last after all Babel JSX is parsed and React has rendered -->
<script type="text/babel">
  // Wait for fonts + React paint, then print
  document.fonts.ready.then(() => {
    setTimeout(() => { window.print(); }, 600);
  });
</script>
</body>
</html>
