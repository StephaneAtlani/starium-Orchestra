<!doctype html>
<!-- @dsCard group="Brand" name="Couleurs · neutres" subtitle="Échelle de neutres papier (warm), 0→900" viewport="700x200" -->
<html><head><meta charset="utf-8"><title>Colors · Neutrals</title>
<link rel="stylesheet" href="_card.css"></head>
<body>
<div class="card-frame">
  <div style="display:grid;grid-template-columns:repeat(10,1fr);gap:6px;">
    <div><div style="height:80px;background:var(--neutral-0);border:1px solid var(--border-subtle);border-radius:8px;"></div><div class="mono tabular" style="font:var(--text-mono);font-size:10px;color:var(--fg-3);margin-top:6px;">0</div></div>
    <div><div style="height:80px;background:var(--neutral-50);border-radius:8px;"></div><div class="mono tabular" style="font:var(--text-mono);font-size:10px;color:var(--fg-3);margin-top:6px;">50</div></div>
    <div><div style="height:80px;background:var(--neutral-100);border-radius:8px;"></div><div class="mono tabular" style="font:var(--text-mono);font-size:10px;color:var(--fg-3);margin-top:6px;">100</div></div>
    <div><div style="height:80px;background:var(--neutral-200);border-radius:8px;"></div><div class="mono tabular" style="font:var(--text-mono);font-size:10px;color:var(--fg-3);margin-top:6px;">200</div></div>
    <div><div style="height:80px;background:var(--neutral-300);border-radius:8px;"></div><div class="mono tabular" style="font:var(--text-mono);font-size:10px;color:var(--fg-3);margin-top:6px;">300</div></div>
    <div><div style="height:80px;background:var(--neutral-400);border-radius:8px;"></div><div class="mono tabular" style="font:var(--text-mono);font-size:10px;color:var(--fg-3);margin-top:6px;">400</div></div>
    <div><div style="height:80px;background:var(--neutral-500);border-radius:8px;"></div><div class="mono tabular" style="font:var(--text-mono);font-size:10px;color:#fff;margin-top:6px;">500</div></div>
    <div><div style="height:80px;background:var(--neutral-600);border-radius:8px;"></div><div class="mono tabular" style="font:var(--text-mono);font-size:10px;color:var(--fg-3);margin-top:6px;">600</div></div>
    <div><div style="height:80px;background:var(--neutral-700);border-radius:8px;"></div><div class="mono tabular" style="font:var(--text-mono);font-size:10px;color:var(--fg-3);margin-top:6px;">700</div></div>
    <div><div style="height:80px;background:var(--neutral-900);border-radius:8px;"></div><div class="mono tabular" style="font:var(--text-mono);font-size:10px;color:var(--fg-3);margin-top:6px;">900</div></div>
  </div>
  <div style="margin-top:14px;font:var(--text-body-s);color:var(--fg-3);">Neutres papier — chauds, jamais bleutés. Le fond d'app est <span class="mono">--neutral-50</span> (#FAF9F7).</div>
</div>
</body></html>
