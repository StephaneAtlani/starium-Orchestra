<!doctype html>
<!-- @dsCard group="Brand" name="Logo · marque" subtitle="Logo horizontal sur surface claire et fond ink" viewport="700x220" -->
<html><head><meta charset="utf-8"><title>Brand · Logo</title>
<link rel="stylesheet" href="_card.css"></head>
<body>
<div class="card-frame">
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:center;">
    <div style="background:var(--bg-surface);border:1px solid var(--border-subtle);border-radius:14px;padding:32px;display:flex;align-items:center;justify-content:center;height:140px;">
      <img src="../assets/logo-horizontal.png" alt="Starium horizontal" style="max-height:64px;max-width:100%;display:block;">
    </div>
    <div style="background:var(--brand-ink);border-radius:14px;padding:32px;display:flex;align-items:center;justify-content:center;height:140px;gap:24px;">
      <img src="../assets/logo-horizontal-white.png" alt="Starium horizontal blanc" style="max-height:64px;max-width:100%;display:block;">
    </div>
  </div>
</div>
</body></html>
