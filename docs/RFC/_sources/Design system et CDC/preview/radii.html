<!doctype html>
<!-- @dsCard group="Brand" name="Rayons" subtitle="xs→2xl + pill — 14px (lg) est le rayon signature" viewport="700x170" -->
<html><head><meta charset="utf-8"><title>Radii</title>
<link rel="stylesheet" href="_card.css"></head>
<body>
<div class="card-frame">
  <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:10px;">
    <div style="text-align:center;"><div style="height:64px;background:var(--bg-surface);border:1px solid var(--border-subtle);border-radius:4px;"></div><div class="mono tabular" style="font:var(--text-mono);font-size:11px;color:var(--fg-3);margin-top:6px;">xs · 4</div></div>
    <div style="text-align:center;"><div style="height:64px;background:var(--bg-surface);border:1px solid var(--border-subtle);border-radius:6px;"></div><div class="mono tabular" style="font:var(--text-mono);font-size:11px;color:var(--fg-3);margin-top:6px;">sm · 6</div></div>
    <div style="text-align:center;"><div style="height:64px;background:var(--bg-surface);border:1px solid var(--border-subtle);border-radius:10px;"></div><div class="mono tabular" style="font:var(--text-mono);font-size:11px;color:var(--fg-3);margin-top:6px;">md · 10</div></div>
    <div style="text-align:center;"><div style="height:64px;background:var(--bg-surface);border:1px solid var(--border-subtle);border-radius:14px;"></div><div class="mono tabular" style="font:var(--text-mono);font-size:11px;color:var(--fg-3);margin-top:6px;">lg · 14 ★</div></div>
    <div style="text-align:center;"><div style="height:64px;background:var(--bg-surface);border:1px solid var(--border-subtle);border-radius:20px;"></div><div class="mono tabular" style="font:var(--text-mono);font-size:11px;color:var(--fg-3);margin-top:6px;">xl · 20</div></div>
    <div style="text-align:center;"><div style="height:64px;background:var(--bg-surface);border:1px solid var(--border-subtle);border-radius:28px;"></div><div class="mono tabular" style="font:var(--text-mono);font-size:11px;color:var(--fg-3);margin-top:6px;">2xl · 28</div></div>
    <div style="text-align:center;"><div style="height:64px;background:var(--bg-surface);border:1px solid var(--border-subtle);border-radius:999px;"></div><div class="mono tabular" style="font:var(--text-mono);font-size:11px;color:var(--fg-3);margin-top:6px;">pill</div></div>
  </div>
  <div style="margin-top:14px;font:var(--text-body-s);color:var(--fg-3);">★ <span class="mono">--radius-lg</span> 14px = rayon signature des cards.</div>
</div>
</body></html>
