<!doctype html>
<!-- @dsCard group="Brand" name="Badges & statuts" subtitle="Active, statuts de pilotage, métadonnées" viewport="700x180" -->
<html><head><meta charset="utf-8"><title>Badges & status</title>
<link rel="stylesheet" href="_card.css">
<style>
  .badge { display:inline-flex; align-items:center; gap:6px; font:var(--text-caption); font-weight:600; padding:4px 10px; border-radius:999px; }
  .dot { width:6px; height:6px; border-radius:999px; }
  .b-success { background:var(--state-success-bg); color:var(--state-success); }
  .b-warning { background:var(--state-warning-bg); color:var(--state-warning); }
  .b-danger  { background:var(--state-danger-bg);  color:var(--state-danger); }
  .b-info    { background:var(--state-info-bg);    color:var(--state-info); }
  .b-neutral { background:var(--neutral-100);      color:var(--fg-2); }
  .b-active  { background:var(--brand-gold-100);   color:var(--brand-gold-700); }
</style></head>
<body>
<div class="card-frame">
  <div style="display:flex;flex-direction:column;gap:14px;">
    <div style="display:flex;gap:8px;flex-wrap:wrap;">
      <span class="badge b-active"><span class="dot" style="background:var(--brand-gold);"></span>Active</span>
      <span class="badge b-success"><span class="dot" style="background:var(--state-success);"></span>En bonne trajectoire</span>
      <span class="badge b-warning"><span class="dot" style="background:var(--state-warning);"></span>Attention requise</span>
      <span class="badge b-danger">Critique</span>
      <span class="badge b-danger">En retard</span>
      <span class="badge b-info">Élevée</span>
      <span class="badge b-neutral">Brouillon</span>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;">
      <span class="badge b-active" style="padding:2px 8px;font-size:11px;">v2.1</span>
      <span class="badge b-neutral" style="padding:2px 8px;font-size:11px;">PDF</span>
      <span class="badge b-neutral" style="padding:2px 8px;font-size:11px;">2.4 Mo</span>
      <span class="badge b-neutral" style="padding:2px 8px;font-size:11px;">12 derniers mois</span>
    </div>
  </div>
</div>
</body></html>
