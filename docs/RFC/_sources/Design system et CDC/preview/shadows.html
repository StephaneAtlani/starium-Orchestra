<!doctype html>
<!-- @dsCard group="Brand" name="Élévation · ombres" subtitle="shadow-1 à shadow-4 — encre noire faible opacité" viewport="700x200" -->
<html><head><meta charset="utf-8"><title>Shadow & elevation</title>
<link rel="stylesheet" href="_card.css"></head>
<body>
<div class="card-frame">
  <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:18px;padding:20px 8px;">
    <div style="text-align:center;">
      <div style="height:80px;background:var(--bg-surface);border-radius:14px;box-shadow:var(--shadow-1);"></div>
      <div class="mono tabular" style="font:var(--text-mono);font-size:11px;color:var(--fg-3);margin-top:12px;">shadow-1</div>
      <div class="caption" style="font:var(--text-caption);color:var(--fg-3);">KPI cards</div>
    </div>
    <div style="text-align:center;">
      <div style="height:80px;background:var(--bg-surface);border-radius:14px;box-shadow:var(--shadow-2);"></div>
      <div class="mono tabular" style="font:var(--text-mono);font-size:11px;color:var(--fg-3);margin-top:12px;">shadow-2</div>
      <div class="caption" style="font:var(--text-caption);color:var(--fg-3);">cards posées</div>
    </div>
    <div style="text-align:center;">
      <div style="height:80px;background:var(--bg-surface);border-radius:14px;box-shadow:var(--shadow-3);"></div>
      <div class="mono tabular" style="font:var(--text-mono);font-size:11px;color:var(--fg-3);margin-top:12px;">shadow-3</div>
      <div class="caption" style="font:var(--text-caption);color:var(--fg-3);">popovers</div>
    </div>
    <div style="text-align:center;">
      <div style="height:80px;background:var(--bg-surface);border-radius:14px;box-shadow:var(--shadow-4);"></div>
      <div class="mono tabular" style="font:var(--text-mono);font-size:11px;color:var(--fg-3);margin-top:12px;">shadow-4</div>
      <div class="caption" style="font:var(--text-caption);color:var(--fg-3);">modals</div>
    </div>
  </div>
</div>
</body></html>
