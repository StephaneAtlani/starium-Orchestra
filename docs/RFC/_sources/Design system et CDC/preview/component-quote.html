<!doctype html>
<!-- @dsCard group="Brand" name="Card · vision (citation)" subtitle="Card de vision avec icône en anneau doré" viewport="700x220" -->
<html><head><meta charset="utf-8"><title>Card · Quote</title>
<link rel="stylesheet" href="_card.css"></head>
<body>
<div class="card-frame">
  <div style="background:var(--bg-surface);border:1px solid var(--border-subtle);border-radius:14px;padding:24px;box-shadow:var(--shadow-1);">
    <div style="display:flex;gap:14px;align-items:flex-start;">
      <div style="width:40px;height:40px;border-radius:999px;background:var(--brand-gold-100);color:var(--brand-gold);display:flex;align-items:center;justify-content:center;flex-shrink:0;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>
      </div>
      <div style="flex:1;">
        <div class="overline" style="font:var(--text-overline);text-transform:uppercase;letter-spacing:var(--tracking-overline);color:var(--fg-3);margin-bottom:8px;">Notre vision</div>
        <div style="font:var(--text-body-l);color:var(--fg-1);position:relative;">
          <span style="font-size:36px;color:var(--brand-gold);line-height:0;vertical-align:-12px;font-family:Georgia,serif;">"</span>
          Être la référence de confiance de nos clients en délivrant des solutions innovantes et durables, grâce à l'excellence opérationnelle et à l'engagement de nos talents.
        </div>
      </div>
    </div>
  </div>
</div>
</body></html>
