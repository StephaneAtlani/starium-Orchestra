<!doctype html>
<!-- @dsCard group="Brand" name="Échelle de spacing" subtitle="Base 4px — 4 / 8 / 12 / 16 / 24 / 32 / 48 / 64" viewport="700x180" -->
<html><head><meta charset="utf-8"><title>Spacing</title>
<link rel="stylesheet" href="_card.css"></head>
<body>
<div class="card-frame">
  <div style="display:flex;align-items:flex-end;gap:12px;">
    <div style="display:flex;flex-direction:column;align-items:center;gap:6px;"><div style="width:4px;height:4px;background:var(--brand-gold);border-radius:2px;"></div><div class="mono tabular" style="font:var(--text-mono);font-size:11px;color:var(--fg-3);">1 · 4</div></div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:6px;"><div style="width:8px;height:8px;background:var(--brand-gold);border-radius:2px;"></div><div class="mono tabular" style="font:var(--text-mono);font-size:11px;color:var(--fg-3);">2 · 8</div></div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:6px;"><div style="width:12px;height:12px;background:var(--brand-gold);border-radius:2px;"></div><div class="mono tabular" style="font:var(--text-mono);font-size:11px;color:var(--fg-3);">3 · 12</div></div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:6px;"><div style="width:16px;height:16px;background:var(--brand-gold);border-radius:3px;"></div><div class="mono tabular" style="font:var(--text-mono);font-size:11px;color:var(--fg-3);">4 · 16</div></div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:6px;"><div style="width:24px;height:24px;background:var(--brand-gold);border-radius:4px;"></div><div class="mono tabular" style="font:var(--text-mono);font-size:11px;color:var(--fg-3);">6 · 24</div></div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:6px;"><div style="width:32px;height:32px;background:var(--brand-gold);border-radius:4px;"></div><div class="mono tabular" style="font:var(--text-mono);font-size:11px;color:var(--fg-3);">8 · 32</div></div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:6px;"><div style="width:48px;height:48px;background:var(--brand-gold);border-radius:6px;"></div><div class="mono tabular" style="font:var(--text-mono);font-size:11px;color:var(--fg-3);">12 · 48</div></div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:6px;"><div style="width:64px;height:64px;background:var(--brand-gold);border-radius:8px;"></div><div class="mono tabular" style="font:var(--text-mono);font-size:11px;color:var(--fg-3);">16 · 64</div></div>
  </div>
  <div style="margin-top:14px;font:var(--text-body-s);color:var(--fg-3);">Échelle 4px. <span class="mono">--space-N</span> où N est le multiplicateur.</div>
</div>
</body></html>
