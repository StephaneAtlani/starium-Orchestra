<!doctype html>
<!-- @dsCard group="Brand" name="Lockups · monogramme" subtitle="Variations sur fond clair, doré, ink et lockup vertical" viewport="700x200" -->
<html><head><meta charset="utf-8"><title>Brand · Monogram lockups</title>
<link rel="stylesheet" href="_card.css"></head>
<body>
<div class="card-frame">
  <div style="display:flex;gap:16px;">
    <div style="flex:1;background:var(--bg-surface);border:1px solid var(--border-subtle);border-radius:14px;padding:24px;display:flex;flex-direction:column;align-items:center;gap:12px;">
      <img src="../assets/icon-starium.png" alt="" style="height:72px;">
      <div class="caption" style="font:var(--text-caption);color:var(--fg-3);">App icon · 72px</div>
    </div>
    <div style="flex:1;background:var(--brand-gold-050);border:1px solid var(--brand-gold-100);border-radius:14px;padding:24px;display:flex;flex-direction:column;align-items:center;gap:12px;">
      <img src="../assets/icon-starium.png" alt="" style="height:48px;">
      <div class="caption" style="font:var(--text-caption);color:var(--fg-3);">On gold tint</div>
    </div>
    <div style="flex:1;background:var(--brand-ink);border-radius:14px;padding:24px;display:flex;flex-direction:column;align-items:center;gap:12px;">
      <img src="../assets/icon-starium-white.png" alt="" style="height:48px;">
      <div class="caption" style="font:var(--text-caption);color:rgba(255,255,255,0.6);">On ink (white)</div>
    </div>
    <div style="flex:1;background:var(--bg-surface);border:1px solid var(--border-subtle);border-radius:14px;padding:24px;display:flex;flex-direction:column;align-items:center;gap:12px;">
      <img src="../assets/logo-vertical.png" alt="" style="height:96px;">
      <div class="caption" style="font:var(--text-caption);color:var(--fg-3);">Vertical lockup</div>
    </div>
  </div>
</div>
</body></html>
