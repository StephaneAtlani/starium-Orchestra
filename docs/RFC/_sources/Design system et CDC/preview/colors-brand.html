<!doctype html>
<!-- @dsCard group="Brand" name="Couleurs · marque" subtitle="Or Starium (050→700) + ink + surface" viewport="700x320" -->
<html><head><meta charset="utf-8"><title>Colors · Brand</title>
<link rel="stylesheet" href="_card.css"></head>
<body>
<div class="card-frame">
  <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:10px;">
    <div>
      <div style="height:96px;background:var(--brand-gold-050);border-radius:10px;border:1px solid var(--border-subtle);"></div>
      <div style="font:var(--text-caption);color:var(--fg-1);margin-top:8px;">Gold 050</div>
      <div class="mono tabular" style="font:var(--text-mono);color:var(--fg-3);">#FBEAB5</div>
    </div>
    <div>
      <div style="height:96px;background:var(--brand-gold-100);border-radius:10px;"></div>
      <div style="font:var(--text-caption);color:var(--fg-1);margin-top:8px;">Gold 100</div>
      <div class="mono tabular" style="font:var(--text-mono);color:var(--fg-3);">#F4D58A</div>
    </div>
    <div>
      <div style="height:96px;background:var(--brand-gold);border-radius:10px;"></div>
      <div style="font:var(--text-caption);color:var(--fg-1);margin-top:8px;">Gold · primary</div>
      <div class="mono tabular" style="font:var(--text-mono);color:var(--fg-3);">#E8A317</div>
    </div>
    <div>
      <div style="height:96px;background:var(--brand-gold-600);border-radius:10px;"></div>
      <div style="font:var(--text-caption);color:var(--fg-1);margin-top:8px;">Gold 600</div>
      <div class="mono tabular" style="font:var(--text-mono);color:var(--fg-3);">#CC8E0E</div>
    </div>
    <div>
      <div style="height:96px;background:var(--brand-gold-700);border-radius:10px;"></div>
      <div style="font:var(--text-caption);color:var(--fg-1);margin-top:8px;">Gold 700</div>
      <div class="mono tabular" style="font:var(--text-mono);color:var(--fg-3);">#5F3F00</div>
    </div>
  </div>
  <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px;">
    <div>
      <div style="height:64px;background:var(--brand-ink);border-radius:10px;"></div>
      <div style="font:var(--text-caption);color:var(--fg-1);margin-top:8px;">Ink · text & logo</div>
      <div class="mono tabular" style="font:var(--text-mono);color:var(--fg-3);">#0E0E10</div>
    </div>
    <div>
      <div style="height:64px;background:var(--neutral-0);border:1px solid var(--border-subtle);border-radius:10px;"></div>
      <div style="font:var(--text-caption);color:var(--fg-1);margin-top:8px;">Surface · pure</div>
      <div class="mono tabular" style="font:var(--text-mono);color:var(--fg-3);">#FFFFFF</div>
    </div>
  </div>
</div>
</body></html>
