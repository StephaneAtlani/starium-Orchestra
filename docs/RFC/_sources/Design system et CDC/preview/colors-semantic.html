<!doctype html>
<!-- @dsCard group="Brand" name="Couleurs · sémantiques" subtitle="Success / warning / danger / info — pairs text + bg" viewport="700x220" -->
<html><head><meta charset="utf-8"><title>Colors · Semantic</title>
<link rel="stylesheet" href="_card.css"></head>
<body>
<div class="card-frame">
  <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;">
    <div>
      <div style="height:48px;background:var(--state-success-bg);border-radius:10px 10px 0 0;border:1px solid var(--state-success-bg);border-bottom:none;display:flex;align-items:center;justify-content:center;font:var(--text-body-s);color:var(--state-success);font-weight:600;">En bonne trajectoire</div>
      <div style="height:48px;background:var(--state-success);border-radius:0 0 10px 10px;"></div>
      <div style="font:var(--text-caption);color:var(--fg-1);margin-top:8px;">Success</div>
      <div class="mono tabular" style="font:var(--text-mono);color:var(--fg-3);font-size:11px;">#1F8A5B / #E6F4ED</div>
    </div>
    <div>
      <div style="height:48px;background:var(--state-warning-bg);border-radius:10px 10px 0 0;display:flex;align-items:center;justify-content:center;font:var(--text-body-s);color:var(--state-warning);font-weight:600;">Attention requise</div>
      <div style="height:48px;background:var(--state-warning);border-radius:0 0 10px 10px;"></div>
      <div style="font:var(--text-caption);color:var(--fg-1);margin-top:8px;">Warning</div>
      <div class="mono tabular" style="font:var(--text-mono);color:var(--fg-3);font-size:11px;">#C77A00 / #FFF1DC</div>
    </div>
    <div>
      <div style="height:48px;background:var(--state-danger-bg);border-radius:10px 10px 0 0;display:flex;align-items:center;justify-content:center;font:var(--text-body-s);color:var(--state-danger);font-weight:600;">Critique</div>
      <div style="height:48px;background:var(--state-danger);border-radius:0 0 10px 10px;"></div>
      <div style="font:var(--text-caption);color:var(--fg-1);margin-top:8px;">Danger</div>
      <div class="mono tabular" style="font:var(--text-mono);color:var(--fg-3);font-size:11px;">#B42318 / #FBE8E6</div>
    </div>
    <div>
      <div style="height:48px;background:var(--state-info-bg);border-radius:10px 10px 0 0;display:flex;align-items:center;justify-content:center;font:var(--text-body-s);color:var(--state-info);font-weight:600;">Information</div>
      <div style="height:48px;background:var(--state-info);border-radius:0 0 10px 10px;"></div>
      <div style="font:var(--text-caption);color:var(--fg-1);margin-top:8px;">Info</div>
      <div class="mono tabular" style="font:var(--text-mono);color:var(--fg-3);font-size:11px;">#2A6FDB / #E3EEFB</div>
    </div>
  </div>
</div>
</body></html>
