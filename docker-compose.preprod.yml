# =============================================================================
# Starium Orchestra — Docker Compose PRÉPROD (fichier autonome Dokploy)
# =============================================================================
#
# Dokploy : Compose file = docker-compose.preprod.yml
#   docker compose -f ./docker-compose.preprod.yml up -d --build
#
# SMTP forcé MailHog (UAT clients, DCP réelles — aucun envoi Internet).
# UI MailHog : domaine Dokploy → service mailhog, port 8025.
#
# Env Dokploy obligatoires : JWT_SECRET, MFA_ENCRYPTION_KEY (= prod si MFA),
# APP_PUBLIC_URL, WEB_ORIGIN, NEXT_PUBLIC_API_URL.
# Ne pas définir SMTP_HOST / SMTP_USER / SMTP_PASS (Brevo) sur cet environnement.
#
# Réseau dédié préprod : `starium-preprod-network` (créé par Compose).
# Dokploy injecte `dokploy-network` (external) dès qu’un domaine est dans l’UI.
# Le service `ensure-dokploy-network` le crée au deploy si absent.
# =============================================================================

networks:
  # Réseau isolé préprod (pas le dokploy-network de la prod).
  starium-preprod-network:
    name: starium-preprod-network
    driver: bridge

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    networks:
      - default
      - starium-preprod-network
    environment:
      POSTGRES_USER: starium
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-starium}
      POSTGRES_DB: starium
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U starium -d starium"]
      interval: 2s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      - default
      - starium-preprod-network
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 10

  mailhog:
    image: mailhog/mailhog:latest
    restart: unless-stopped
    networks:
      - default
      - starium-preprod-network
    # 8025 = UI (domaine Dokploy) · 1025 = SMTP (api / api-worker)
    expose:
      - "1025"
      - "8025"

  # Dokploy attache api/web à `dokploy-network` (external). S’il manque,
  # ce one-shot le crée AVANT le start de l’API (docker.sock hôte).
  ensure-dokploy-network:
    image: docker:27-cli
    restart: "no"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command:
      - sh
      - -c
      - docker network inspect dokploy-network >/dev/null 2>&1 || docker network create --driver bridge --attachable dokploy-network; docker ps -aqf name=traefik | xargs -n1 -I{} docker network connect dokploy-network {} || true

  api:
    image: starium-orchestra-api:preprod
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    # Débloque P3009 (toutes migrations failed) puis migrate + start.
    command:
      - node
      - scripts/preprod-api-entrypoint.cjs
    networks:
      - default
      - starium-preprod-network
    environment:
      DATABASE_URL: postgresql://starium:${POSTGRES_PASSWORD:-starium}@postgres:5432/starium
      PORT: "3001"
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET:-change-me-in-prod}
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY}
      MFA_KEY_VERSION: ${MFA_KEY_VERSION:-1}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      MICROSOFT_OAUTH_STATE_STORE: ${MICROSOFT_OAUTH_STATE_STORE:-db}
      # MailHog — littéraux (pas d’interpolation env Dokploy)
      SMTP_HOST: mailhog
      SMTP_PORT: "1025"
      SMTP_SECURE: "false"
      SMTP_FROM: ${SMTP_FROM:-noreply@preprod.starium.local}
      SMTP_REQUIRE_TLS: "false"
      SMTP_TIMEOUT_MS: ${SMTP_TIMEOUT_MS:-10000}
      EMAIL_IDENTITY_VERIFY_SUCCESS_URL: ${EMAIL_IDENTITY_VERIFY_SUCCESS_URL:-}
      EMAIL_IDENTITY_VERIFY_ERROR_URL: ${EMAIL_IDENTITY_VERIFY_ERROR_URL:-}
      EMAIL_IDENTITY_VERIFY_TOKEN_TTL_HOURS: ${EMAIL_IDENTITY_VERIFY_TOKEN_TTL_HOURS:-24}
      EMAIL_IDENTITY_VERIFY_RESEND_COOLDOWN_MINUTES: ${EMAIL_IDENTITY_VERIFY_RESEND_COOLDOWN_MINUTES:-15}
      EMAIL_DELIVERIES_INLINE: "false"
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-https://preprod.starium.xyz}
      WEB_ORIGIN: ${WEB_ORIGIN:-https://preprod.starium.xyz}
      MICROSOFT_M365_SYNC_REDIRECT_URI: ${MICROSOFT_M365_SYNC_REDIRECT_URI:-}
      PROCUREMENT_LOCAL_ROOT: /data/procurement-blobs
      PROCUREMENT_S3_ENDPOINT: ${PROCUREMENT_S3_ENDPOINT:-}
      PROCUREMENT_S3_ACCESS_KEY: ${PROCUREMENT_S3_ACCESS_KEY:-}
      PROCUREMENT_S3_SECRET_KEY: ${PROCUREMENT_S3_SECRET_KEY:-}
      PROCUREMENT_S3_BUCKET: ${PROCUREMENT_S3_BUCKET:-starium-procurement}
      PROCUREMENT_S3_REGION: ${PROCUREMENT_S3_REGION:-}
      PROCUREMENT_S3_USE_SSL: ${PROCUREMENT_S3_USE_SSL:-false}
      PROCUREMENT_S3_FORCE_PATH_STYLE: ${PROCUREMENT_S3_FORCE_PATH_STYLE:-true}
    expose:
      - "3001"
    volumes:
      - procurement_blobs:/data/procurement-blobs
    depends_on:
      ensure-dokploy-network:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailhog:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "const net=require('net');const s=net.createConnection({host:'127.0.0.1',port:3001},()=>{s.end();process.exit(0)});s.on('error',()=>process.exit(1));setTimeout(()=>process.exit(1),2000);",
        ]
      interval: 10s
      timeout: 3s
      retries: 60
      start_period: 600s

  # Même tag + même Dockerfile que `api` → Compose ne rebuild qu’une fois.
  api-worker:
    image: starium-orchestra-api:preprod
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    networks:
      - default
      - starium-preprod-network
    command: ["node", "apps/api/dist/worker/main.js"]
    environment:
      DATABASE_URL: postgresql://starium:${POSTGRES_PASSWORD:-starium}@postgres:5432/starium
      PORT: "3001"
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET:-change-me-in-prod}
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY}
      MFA_KEY_VERSION: ${MFA_KEY_VERSION:-1}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      MICROSOFT_OAUTH_STATE_STORE: ${MICROSOFT_OAUTH_STATE_STORE:-db}
      SMTP_HOST: mailhog
      SMTP_PORT: "1025"
      SMTP_SECURE: "false"
      SMTP_FROM: ${SMTP_FROM:-noreply@preprod.starium.local}
      SMTP_REQUIRE_TLS: "false"
      SMTP_TIMEOUT_MS: ${SMTP_TIMEOUT_MS:-10000}
      EMAIL_IDENTITY_VERIFY_SUCCESS_URL: ${EMAIL_IDENTITY_VERIFY_SUCCESS_URL:-}
      EMAIL_IDENTITY_VERIFY_ERROR_URL: ${EMAIL_IDENTITY_VERIFY_ERROR_URL:-}
      EMAIL_IDENTITY_VERIFY_TOKEN_TTL_HOURS: ${EMAIL_IDENTITY_VERIFY_TOKEN_TTL_HOURS:-24}
      EMAIL_IDENTITY_VERIFY_RESEND_COOLDOWN_MINUTES: ${EMAIL_IDENTITY_VERIFY_RESEND_COOLDOWN_MINUTES:-15}
      EMAIL_DELIVERIES_INLINE: "false"
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-https://preprod.starium.xyz}
      WEB_ORIGIN: ${WEB_ORIGIN:-https://preprod.starium.xyz}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailhog:
        condition: service_started
      api:
        condition: service_started

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api-preprod.starium.xyz}
        INTERNAL_API_URL: http://api:3001
    restart: unless-stopped
    networks:
      - default
      - starium-preprod-network
    environment:
      INTERNAL_API_URL: http://api:3001
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api-preprod.starium.xyz}
    expose:
      - "3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data: {}
  procurement_blobs: {}
